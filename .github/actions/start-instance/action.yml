name: Start an open-dpp Instance
description: >
  Boots a throwaway Instance from an open-dpp checkout, the way the E2E and the Conformance
  Validation Run workflows test it: the Docker infrastructure of docker-compose.dev.yml, a full
  build, the frontend on Vite (:5173) and the backend from apps/main/dist. The caller sets up pnpm
  and Node.js first and provides the app's OPEN_DPP_* and VITE_API_ROOT variables as job env, since
  they follow the env schema of the checkout being booted. Logs go to /tmp/app.log and
  /tmp/vite.log; the backend is ready once $OPEN_DPP_URL/api/v2/status answers.

inputs:
  path:
    description: Directory of the open-dpp checkout to boot, relative to the workspace.
    required: false
    default: "."

runs:
  using: composite
  steps:
    # The keyfile is gitignored, and MongoDB runs as uid 999 with a read-only
    # --keyFile mount, so it needs that owner and mode 0400 or Mongo refuses
    # to start.
    - name: Generate MongoDB key file
      shell: bash
      working-directory: ${{ inputs.path }}
      run: |
        openssl rand -base64 756 > docker/mongo_keyfile
        chmod 0400 docker/mongo_keyfile
        sudo chown 999:999 docker/mongo_keyfile

    - name: Start infrastructure
      shell: bash
      working-directory: ${{ inputs.path }}
      run: docker compose -f docker-compose.dev.yml up -d

    # The init containers have no healthcheck; each exits once it is done
    # (rs.initiate for Mongo, bucket creation for the object store). The
    # replica set is mandatory because the app uses transactions. They are
    # found by their `-init` suffix, so the step holds for every compose file
    # version. `docker wait` also returns for containers that have already
    # exited, unlike `docker compose wait`, which errors when none of its
    # targets is still running.
    - name: Wait for the init containers
      shell: bash
      working-directory: ${{ inputs.path }}
      run: |
        services=$(docker compose -f docker-compose.dev.yml config --services | grep -- '-init$')
        for service in $services; do
          code=$(docker wait "$(docker compose -f docker-compose.dev.yml ps -aq "$service")")
          echo "$service exited with status $code"
          [ "$code" = "0" ] || exit 1
        done

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.path }}
      run: pnpm install --frozen-lockfile

    # Also builds packages/env, whose schema a Playwright process in this
    # checkout parses.
    - name: Build project
      shell: bash
      working-directory: ${{ inputs.path }}
      run: pnpm build

    # Serve the frontend from Vite, exactly like `pnpm run dev` does: the
    # backend proxies every non-/api route to :5173.
    #
    # NODE_ENV is deliberately left unset. Setting it to "production" would
    # make the backend serve a static bundle instead, but it also switches
    # better-auth's rate limiter on (it defaults to `enabled: isProduction`),
    # and that caps /sign-in, /sign-up and /change-email at 3 requests per 10
    # seconds per IP. Every request from a runner shares one IP, so the suite
    # would 429 on its own fixtures.
    - name: Start frontend
      shell: bash
      working-directory: ${{ inputs.path }}
      run: |
        nohup pnpm --filter @open-dpp/client exec vite --port 5173 --strictPort \
          > /tmp/vite.log 2>&1 &
        for _ in $(seq 1 30); do
          if curl -fsS http://localhost:5173 > /dev/null; then
            echo "Frontend is ready"
            exit 0
          fi
          sleep 2
        done
        echo "Frontend did not become ready within 60s"
        cat /tmp/vite.log
        exit 1

    - name: Start backend
      shell: bash
      working-directory: ${{ inputs.path }}
      run: |
        nohup node apps/main/dist/main.js > /tmp/app.log 2>&1 &
        for _ in $(seq 1 60); do
          if curl -fsS "$OPEN_DPP_URL/api/v2/status" > /dev/null; then
            echo "Backend is ready"
            exit 0
          fi
          sleep 2
        done
        echo "Backend did not become ready within 120s"
        cat /tmp/app.log
        exit 1
