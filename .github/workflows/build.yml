name: Build and push Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: 24
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NODE_VERSION: 24
      # Common
      OPEN_DPP_PORT: "3000"
      OPEN_DPP_URL: "http://dpp.example.de"
      # MongoDB
      OPEN_DPP_MONGODB_PORT: "27017"
      OPEN_DPP_MONGODB_HOST: "localhost"
      OPEN_DPP_MONGODB_USER: "admin"
      OPEN_DPP_MONGODB_PASSWORD: "test-mongo-password"
      OPEN_DPP_MONGODB_DATABASE: "management"
      # AI
      OPEN_DPP_MISTRAL_API_KEY: "your-mistral-key"
      OPEN_DPP_OLLAMA_URL: "https://ollama-url"
      # S3
      OPEN_DPP_S3_ENDPOINT: "minio"
      OPEN_DPP_S3_PORT: "9000"
      OPEN_DPP_S3_SSL: "false"
      OPEN_DPP_S3_ACCESS_KEY: "minioadmin"
      OPEN_DPP_S3_SECRET_KEY: "test-minio-password"
      OPEN_DPP_S3_DEFAULT_BUCKET: "dpp"
      OPEN_DPP_S3_PROFILE_PICTURE_BUCKET: "profile-pictures"
      # ClamAV
      OPEN_DPP_CLAMAV_URL: "http://clamav-rest"
      OPEN_DPP_CLAMAV_PORT: "9000"
      # Mail
      OPEN_DPP_MAIL_HOST: "localhost"
      OPEN_DPP_MAIL_PORT: "8026"
      OPEN_DPP_MAIL_USER: "admin"
      OPEN_DPP_MAIL_PASSWORD: "admin"
      OPEN_DPP_MAIL_SENDER_ADDRESS: "open-dpp"
      OPEN_DPP_MAIL_MAILPIT_SMTP_AUTH: "admin:admin"
      OPEN_DPP_MAIL_MAILPIT_SMTP_ALLOW_INSECURE: "true"
      # Auth
      OPEN_DPP_AUTH_SECRET: "change-this-to-a-good-secret"
      OPEN_DPP_AUTH_CLOUD_ENABLED: "false"
      OPEN_DPP_AUTH_CLOUD_PROVIDER: ""
      OPEN_DPP_AUTH_CLOUD_CLIENT_ID: ""
      OPEN_DPP_AUTH_CLOUD_CLIENT_SECRET: ""
      OPEN_DPP_AUTH_CLOUD_DISCOVERY_URL: ""
      # Frontend
      VITE_API_ROOT: "http://localhost"

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install pnpm
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # Step 3: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      # Step 4: See https://docs.cypress.io/app/get-started/install-cypress#pnpm-configuration
      - name: Disable pnpm side-effects cache
        run: pnpm config set side-effects-cache false --location project

      # Step 5: Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Step 6: Build project
      - name: Build project
        run: pnpm build

      # Step 7: Build testing support package
      - name: Build project
        run: cd packages/testing && pnpm build

      # Step 8: Run tests
      - name: Run tests
        run: pnpm test:ci

  build-and-push:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            target: production
            image_suffix: ""
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            target: production
            image_suffix: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image_suffix }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # `steps.meta.outputs.version` is the primary *Docker tag*, which is the
      # branch name on a `main` push and `sha-<short-sha>` on a pull request.
      # Baking that into the image made the UI show "vmain" instead of a
      # version, so derive the application version from the package instead.
      - name: Resolve application version
        id: app_version
        # A ref name may contain shell metacharacters, so both values reach the
        # script through the environment rather than through `${{ }}` expansion,
        # which would splice a crafted tag name into this shell.
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          package_version=$(jq -r '.version' apps/main/package.json)
          if [ -z "$package_version" ] || [ "$package_version" = "null" ]; then
            echo "::error::Could not read .version from apps/main/package.json" >&2
            exit 1
          fi

          if [ "$REF_TYPE" = "tag" ]; then
            # A release build: the tag it was dispatched for is authoritative.
            version="$REF_NAME"
            version="${version#v}"
            if [ "$version" != "$package_version" ]; then
              printf '::warning::Tag %s does not match apps/main/package.json version %s; using %s\n' \
                "$REF_NAME" "$package_version" "$version"
            fi
          else
            # Not a release: mark it with the commit so a :latest or PR image is
            # distinguishable from the released version. `+` starts semver build
            # metadata, so this stays a valid semantic version.
            version="${package_version}+sha.${GITHUB_SHA:0:7}"
          fi

          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'Resolved APP_VERSION=%s\n' "$version"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          target: ${{ matrix.target }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.app_version.outputs.value }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image_suffix }}:build-cache-${{ matrix.target }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=registry,mode=max,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image_suffix }}:build-cache-${{ matrix.target }}-${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image_suffix }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests/${{ matrix.target }}
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${{ matrix.target }}/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.target }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [production]
        include:
          - target: production
            image_suffix: ""
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: /tmp/digests/${{ matrix.target }}
          pattern: digests-${{ matrix.target }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image_suffix }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Create manifest list and push
        run: |
          dir="/tmp/digests/${{ matrix.target }}"
          if [ ! -d "$dir" ] || [ -z "$(ls -A "$dir")" ]; then
            echo "No digests found in $dir, skipping manifest creation."
            exit 0
          fi
          cd "$dir"
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image_suffix }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          dir="/tmp/digests/${{ matrix.target }}"
          if [ ! -d "$dir" ] || [ -z "$(ls -A "$dir")" ]; then
            echo "No digests found in $dir, skipping image inspection."
            exit 0
          fi
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image_suffix }}:${{ steps.meta.outputs.version }}

  trigger-demo-deploy:
    needs: merge
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to cloud-deployment
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
        run: |
          curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/open-dpp/cloud-deployment/dispatches \
          -d '{"event_type":"deploy-demo"}'
