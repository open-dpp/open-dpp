name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write
  id-token: write

env:
  NODE_VERSION: 26

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Publish only while the current version has no release tag, which in
      # practice is the push that merges the "chore: version packages" PR. Any
      # other push to main would re-run `changeset publish`, and right after a
      # release npm can still report the new version as unpublished, so it
      # tries again and fails with E409. Release runs are serialized, so the
      # next run already sees the tag the publishing run pushed. A publish that
      # failed, or whose run was cancelled while pending, left no tag, so the
      # next push retries it. The fixed group moves every version together, so
      # api-client stands in for all of them.
      - name: Decide whether to publish
        id: plan
        run: |
          set -euo pipefail

          version=$(jq -r .version packages/api-client/package.json)
          # --exit-code: 0 = tag exists, 2 = no such tag, anything else = error.
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null || status=$?
          case "$status" in
            0) unreleased=false ;;
            2) unreleased=true ;;
            *) echo "::error::Could not look up tag v$version on origin (git exit $status)" >&2; exit 1 ;;
          esac

          # The files @changesets/read treats as changesets.
          pending=$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name '.*' ! -iname README.md | wc -l)

          # changesets/action never publishes while changesets are pending: it
          # opens the version PR instead, and still reads `publish` to word that
          # PR's description ("merge this and the packages will be published").
          # An empty `publish` makes it skip publishing.
          if [ "$unreleased" = true ] || [ "$pending" -gt 0 ]; then
            publish='pnpm release'
          else
            publish=''
          fi

          echo "Version $version (unreleased=$unreleased), $pending pending changeset(s), publish='$publish'"
          {
            echo "unreleased=$unreleased"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

      - name: Guard against burned npm versions
        if: steps.plan.outputs.unreleased == 'true'
        run: |
          set -euo pipefail

          # Fetch `npm view <name> <field> --json` and echo the JSON. A clean
          # E404 (package not published yet — e.g. a new package's first
          # release) yields `{}`, so it contributes no burned versions. Any
          # other failure (network, auth, registry/parse error) aborts the
          # step rather than being silently treated as "no burned versions",
          # which would let a burned target slip through to a failed publish.
          npm_meta() {
            local out
            if out=$(npm view "$1" "$2" --json 2>&1); then
              printf '%s' "$out"
            elif grep -qi 'E404' <<<"$out"; then
              printf '{}'
            else
              echo "::error::npm view $1 $2 failed: $out" >&2
              return 1
            fi
          }

          fail=0
          while IFS= read -r pkg_json; do
            [ "$(jq -r '.private // false' "$pkg_json")" = "true" ] && continue
            name=$(jq -r '.name' "$pkg_json")
            version=$(jq -r '.version' "$pkg_json")
            ever=$(npm_meta "$name" time \
              | jq -r 'try (keys[]) catch empty | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+"))' \
              | sort -u)
            live=$(npm_meta "$name" versions \
              | jq -r 'if type=="array" then .[] elif type=="string" then . else empty end' \
              | sort -u)
            burned=$(comm -23 <(printf '%s\n' "$ever") <(printf '%s\n' "$live") | sed '/^$/d')
            if printf '%s\n' "$burned" | grep -qxF "$version"; then
              echo "::error::$name@$version is a burned npm version (published then unpublished; npm permanently reserves the number). Bump the fixed group past the burned range — see docs/adr/0001." >&2
              fail=1
            fi
          done < <(find apps packages docs -maxdepth 2 -name package.json -not -path '*/node_modules/*')
          if [ "$fail" -ne 0 ]; then
            echo "::error::Refusing to publish: one or more target versions are burned on npm." >&2
            exit 1
          fi
          echo "No burned target versions detected; safe to publish."

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm version-packages
          publish: ${{ steps.plan.outputs.publish }}
          title: "chore: version packages"
          commit: "chore: version packages"
          # One combined `v<version>` release is created below instead of one
          # release per published package.
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push repo-wide version tag
        id: version-tag
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          set -euo pipefail
          version=$(jq -r '.[0].version' <<< "$PUBLISHED_PACKAGES")
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "Could not determine published version from changesets output" >&2
            exit 1
          fi
          tag="v$version"
          git fetch origin --tags --force
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            existing_sha=$(git rev-parse "refs/tags/$tag^{commit}")
            if [ "$existing_sha" != "$GITHUB_SHA" ]; then
              echo "Tag $tag already exists at $existing_sha (expected $GITHUB_SHA)" >&2
              exit 1
            fi
            echo "Tag $tag already exists at $GITHUB_SHA, skipping push."
          else
            git tag "$tag"
            git push origin "$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version-tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists, skipping."
            exit 0
          fi
          node scripts/release-notes.mjs "${RELEASE_TAG#v}" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Trigger versioned Docker build
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version-tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG"
