services:
  api-mongo-db:
    restart: unless-stopped
    ports:
      - "${OPEN_DPP_MONGODB_PORT:-27017}:${OPEN_DPP_MONGODB_PORT:-27017}"
    container_name: api-mongo-db
    user: "999:999"
    command:
      [
        "--replSet",
        "rs0",
        "--bind_ip_all",
        "--port",
        "${OPEN_DPP_MONGODB_PORT:-27017}",
        "--keyFile",
        "/etc/mongo/mongo_keyfile",
      ]
    logging:
      options:
        max-size: 1g
    volumes:
      - ./docker/mongo_keyfile:/etc/mongo/mongo_keyfile:ro
      - mongo_db:/data/db
      - mongo_config:/data/configdb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${OPEN_DPP_MONGODB_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${OPEN_DPP_MONGODB_PASSWORD}
      - MONGO_INITDB_DATABASE=${OPEN_DPP_MONGODB_DATABASE}
    image: mongo:7

  mongo-init:
    image: mongo:7
    depends_on:
      - api-mongo-db
    command: >
      bash -c "until mongosh --host api-mongo-db --port ${OPEN_DPP_MONGODB_PORT:-27017} --eval 'db.runCommand({ ping: 1 })'; do echo 'Waiting for Mongo...'; sleep 1; done && mongosh --host api-mongo-db --port ${OPEN_DPP_MONGODB_PORT:-27017} -u ${OPEN_DPP_MONGODB_USER} -p ${OPEN_DPP_MONGODB_PASSWORD} --authenticationDatabase admin --eval 'try { var c = rs.conf(); if (c.members[0].host !== \"api-mongo-db:${OPEN_DPP_MONGODB_PORT:-27017}\") { c.members[0].host = \"api-mongo-db:${OPEN_DPP_MONGODB_PORT:-27017}\"; rs.reconfig(c, {force: true}); } } catch (e) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"api-mongo-db:${OPEN_DPP_MONGODB_PORT:-27017}\"}]}) }'"

  # S3-compatible object storage. RustFS replaces MinIO (community edition
  # archived, images pulled from Docker Hub in 2025): Apache-2.0, one
  # multi-arch container, object versioning, a /health/ready endpoint.
  rustfs:
    container_name: rustfs
    image: rustfs/rustfs:1.0.0-rc.6
    environment:
      - RUSTFS_ACCESS_KEY=${OPEN_DPP_S3_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${OPEN_DPP_S3_SECRET_KEY}
    volumes:
      - rustfs_data:/data
    ports:
      - "${OPEN_DPP_S3_PORT}:9000" # S3 API
      - "9001:9001" # RustFS console (web UI)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

  # Creates both buckets with object versioning enabled; idempotent, so it is
  # safe to re-run against an existing volume. Nothing reads the buckets
  # anonymously (the backend proxies downloads), so no public-read policy.
  rustfs-init:
    image: rustfs/rc:v0.1.35
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -ec "
      rc alias set local http://rustfs:9000 ${OPEN_DPP_S3_ACCESS_KEY} ${OPEN_DPP_S3_SECRET_KEY};
      rc bucket create local/${OPEN_DPP_S3_DEFAULT_BUCKET} --ignore-existing --with-versioning;
      rc bucket create local/${OPEN_DPP_S3_PROFILE_PICTURE_BUCKET} --ignore-existing --with-versioning;
      "

  mailpit:
    container_name: mailpit
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "8026:1025"
    environment:
      - MP_SMTP_AUTH=${OPEN_DPP_MAIL_MAILPIT_SMTP_AUTH}
      - MP_SMTP_AUTH_ALLOW_INSECURE=${OPEN_DPP_MAIL_MAILPIT_SMTP_ALLOW_INSECURE}

volumes:
  caddy_data:
  caddy_config:
  rustfs_data:
  mongo_db:
  mongo_config:
  api_db:
