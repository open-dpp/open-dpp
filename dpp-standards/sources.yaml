  - id: ISO21778
    tier: C
    title: Information technology – The JSON data interchange syntax
    reference: ISO/IEC 21778:2017 (identical to ECMA-404, 2nd edition, December 2017)
    publisher: ISO/IEC and Ecma International
    edition: 2017 edition; assessed on the free ECMA-404 text
    stage: Published
    access: public
    url: https://ecma-international.org/wp-content/uploads/ECMA-404_2nd_edition_december_2017.pdf
    watch:
      url: https://www.iso.org/standard/71616.html
