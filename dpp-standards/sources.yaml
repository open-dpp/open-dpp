    reference: ISO/IEC 646:1991 (identical to ECMA-6, 6th edition, December 1991)
    publisher: ISO/IEC and Ecma International
    edition: 1991 edition, as EN 18219 4.3.2(1) dates it; read through the free ECMA-6 text (a read-through of EN 18219, no matrix file)
    stage: Published
    access: public
    url: https://ecma-international.org/publications-and-standards/standards/ecma-6/
    watch:
      url: https://www.iso.org/standard/4777.html
      lookFor: A new edition (none expected)
  - id: ISO10646
    tier: C
    title: Information technology – Universal coded character set (UCS)
    reference: ISO/IEC 10646:2020
    publisher: ISO/IEC
    edition: 6th edition 2020, as EN 18219 4.3.2(1) dates it; read through, from the ISO publicly available standards (a read-through of EN 18219, no matrix file)
    stage: Published; amendments track Unicode
    access: public
    url: https://standards.iso.org/ittf/PubliclyAvailableStandards/index.html
    watch:
      url: https://standards.iso.org/ittf/PubliclyAvailableStandards/index.html
      lookFor: An EN 18219 amendment updating the dated reference
  - id: RFC3986
    tier: C
    title: Uniform Resource Identifier (URI) – Generic Syntax
    reference: IETF RFC 3986 (STD 66), January 2005
    publisher: IETF
    edition: RFC 3986, January 2005, as EN 18219 4.3.2(1) dates it (a read-through of EN 18219, no matrix file)
    stage: Internet Standard
    access: public
