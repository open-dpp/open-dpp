    watch:
      url: https://www.iec.ch/dyn/www/f?p=103:23:::::FSP_ORG_ID,FSP_LANG_ID:1452,25
      lookFor: 65E/1196/CDV (61406-1 Ed. 2) reaching FDIS or publication
  - id: GS1DL
    tier: C
    title: GS1 Digital Link URI Syntax and GS1-Conformant Resolver
