  - id: ISO18004
    tier: C
    title: Information technology – Automatic identification and data capture techniques – QR code bar code symbology specification
    reference: ISO/IEC 18004:2024
    publisher: ISO/IEC
    edition: Edition 4, 2024-08, as EN 18220 6.2.3 dates it; read through EN 18220's own restatement (a quiet zone of four modules in the notes of its Annexes A to C, the error-correction levels and module counts of its Annex B) and the conformance Checks that decode and measure the QR Code open-dpp renders; not bought (a read-through of EN 18220, no matrix file)
