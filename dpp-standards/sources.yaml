# Register of every text the Conformance Review assesses. One entry per source id; matrix files
# reference the id in their `standard` field. Rules and field meanings: README.md, src/schema.ts.
# Verified against research/public-sources.md (2026-09-03).
sources:
  # ---- Tier A: EU law -------------------------------------------------------------------------
  - id: ESPR
    tier: A
    title: Ecodesign for Sustainable Products Regulation
    short: ESPR 2024/1781
    reference: Regulation (EU) 2024/1781
    publisher: European Union
    edition: Consolidated text CELEX 02024R1781-20240628 (corrigenda of 7.8.2024 and 28.4.2025)
    stage: In force since 18 July 2024
    access: public
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1781-20240628
    normativeReferences: [ISO15459]
    watch:
      url: https://publications.europa.eu/webapi/rdf/sparql
      lookFor: A newer consolidated CELEX 02024R1781-* or a new corrigendum, found with research/eurlex-dpp-acts.rq
  - id: BATT
    tier: A
    title: Batteries Regulation
    short: Batteries 2023/1542
    reference: Regulation (EU) 2023/1542
    publisher: European Union
    edition: Consolidated text CELEX 02023R1542-20250731 (corrigenda up to 10.4.2026)
    stage: In force; the battery passport obligation applies from 18 February 2027 (Art. 77(1))
    access: public
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02023R1542-20250731
    normativeReferences: [ISO15459]
    watch:
      url: https://publications.europa.eu/webapi/rdf/sparql
      lookFor: The Art. 77(9) implementing act on legitimate-interest access (was due 2026-08-18) and any newer consolidated text
  - id: REG1778
    tier: A
    title: DPP registry implementation arrangements
    short: Registry 2026/1778
    reference: Commission Implementing Regulation (EU) 2026/1778
    publisher: European Union
    edition: CELEX 32026R1778 (OJ L, 17.7.2026), no consolidated version
    stage: In force from the twentieth day after publication (Art. 24); national registry administrators by 18 February 2027
    access: public
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32026R1778
    watch:
      url: https://single-market-economy.ec.europa.eu/single-market/digital-product-passport/dpp-registry_en
      lookFor: Registry API documentation, the token issuance procedure (Art. 2(3)), the semantic repository URL (Art. 12) and the list of verified DPP service providers (Art. 3(f))
  - id: DEC1736
    tier: A
    title: Harmonised standards for digital product passports
    short: Standards Dec. 2026/1736
    reference: Commission Implementing Decision (EU) 2026/1736
    publisher: European Union
    edition: CELEX 32026D1736 (OJ L, 15.7.2026)
    stage: In force since 15 July 2026; cites six ENs as a set, EN 18239 and EN 18246 not yet
    access: public
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32026D1736
    watch:
      url: https://single-market-economy.ec.europa.eu/single-market/goods/european-standards/harmonised-standards/digital-product-passport-dpp_en
      lookFor: A second implementing decision citing EN 18239 and EN 18246 (expected September 2026)

  # ---- Tier A, Sector laws (decided 2026-09-06 in #767): DPPs mandated outside ESPR, registered in
  # ---- the ESPR registry; ESPR-restating clauses are Mirrors of the ESPR rows ----------------------
  - id: CPR
    tier: A
    title: Construction Products Regulation
    short: CPR 2024/3110
    reference: Regulation (EU) 2024/3110
    publisher: European Union
    edition: CELEX 32024R3110 (OJ L, 18.12.2024), no consolidated version
    stage: In force since 7 January 2025, applies from 8 January 2026; the DPP duty (Art. 22(7)) applies 18 months after the Art. 75(1) delegated act enters into force, which has no deadline and is not adopted; the CPR prevails over ESPR in a conflict (Art. 12(2))
    access: public
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32024R3110
    watch:
      url: https://publications.europa.eu/webapi/rdf/sparql
      lookFor: The Art. 75(1) delegated act setting up the construction DPP system (it may lay down alternative identifier, carrier and registry rules, Art. 75(2)(h)), the Art. 80(2) amending acts and any consolidated text, found with research/eurlex-dpp-acts.rq
  - id: TOYS
    tier: A
    title: Toy Safety Regulation
    short: Toys 2025/2509
    reference: Regulation (EU) 2025/2509
    publisher: European Union
    edition: CELEX 32025R2509 (OJ L, 12.12.2025), no consolidated version
    stage: In force since 1 January 2026; applies from 1 August 2030 (Art. 59), the toy passport with it; the Art. 49(1) delegated act on its technical requirements has no deadline and is not adopted
    access: public
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32025R2509
    watch:
      url: https://publications.europa.eu/webapi/rdf/sparql
      lookFor: The Art. 49(1) delegated act on the technical requirements of the toy passport, the Art. 49(2)-(3) acts amending Annex VI or the registry content, the optional Art. 22(2) implementing act on registry arrangements and any consolidated text, found with research/eurlex-dpp-acts.rq
  - id: DET
    tier: A
    title: Detergents and Surfactants Regulation
    short: Detergents 2026/405
    reference: Regulation (EU) 2026/405
    publisher: European Union
    edition: CELEX 32026R0405 (OJ L, 2.3.2026), no consolidated version
    stage: In force since 22 March 2026; applies from 23 September 2029 (Art. 37), the detergent passport with it, with a one-year grace for products compliant with Regulation (EC) No 648/2004 (Art. 36(2)); the Art. 21(10) implementing act on its basic technical requirements has no deadline and is not adopted
    access: public
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32026R0405
    watch:
      url: https://publications.europa.eu/webapi/rdf/sparql
      lookFor: The Art. 21(10) implementing act on the basic technical requirements of the detergent passport, the Art. 30(2)-(3) acts amending Annex VI or the registry content, the Art. 30(10) digital-labelling delegated act (due 1 October 2028, it shares the data carrier) and any consolidated text, found with research/eurlex-dpp-acts.rq

