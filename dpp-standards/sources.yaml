    stage: Published, free
    access: public
    url: https://www.etsi.org/deliver/etsi_en/301500_301599/301549/03.02.01_60/en_301549v030201p.pdf
    watch:
      url: https://www.etsi.org/deliver/etsi_en/301500_301599/301549/
