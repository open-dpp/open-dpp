  # ---- Tier C: normative references of the A and B texts, assessed in full --------------------
  - id: ISO15459
    tier: C
    title: Information technology – Automatic identification and data capture techniques – Unique identification, Parts 1 to 6
    reference: ISO/IEC 15459-1:2014, -2:2015, -3:2014, -4:2014, -5:2014, -6:2014
    publisher: ISO/IEC
    edition: 2014 and 2015 editions, all confirmed current in 2025 (the editions ESPR Annex III cites)
    stage: Published, no revision in progress
    access: gated
    url: https://www.iso.org/standard/54779.html
    localFile: standards/ISO-IEC-15459-<part>.pdf
    watch:
      url: https://www.iso.org/standard/54779.html
      lookFor: Any part entering stage 90.92 (revision) or a new edition
  - id: ISO18975
    tier: C
    title: Information technology – Automatic identification and data capture techniques – Encoding and resolving identifiers over HTTP
    reference: ISO/IEC 18975:2024
    publisher: ISO/IEC
    edition: Edition 1, 2024-11
    stage: Published
    access: gated
    url: https://www.iso.org/standard/85540.html
    localFile: standards/ISO-IEC-18975-2024.pdf
    watch:
      url: https://www.iso.org/standard/85540.html
      lookFor: A new edition or amendment
  - id: IEC61406
    tier: C
    title: Identification link – Part 1 General requirements; Part 2 Types/models, lots/batches, items and characteristics
    reference: IEC 61406-1:2022, IEC 61406-2:2024
    publisher: IEC
    edition: 61406-1 Ed. 1.0 (2022-09), 61406-2 Ed. 1.0 (2024-05)
    stage: Published; 61406-1 Ed. 2 in development (65E/1196/CDV, forecast 2027-07)
    access: gated
    url: https://webstore.iec.ch/en/publication/67673
