# Register of every text the Conformance Review assesses. One entry per source id; matrix files
# reference the id in their `standard` field. Rules and field meanings: README.md, src/schema.ts.
# Verified against research/public-sources.md (2026-09-03).
sources:
  # ---- Tier A: EU law -------------------------------------------------------------------------
  - id: ESPR
    tier: A
    title: Ecodesign for Sustainable Products Regulation
    short: ESPR 2024/1781
    reference: Regulation (EU) 2024/1781
    publisher: European Union
    edition: Consolidated text CELEX 02024R1781-20240628 (corrigenda of 7.8.2024 and 28.4.2025)
    stage: In force since 18 July 2024
    access: public
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1781-20240628
    normativeReferences: [ISO15459]
    watch:
      url: https://publications.europa.eu/webapi/rdf/sparql
      lookFor: A newer consolidated CELEX 02024R1781-* or a new corrigendum, found with research/eurlex-dpp-acts.rq
  - id: BATT
    tier: A
    title: Batteries Regulation
    short: Batteries 2023/1542
    reference: Regulation (EU) 2023/1542
    publisher: European Union
    edition: Consolidated text CELEX 02023R1542-20250731 (corrigenda up to 10.4.2026)
    stage: In force; the battery passport obligation applies from 18 February 2027 (Art. 77(1))
    access: public
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02023R1542-20250731
    normativeReferences: [ISO15459]
    watch:
      url: https://publications.europa.eu/webapi/rdf/sparql
      lookFor: The Art. 77(9) implementing act on legitimate-interest access (was due 2026-08-18) and any newer consolidated text
  - id: REG1778
    tier: A
    title: DPP registry implementation arrangements
    short: Registry 2026/1778
    reference: Commission Implementing Regulation (EU) 2026/1778
    publisher: European Union
    edition: CELEX 32026R1778 (OJ L, 17.7.2026), no consolidated version
    stage: In force from the twentieth day after publication (Art. 24); national registry administrators by 18 February 2027
    access: public
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32026R1778
    watch:
      url: https://single-market-economy.ec.europa.eu/single-market/digital-product-passport/dpp-registry_en
      lookFor: Registry API documentation, the token issuance procedure (Art. 2(3)), the semantic repository URL (Art. 12) and the list of verified DPP service providers (Art. 3(f))
  - id: DEC1736
    tier: A
    title: Harmonised standards for digital product passports
    short: Standards Dec. 2026/1736
    reference: Commission Implementing Decision (EU) 2026/1736
    publisher: European Union
    edition: CELEX 32026D1736 (OJ L, 15.7.2026)
    stage: In force since 15 July 2026; cites six ENs as a set, EN 18239 and EN 18246 not yet
    access: public
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32026D1736
    watch:
      url: https://single-market-economy.ec.europa.eu/single-market/goods/european-standards/harmonised-standards/digital-product-passport-dpp_en
      lookFor: A second implementing decision citing EN 18239 and EN 18246 (expected September 2026)

  # ---- Tier A, Sector laws (decided 2026-09-06 in #767): DPPs mandated outside ESPR, registered in
  # ---- the ESPR registry; ESPR-restating clauses are Mirrors of the ESPR rows ----------------------
  - id: CPR
    tier: A
    title: Construction Products Regulation
    short: CPR 2024/3110
    reference: Regulation (EU) 2024/3110
    publisher: European Union
    edition: CELEX 32024R3110 (OJ L, 18.12.2024), no consolidated version
    stage: In force since 7 January 2025, applies from 8 January 2026; the DPP duty (Art. 22(7)) applies 18 months after the Art. 75(1) delegated act enters into force, which has no deadline and is not adopted; the CPR prevails over ESPR in a conflict (Art. 12(2))
    access: public
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32024R3110
    watch:
      url: https://publications.europa.eu/webapi/rdf/sparql
      lookFor: The Art. 75(1) delegated act setting up the construction DPP system (it may lay down alternative identifier, carrier and registry rules, Art. 75(2)(h)), the Art. 80(2) amending acts and any consolidated text, found with research/eurlex-dpp-acts.rq
  - id: TOYS
    tier: A
    title: Toy Safety Regulation
    short: Toys 2025/2509
    reference: Regulation (EU) 2025/2509
    publisher: European Union
    edition: CELEX 32025R2509 (OJ L, 12.12.2025), no consolidated version
    stage: In force since 1 January 2026; applies from 1 August 2030 (Art. 59), the toy passport with it; the Art. 49(1) delegated act on its technical requirements has no deadline and is not adopted
    access: public
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32025R2509
    watch:
      url: https://publications.europa.eu/webapi/rdf/sparql
      lookFor: The Art. 49(1) delegated act on the technical requirements of the toy passport, the Art. 49(2)-(3) acts amending Annex VI or the registry content, the optional Art. 22(2) implementing act on registry arrangements and any consolidated text, found with research/eurlex-dpp-acts.rq
  - id: DET
    tier: A
    title: Detergents and Surfactants Regulation
    short: Detergents 2026/405
    reference: Regulation (EU) 2026/405
    publisher: European Union
    edition: CELEX 32026R0405 (OJ L, 2.3.2026), no consolidated version
    stage: In force since 22 March 2026; applies from 23 September 2029 (Art. 37), the detergent passport with it, with a one-year grace for products compliant with Regulation (EC) No 648/2004 (Art. 36(2)); the Art. 21(10) implementing act on its basic technical requirements has no deadline and is not adopted
    access: public
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32026R0405
    watch:
      url: https://publications.europa.eu/webapi/rdf/sparql
      lookFor: The Art. 21(10) implementing act on the basic technical requirements of the detergent passport, the Art. 30(2)-(3) acts amending Annex VI or the registry content, the Art. 30(10) digital-labelling delegated act (due 1 October 2028, it shares the data carrier) and any consolidated text, found with research/eurlex-dpp-acts.rq

  # ---- Tier B: CEN/CENELEC JTC 24 harmonised standards (standardisation request M/604) --------
  - id: EN18219
    tier: B
    title: Digital product passport – Unique identifiers
    reference: EN 18219:2026
    publisher: CEN/CENELEC JTC 24
    edition: EN 18219:2026 (approved by CEN 2026-05-03, available 2026-05-27; read in the English SIS edition SS-EN 18219:2026, edition 1)
    stage: Published; date of withdrawal of conflicting national standards 2026-11-30
    access: gated
    url: https://www.nen.nl/nen-en-18219-2026-en-352707
    citedInOj: Implementing Decision (EU) 2026/1736, OJ L 15.7.2026
    localFile: standards/EN18219-2026.pdf
    normativeReferences: [ISO646, ISO10646, RFC3986, ISO15418, ISO15459, ISO18975, IEC61406, GS1DL, EN18220]
    watch:
      url: https://www.cencenelec.eu/news-events/news/2026/en-in-the-spotlight/2026-07-15-dpp/
      lookFor: An amendment updating the dated GS1 Digital Link reference (the text dates URI Syntax 1.6.0 to 2022, GS1 published it on 2025-03-06 and ratified 1.7.0 in August 2026) or a new edition (Annex ZA presumes conformity with ESPR Art. 10(1)(a), (c), (d), (f), 10(3)(a), 11(a), (b), (d), (e) and 12(1) to (3) through clauses 3.1.25, 4.1.2 to 4.6.2, 5.1 and 6.1)
  - id: EN18220
    tier: B
    title: Digital product passport – Data carriers
    reference: EN 18220:2026
    publisher: CEN/CENELEC JTC 24
    edition: EN 18220:2026 (approved by CEN 2026-05-03, available 2026-05-27; read in the English SIS edition SS-EN 18220:2026, edition 1)
    stage: Published; date of withdrawal of conflicting national standards 2026-11-30
    access: gated
    url: https://www.nen.nl/nen-en-18220-2026-en-352706
    citedInOj: Implementing Decision (EU) 2026/1736, OJ L 15.7.2026
    localFile: standards/EN18220-2026.pdf
    normativeReferences: [ISO18004, EN18219]
    watch:
      url: https://www.cencenelec.eu/news-events/news/2026/en-in-the-spotlight/2026-07-15-dpp/
      lookFor: An amendment updating the dated references (ISO/IEC 15693-3:2019 was withdrawn on 2026-05-07 and replaced by the 2026 edition; ISO/IEC 18004 is under revision) or a new edition (Annex ZA presumes conformity with ESPR Art. 9(2)(b), 9(2)(d), 10(1)(a), (b), (c), (g) and 12(6)(a) to (c) through clauses 4.2, 5.1, 5.2, 5.3, 5.4, 5.7.1, 5.7.2, 6.1 and 6.2.4)
  - id: EN18216
    tier: B
    title: Digital product passport – Data exchange protocols
    reference: EN 18216:2026
    publisher: CEN/CENELEC JTC 24
    edition: EN 18216:2026 (approved by CEN 2026-05-03, available 2026-05-27; read in the English SIS edition SS-EN 18216:2026, edition 1)
    stage: Published; date of withdrawal of conflicting national standards 2026-11-30
    access: gated
    url: https://www.nen.nl/nen-en-18216-2026-en-352718
    citedInOj: Implementing Decision (EU) 2026/1736, OJ L 15.7.2026
    localFile: standards/EN18216-2026.pdf
    normativeReferences: [EN301549, ISO21778]
    watch:
      url: https://www.cencenelec.eu/news-events/news/2026/en-in-the-spotlight/2026-07-15-dpp/
      lookFor: An amendment updating the dated EN 301 549 V3.2.1 reference, or a new edition (Annex ZA presumes conformity with ESPR Art. 10(1)(d) through clauses 4 and 5, with Art. 11(a) through 4 and 5, limited to the technical exchange protocol and data formats, and with Art. 11(h) through 4)
  - id: EN18222
    tier: B
    title: Digital product passport – APIs for the product passport lifecycle management and searchability
    reference: EN 18222:2026
    publisher: CEN/CENELEC JTC 24
    edition: EN 18222:2026 (approved by CEN 2026-05-03, available 2026-05-27; read in the English SIS edition SS-EN 18222:2026, edition 1)
    stage: Published; date of withdrawal of conflicting national standards 2026-11-30
    access: gated
    url: https://www.nen.nl/nen-en-18222-2026-en-352705
    citedInOj: Implementing Decision (EU) 2026/1736, OJ L 15.7.2026
    localFile: standards/EN18222-2026.pdf
    normativeReferences: [EN18221, RFC9535, EN18216, EN18219, EN18223, EN18246]
    watch:
      url: https://www.cencenelec.eu/news-events/news/2026/en-in-the-spotlight/2026-07-15-dpp/
      lookFor: An amendment or new edition on the JTC 24 work programme (Annex ZA presumes conformity with ESPR Art. 10(1)(d), (f), 10(3)(a), (b) and 11(b) through 4.5, and with 11(a) through clause 4 and 4.5); a corrigendum specifying ReadDPPVersionByProductIdAndDate (named in 4.1, specified nowhere) or fixing the Bibliography numbers 8.1 cites
  - id: EN18223
    tier: B
    title: Digital product passport – System interoperability
    reference: EN 18223:2026
    publisher: CEN/CENELEC JTC 24
    edition: EN 18223:2026 (approved by CEN 2026-05-03, available 2026-05-27; read in the English SIS edition SS-EN 18223:2026, edition 1)
    stage: Published; date of withdrawal of conflicting national standards 2026-11-30
    access: gated
    url: https://www.nen.nl/nen-en-18223-2026-en-352704
    citedInOj: Implementing Decision (EU) 2026/1736, OJ L 15.7.2026
    localFile: standards/EN18223-2026.pdf
    normativeReferences: [ISO8601, EN18219, EN18221, RFC3986, ISO639, ISO3166, XSD2, ISO21778, EN18216, EN18239]
    watch:
      url: https://www.cencenelec.eu/news-events/news/2026/en-in-the-spotlight/2026-07-15-dpp/
      lookFor: An amendment or new edition on the JTC 24 work programme (Annex ZA presumes conformity with ESPR Art. 7(8) through 4.1.2.8 and 4.1.2.8.2, 10(1)(d) through 4.1, 10(1)(f) through 4.1.2, 11(a) through clauses 4 and 5, and 11(d) through 4.1.2.7); a corrigendum repairing the examples of Annexes A and B (invalid JSON and XML, a repeated elementId, "gr" for Greek) or adding a class that links one DPP to another
  - id: EN18221
    tier: B
    title: Digital product passport – Data storage, archiving and data persistence
    reference: EN 18221:2026
    publisher: CEN/CENELEC JTC 24
    edition: EN 18221:2026 (approved by CEN 2026-05-03, available 2026-05-27; read in the English SIS edition SS-EN 18221:2026, edition 1)
    stage: Published; date of withdrawal of conflicting national standards 2026-11-30
    access: gated
    url: https://www.nen.nl/nen-en-18221-2026-en-352703
    citedInOj: Implementing Decision (EU) 2026/1736, OJ L 15.7.2026
    localFile: standards/EN18221-2026.pdf
    normativeReferences: [EN18216, EN18220, EN18222, EN18239, EN18246]
    watch:
      url: https://www.cencenelec.eu/news-events/news/2026/en-in-the-spotlight/2026-07-15-dpp/
      lookFor: An amendment or new edition on the JTC 24 work programme (Annex ZA presumes conformity with ESPR Art. 10(4), technical aspects of the back-up only, through 4.3 and 4.5, and with Art. 11(c) through 4.5); a delegated act fixing a product group's DPP lifetime or exempting changes from archiving (4.2(5))
  - id: EN18239
    tier: B
    title: Digital product passport – Access rights management, information system security and business confidentiality
    reference: EN 18239:2026
    publisher: CEN/CENELEC JTC 24
    edition: EN 18239:2026 (approved by CEN 2026-08-17, available 2026-09-16; read in the English SIS edition SS-EN 18239:2026, edition 1)
    stage: Published 2026-09-16; national adoption and withdrawal of conflicting standards by March 2027; not yet cited in the OJ
    access: gated
    url: https://www.dinmedia.de/en/standard/din-en-18239/405632313
    localFile: standards/EN18239-2026.pdf
    normativeReferences: [EN18219]
    watch:
      url: https://single-market-economy.ec.europa.eu/single-market/goods/european-standards/harmonised-standards/digital-product-passport-dpp_en
      lookFor: The second implementing decision citing EN 18239 in the OJ (Annex ZA presumes conformity with ESPR Art. 11(a) through clause 4.2 only), then any amendment or new edition on the JTC 24 work programme
  - id: EN18246
    tier: B
    title: Digital product passport – Data authentication, reliability and integrity
    reference: EN 18246:2026
    publisher: CEN/CENELEC JTC 24
    edition: EN 18246:2026 (approved by CEN 2026-08-17, available 2026-09-16; read in the English SIS edition SS-EN 18246:2026, edition 1)
    stage: Published 2026-09-16; national adoption and withdrawal of conflicting standards by March 2027; not yet cited in the OJ
    access: gated
    url: https://www.dinmedia.de/en/standard/din-en-18246/405630823
    localFile: standards/EN18246-2026.pdf
    normativeReferences: [EN18216, EN18219, EN18220, EN18221, EN18239]
    watch:
      url: https://single-market-economy.ec.europa.eu/single-market/goods/european-standards/harmonised-standards/digital-product-passport-dpp_en
      lookFor: The second implementing decision citing EN 18246 in the OJ (Annex ZA presumes conformity with ESPR Art. 11(a) through clause 4.2 only, organisational interoperability), then any amendment or new edition on the JTC 24 work programme; an implementing act on actors' digital credentials (ESPR Art. 11 fourth subparagraph), which would fix the certificates 4.7 asks for

  # ---- Tier C: referenced standards of the A and B texts, read as far as the citing clause reaches (#1021), and declared standards
  - id: ISO15459
    tier: C
    title: Information technology – Automatic identification and data capture techniques – Unique identification, Parts 1 to 6
    reference: ISO/IEC 15459-1:2014, -2:2015, -3:2014, -4:2014, -5:2014, -6:2014
    publisher: ISO/IEC
    edition: 2014 and 2015 editions, all confirmed current in 2025 (the editions ESPR Annex III cites); for EN 18219, part 2 is read through the AIM register of Issuing Agency Codes (version 2026-06-16), parts 3, 4 and 6 wait for the purchase (#1042), parts 1 and 5 are Not applicable
    stage: Published, no revision in progress
    access: gated
    url: https://www.iso.org/standard/54779.html
    localFile: standards/ISO-IEC-15459-<part>.pdf
    watch:
      url: https://www.iso.org/standard/54779.html
      lookFor: Any part entering stage 90.92 (revision) or a new edition
  - id: ISO18975
    tier: C
    title: Information technology – Automatic identification and data capture techniques – Encoding and resolving identifiers over HTTP
    reference: ISO/IEC 18975:2024
    publisher: ISO/IEC
    edition: Edition 1, 2024-11
    stage: Published
    access: gated
    url: https://www.iso.org/standard/85540.html
    localFile: standards/ISO-IEC-18975-2024.pdf
    watch:
      url: https://www.iso.org/standard/85540.html
      lookFor: A new edition or amendment
  - id: IEC61406
    tier: C
    title: Identification link – Part 1 General requirements; Part 2 Types/models, lots/batches, items and characteristics
    reference: IEC 61406-1:2022, IEC 61406-2:2024
    publisher: IEC
    edition: 61406-1 Ed. 1.0 (2022-09), 61406-2 Ed. 1.0 (2024-05)
    stage: Published; 61406-1 Ed. 2 in development (65E/1196/CDV, forecast 2027-07)
    access: gated
    url: https://webstore.iec.ch/en/publication/67673
    localFile: standards/IEC-61406-<part>.pdf
    watch:
      url: https://www.iec.ch/dyn/www/f?p=103:23:::::FSP_ORG_ID,FSP_LANG_ID:1452,25
      lookFor: 65E/1196/CDV (61406-1 Ed. 2) reaching FDIS or publication
  - id: GS1DL
    tier: C
    title: GS1 Digital Link URI Syntax and GS1-Conformant Resolver
    reference: GS1 Digital Link URI Syntax 1.7.0; GS1-Conformant Resolver Standard 1.2.1
    publisher: GS1
    edition: URI Syntax 1.7.0 and Conformant Resolver 1.2.1, both ratified August 2026
    stage: Published, royalty-free under the GS1 IP policy
    access: public
    url: https://ref.gs1.org/standards/digital-link/uri-syntax/
    watch:
      url: https://ref.gs1.org/standards/resolver/
      lookFor: A release newer than URI Syntax 1.7.0 or Conformant Resolver 1.2.1
  - id: IEC63278
    tier: C
    title: Asset Administration Shell for industrial applications – Part 1 Asset Administration Shell structure
    reference: IEC 63278-1:2023
    publisher: IEC
    edition: Edition 1.0, 2023-12
    stage: Published; parts 2 to 5 in development (Part 4 forecast 2026-10)
    access: gated
    url: https://webstore.iec.ch/en/publication/65628
    localFile: standards/IEC-63278-1-2023.pdf
    watch:
      url: https://www.iec.ch/dyn/www/f?p=103:23:::::FSP_ORG_ID,FSP_LANG_ID:1250,25
      lookFor: Publication of IEC 63278-4 (2026-10), -2, -3 or -5, and whether EN 18222 or EN 18223 start citing them
  - id: IDTA01001
    tier: C
    title: Specification of the Asset Administration Shell – Part 1 Metamodel (declared standard)
    short: AAS Part 1 V3.2
    reference: IDTA-01001-3-2 (V3.2)
    publisher: Industrial Digital Twin Association
    edition: V3.2, July 2026 (release tag v3.2.0 of admin-shell-io/aas-specs-metamodel, DOI 10.62628/IDTA.01001-3-2, CC-BY-4.0), with the informative Digital Product Passport annex; read from the AsciiDoc sources and the JSON schema of that tag
    stage: Published; a declared standard of open-dpp (map decision of 2026-10-12, #1021), no law or EN cites it
    access: public
    url: https://industrialdigitaltwin.io/aas-specifications/IDTA-01001/v3.2/index.html
    watch:
      url: https://github.com/admin-shell-io/aas-specs-metamodel/releases
      lookFor: A V3.2.x patch release (patch releases are binding bugfixes) or V3.3, and the publication of IEC 63278-2 (the metamodel as an IEC standard)
  - id: IDTA01002
    tier: C
    title: Specification of the Asset Administration Shell – Part 2 Application Programming Interfaces (declared standard)
    short: AAS Part 2 V3.2
    reference: IDTA-01002-3-2 (V3.2.0)
    publisher: Industrial Digital Twin Association
