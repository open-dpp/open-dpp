  - criterion: ESPR-Art10(1)(a)
    date: 2026-10-12
    commit: dad482466f7c8b760d173b41f2cefab283e9200f
    validator: agent:conformance-review
    status: Partial
    evidence:
      - type: code
        ref: apps/main/src/unique-product-identifier/presentation/gs1-resolver.controller.ts
        note: scanned Digital Link -> passport's public view
      - type: code
        ref: apps/client/src/components/QrCode.vue
        note: QR code of the identifier URL
      - type: code
        ref: apps/main/src/unique-product-identifier/application/services/upi-collection.service.ts
        note: identities locked once published
      - type: test
        ref: apps/e2e/tests/passport-identity/gs1-resolver.spec.ts
      - type: test
        ref: apps/e2e/tests/passport-identity/publish-freeze.spec.ts
      - type: check
        ref: identifiers.gs1-syntax-valid
        result: passed
        date: 2026-10-12
      - type: check
        ref: resolver.head-like-get
        result: passed
        date: 2026-10-12
      - type: check
        ref: resolver.redirect-published
        result: passed
        date: 2026-10-12
    notes: "Software part credited: every passport gets a unique product identifier and a public URL that a QR code carries; with a GS1 identity the QR holds a Digital Link the built-in resolver redirects to the passport, and identifiers are locked once the passport is published. Capped at Partial by Annex ZA (map rule of 2026-10-10): of the mapped EN 18219 clauses, 4.1.2(1) to (4), 4.2.2(1) to (3), 4.5.2(2) and (4) are Partial (#518, #825, #828; the item key of bug #1046), 4.5.2(1) waits for EN 18220 (#757) and 5.1 for the scheme texts (#1043). Graded with EN 18219 alone; the data-carrier assessment re-grades it with EN 18220."
    gapIssue: 518
  - criterion: ESPR-Art10(1)(c)
    date: 2026-10-12
    commit: dad482466f7c8b760d173b41f2cefab283e9200f
    validator: agent:conformance-review
    status: Partial
    evidence:
      - type: code
        ref: packages/dto/src/unique-product-identifiers/gs1/gs1-digital-link.ts
        note: GS1 AI syntax, GTIN check digit
      - type: test
        ref: packages/dto/src/unique-product-identifiers/gs1/gs1-digital-link.spec.ts
    notes: "The cited harmonised standards now stand for the Annex III standards. Credited: GS1 identities use GS1 Application Identifiers as ISO/IEC 15418 requires (EN18219-5.2.2.1(b) Met) under GS1's registered Issuing Agency Code. Capped at Partial: Annex ZA maps Art. 10(1)(c) to EN18219-5.1 (and the definition 3.1.25), and 5.1 stays unassessed until GS1 Digital Link, ISO/IEC 18975 and ISO/IEC 15459 are read (#1042, #1043); restricted circulation numbers pass (4.1.2(2), bug #1046); the carrier half waits for EN 18220 (#757)."
    gapIssue: 518
  - criterion: ESPR-AnnexIII-para2
    date: 2026-10-12
    commit: dad482466f7c8b760d173b41f2cefab283e9200f
    validator: agent:conformance-review
    status: Partial
    evidence:
      - type: code
        ref: packages/dto/src/unique-product-identifiers/gs1/gs1-digital-link.ts
      - type: test
        ref: packages/dto/src/unique-product-identifiers/gs1/gs1-digital-link.spec.ts
      - type: manual
        ref: "Checked 2026-10-12 against an Instance built from dad48246 (worktree, port 3001): POST /unique-product-identifiers with GTIN 2001234567893 (GS1 prefix 20, a restricted circulation number) on a draft passport answered 201 and the Digital Link .../01/02001234567893/21/RCN1 (Check identifiers.restricted-gtin-refused fails for the same reason)."
        date: 2026-10-12
      - type: check
        ref: identifiers.gs1-syntax-valid
        result: passed
        date: 2026-10-12
    notes: "Credited: GS1 identities follow the GS1 system, whose Issuing Agency Code is registered under ISO/IEC 15459-2 (EN18219-5.2.2.1(g) Met; that restricted circulation numbers pass is graded under 4.1.2(2)). Missing: conformance with ISO/IEC 15459-3, -4 and -6 is unassessed until the texts are bought (#1042, #1043); the operator and facility identifiers of points (g), (h), (i) and (k) do not exist (#1023); the carrier half waits for EN 18220 (#757). Parts 1 and 5 are not relevant to products."
    gapIssue: 518
  - criterion: ESPR-Art10(1)(f)
    date: 2026-10-12
    commit: dad482466f7c8b760d173b41f2cefab283e9200f
    validator: agent:conformance-review
    status: Partial
    evidence:
      - type: code
        ref: apps/main/src/unique-product-identifier/domain/unique.product.identifier.ts
        note: level implied by the GS1 keys only
    notes: "Annex ZA maps Art. 10(1)(f) to EN18219-4.4.2, Partial in all three points. Credited: a GS1 identity implies model, batch or item. Missing: the passport has no level of its own, can mix identities of several levels, and UUID identifiers express none, so the data cannot be said to refer to the level a delegated act fixes (#597, as ESPR-Art9(2)(d))."
    gapIssue: 597
  - criterion: ESPR-Art10(3)(a)
    date: 2026-10-12
    commit: dad482466f7c8b760d173b41f2cefab283e9200f
    validator: agent:conformance-review
    operational: true
    status: Partial
    gapIssue: 828
    evidence:
      - type: code
        ref: apps/client/src/components/permalinks/PermalinkQrCode.vue
        note: QR of the permalink or Digital Link at 256 px, its URL as text and a copy button for the URL
      - type: code
        ref: apps/client/src/components/presentation/PassportQrCodeDialog.vue
        note: presentation-mode QR of the newest permalink; copy button for the URL
      - type: code
        ref: apps/main/src/unique-product-identifier/presentation/unique-product-identifier.controller.ts
        note: members list identifiers through the API
    notes: "Software part: a digital copy of the carrier or of the unique product identifier for dealers and online marketplaces. Credited: the identifier's URL and the Digital Link can be copied in the back office and listed through the API, which the point accepts in place of the carrier. Missing: no image of the carrier to hand over (EN18220-5.4.5(2), #489), no bulk export of identifiers meant for retailers, and no page under docs/ mentions permalinks, the GS1 Digital Link, QR codes, labels or printing. Capped at Partial by Annex ZA through EN18219-4.5.2: 4.5.2(1), (2) and (4) are Partial (#828)."
