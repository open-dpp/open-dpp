    validator: agent:conformance-review
    status: Partial
    evidence:
      - type: code
        ref: packages/dto/src/unique-product-identifiers/gs1/gs1-digital-link.ts
        note: GS1 AI syntax, GTIN check digit
      - type: test
        ref: packages/dto/src/unique-product-identifiers/gs1/gs1-digital-link.spec.ts
    notes: "The cited harmonised standards now stand for the Annex III standards. Credited: GS1 identities use GS1 Application Identifiers as ISO/IEC 15418 requires (EN18219-5.2.2.1(b) Met) under GS1's registered Issuing Agency Code. Capped at Partial: Annex ZA maps Art. 10(1)(c) to EN18219-5.1 (and the definition 3.1.25), and 5.1 stays unassessed until GS1 Digital Link, ISO/IEC 18975 and ISO/IEC 15459 are read (#1042, #1043); restricted circulation numbers pass (4.1.2(2), bug #1046); the carrier half waits for EN 18220 (#757)."
    gapIssue: 518
