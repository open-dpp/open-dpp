      notes: "Recommendation, graded as enablement; it never caps a law row. Credited: one element of a passport can be read by submodel id and idShort path, by members and, for a published passport, by anyone (6.2). Missing: no ReadDataElement at the EN 18222 path with a JSONPath (8.1(5), 8.4), and no back-up DPP service provider that offers it (#596)."
