  - id: EN18222-4.1(2)
    section: "4.1"
    clause: "4.1(2)"
    paraphrase: "The creator of the DPP, or its main DPP service provider, offers the read methods ReadDPPById, ReadDPPByProductId and ReadDPPIdsByProductIds, and the back-up DPP service provider offers them too."
    applicability: software
    areas:
      - 1
      - 6
    assessment:
      date: 2026-10-12
      commit: dad482466f7c8b760d173b41f2cefab283e9200f
      validator: agent:conformance-review
      status: Partial
      gapIssue: 1052
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/passports/presentation/passport.controller.ts
          note: "members: GET /passports/:id (ids only), GET /:id/export (full, own format 6.0), POST /passports, DELETE /:id, AAS routes"
        - type: code
          ref: apps/main/src/permalink/presentation/permalink.controller.ts
          note: public AAS read routes keyed by the permalink id, anonymous for published passports only; GET /p?passportId= lists a passport's permalinks; no AAS write routes
        - type: code
          ref: apps/main/src/unique-product-identifier/presentation/gs1-resolver.controller.ts
          note: "302 to the HTML view; decodes batch and serial a second time (bug #1049)"
        - type: check
          ref: api.read-dpp-by-id
          result: failed
          date: 2026-10-12
        - type: check
          ref: api.read-dpp-ids-by-product-ids
          result: failed
          date: 2026-10-12
        - type: manual
          ref: "Checked 2026-10-12 against an Instance built from dad48246 (worktree, port 3001): GET /api/v1/dpps/<passport id> and /api/v2/v1/dpps/<passport id> answered 404; POST /api/v1/dppsByProductIds answered 404 (Checks api.read-dpp-by-id, api.read-dpp-ids-by-product-ids); the served OpenAPI document (110 paths) names no dpps path."
          date: 2026-10-12
      notes: "Mandatory. Credited: open-dpp's own API covers two of the three reads in its own shapes. Members read a passport by id, the public reads a published passport through routes keyed by its permalink (Check access.anonymous-reads-published), and the GS1 resolver takes a product identifier to the current passport's view (4.2, 4.3). Missing: none of the three methods is served (Checks api.read-dpp-by-id and api.read-dpp-ids-by-product-ids answer 404); ReadDPPIdsByProductIds has no counterpart at all (4.5(1)); open-dpp cannot act as the back-up DPP service provider that serves them as well (#596). Operational, because the operator has to run the API where the registry entry points (7.1). Annex ZA maps 4.5 (and clause 4 for ESPR-Art11(a)) to ESPR Art. 10(1)(d), (f), 10(3)(a), (b), 11(a) and (b), so this row caps them through 4.5(1)."
