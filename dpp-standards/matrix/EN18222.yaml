# Conformance Matrix: EN18222 (EN 18222:2026). Rules: dpp-standards/README.md.
# Criteria extracted from the final text (English SIS edition, edition 1, git-ignored standards/EN18222-2026.pdf) on 2026-10-12 (ticket #759); assessments are added in place, one per Criterion.
# Gated text: every paraphrase is ours, never a sentence of the standard.
# Clause numbering: one Criterion per paragraph that carries a requirement (shall, should or may), as EN 18220 was extracted, numbered as the PDF sets the paragraphs apart ("4.1(2)"). The method clauses 4.2 to 4.8, 5.2, 6.2 and 6.3 and the mapping tables of 8.2 to 8.4 specify without a modal verb what 4.1, 5.1, 6.1 and 8.1 oblige, so each is one Criterion under its bare clause number: the method's description, its table and its paragraph on access rules. Where a method clause also holds paragraphs with a modal verb of their own (4.5, 4.7), the method is paragraph (1) and those paragraphs keep their numbers; 4.7(2), the access-rule paragraph, is graded with 4.7(1). Clause 7 defines the types every method uses: 7.1 (Table 11) is one Criterion, 7.2 has the result object on failure (7.2(1)), the error-only response (7.2(2)), the result and message structure of Tables 12 to 14, introduced by paragraphs 3 to 5 (7.2(3)), and the status codes of Table 15, introduced by paragraph 6 (7.2(6)). 8.1(7) is the optional representation flag; paragraphs 8 to 10 explain its two values and its default and are graded with it. The 4.1 rows carry who offers which method and how strongly; the method rows carry what each method does. A missing method therefore counts in both, as a conditional clause did in EN 18246 (map rule of 2026-10-12).
# Not extracted, no requirement of their own: the Introduction, clauses 1 (scope), 2 (normative references, forms below), 3 (terms; 3.6 the unique registration identifier the registry returns), 4.1(1) (the clause holds the methods a custodian offers, stated abstractly, bound to HTTPS in clause 8), 4.1(7) (each method takes parameters, acts and answers with a result), 4.1(8) (three methods suit a search function; finding below), 4.4's date-format paragraph (graded with 4.4), 4.5(3) (the array notation of Table 4), the sentence introducing Table 11, 8.1(1) and (2) (what the mapping tables show), 8.1(3) (RFC 7396 merge patch "can be considered" for updates: a possibility, no requirement; RFC 7396 unread), Annex ZA (below) and the Bibliography.
# Mirror: 4.7(4) restates EN18221-4.2(5) (every change to the DPP is archived, as EN 18221 lays down, its exemption included) with no delta. 4.4 resembles EN18221-4.2(7) (an authorised actor retrieves the version current at a point in time) but adds a fixed method, its parameters and its providers, so it is an own Criterion; 4.1(9) resembles the content-negotiation rows of EN 18216 (5(b) to 5(d)) but is a conditional recommendation on the API, so it is an own Criterion too.
# References (forms decided in #1021, confirmed by this Extract). EN 18221 (undated), the only normative reference, graded by pointing at its rows (4.7(4) mirrors EN18221-4.2(5); EN18221-4.1(9) asks for the storage these methods need and is graded in this run). Read-through, graded on this file's rows: IETF RFC 9535 (JSONPath, February 2024), listed only in the Bibliography but bound by the "shall" of 8.1(5): its Normalized Paths (2.7) are the form an element path takes; registered in sources.yaml. Graded by pointing at the other JTC 24 ENs, which the body binds without listing them in clause 2: EN 18216 (content negotiation, 4.1(9)), EN 18219 (the product identifier of 4.3 and 4.5), EN 18223 (the DigitalProductPassport, DataElement, Identifier and Timestamp types of 7.1 and the compressed and full representations of 8.1(7); assessed in #762, so the type part of 7.1 is re-read there) and EN 18246 (the access rules each method names; access rights are the topic of EN 18239, whose element-level rows the notes also cite). Gap, unread: ISO 8601-1:2019 (dated, Bibliography), which only constrains the date parameter of ReadDPPVersionByIdAndDate and the message timestamp of Table 13, both missing in open-dpp (map rule for conditional clauses). Unread, no requirement: RFC 7396 (8.1(3)).
# Findings: 4.1(8) names a query method ReadDPPVersionByProductIdAndDate that the text specifies nowhere (Table 16 has ReadDPPVersionByIdAndDate only). 4.1(3) and (6) recommend ReadDataElement and UpdateDataElement ("should"), while 6.1 only permits the fine-granular operations ("may"). 4.5 names the pagination parameters limit and cursor, but Table 4 lists neither, nor a cursor in the result. 8.1 cites RFC 7396 as [5] and RFC 9535 as [6], while the Bibliography numbers them [6] and [7] ([5] is EN 18223). 8.1(9) points the full representation to Annexes A and B of EN 18223, but Annex B there is the compressed XML serialisation. Every method points to EN 18246 for its access rules, although access rights are EN 18239's topic. The footnotes still call EN 18239 and EN 18246 under preparation, as in EN 18219 and EN 18220.
# Annex ZA (informative) maps clauses to ESPR, with presumption of conformity since the OJ citation by Implementing Decision (EU) 2026/1736: Art. 10(1)(d), 10(1)(f), 10(3)(a), 10(3)(b) and 11(b) through 4.5; 11(a) through clause 4 and 4.5, for the technical side of interoperability only (communication and data transfer between the ends). The mandatory clauses among them, which cap the law rows: 4.1(2), 4.1(5), 4.2, 4.3, 4.5(1), 4.5(2), 4.7(1) (mandatory through 4.1(5)) and the Mirror 4.7(4); the recommended and optional rows of clause 4 (4.1(3), 4.1(4), 4.1(6), 4.1(9), 4.4, 4.6, 4.7(3), 4.8) never cap. This Extract added EN18222 to operationalisedBy of ESPR-Art10(1)(f), 10(3)(a), 10(3)(b) and 11(a), and, as rows the text addresses without presumption (map rule of 2026-10-09), of ESPR-Art10(4) (4.1: the back-up DPP service provider serves the read methods), ESPR-Art13(4), 13(5), REG1778-Art3(b), 8(6), 8(7)(e), 8(10) and BATT-Art77(10) (clause 5 and the registry entry of 7.1). It dropped EN18222 from BATT-Art13(6)-closing, ESPR-Art9(1) and REG1778-Art10(2), which the text does not touch (completeness and accuracy of the data; the registry's own versioning). The other law rows naming EN18222 stay: BATT-Art77(5) (searchable and transferable data, the battery counterpart of ESPR-Art10(1)(d)), BATT-Art77(8) (4.8, deletion at end of life), REG1778-Art8(7) (the registry reads the DPP through the API endpoint of the registry entry), ESPR-Art9(2)(g), 9(2)(h) and 11(f) (who creates or updates which data: 4.1(5), 4.6, 4.7, 6.3) and ESPR-Art14 (search built on the query methods, 4.1(8)).

