  - id: EN18222-8.1(5)
    section: "8.1"
    clause: "8.1(5)"
    paraphrase: "An element path (elementIdPath) is written as a JSONPath expression of RFC 9535."
    applicability: software
    areas:
      - 1
    assessment:
      date: 2026-10-12
      commit: dad482466f7c8b760d173b41f2cefab283e9200f
      validator: agent:conformance-review
      status: Gap
      gapIssue: 1052
      evidence:
        - type: code
          ref: apps/main/src/aas/presentation/aas.decorators.ts
          note: idShortPath of dot-separated idShorts; AAS ids as UUID or standard base64
        - type: test
          ref: apps/main/src/aas/presentation/aas.decorator.spec.ts
        - type: manual
          ref: "Checked 2026-10-12 against an Instance built from dad48246 (worktree, port 3001): GET .../submodels/<base64 id>/submodel-elements/Weight answered 200 with the element; the same element addressed as the RFC 9535 Normalized Path $['Weight'] answered 404 \"Submodel element with idShortPath $['Weight'] not found\"."
          date: 2026-10-12
      notes: "Mandatory for the element paths, a clause Annex ZA does not map. RFC 9535 (February 2024) is read through. The text asks for a unique path to one element (6.2); we read that as a JSONPath that selects one node, at its plainest a Normalized Path (2.7: bracket notation from the root $, names in single quotes, array indexes). open-dpp addresses an element by submodel id plus a dot-separated idShort path, in which brackets are literal characters. No JSONPath is parsed anywhere on the server, and $['Weight'] answers 404 (manual check)."
