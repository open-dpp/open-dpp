criteria:
  - id: EN18222-4.1(2)
    section: "4.1"
    clause: "4.1(2)"
    paraphrase: "The creator of the DPP, or its main DPP service provider, offers the read methods ReadDPPById, ReadDPPByProductId and ReadDPPIdsByProductIds, and the back-up DPP service provider offers them too."
    applicability: software
    areas:
      - 1
      - 6
  - id: EN18222-4.1(3)
    section: "4.1"
    clause: "4.1(3)"
    paraphrase: "Recommendation: the creator of the DPP or its main DPP service provider, and also the back-up DPP service provider, offer ReadDataElement."
    applicability: software
    areas:
      - 1
  - id: EN18222-4.1(4)
    section: "4.1"
    clause: "4.1(4)"
    paraphrase: "Recommendation: the main DPP service provider and the back-up DPP service provider offer CreateDPP, DeleteDPPById and ReadDPPVersionByIdAndDate."
    applicability: software
    areas:
      - 1
      - 6
  - id: EN18222-4.1(5)
    section: "4.1"
    clause: "4.1(5)"
    paraphrase: "Where authorised third parties may change parts of the DPP, the creator of the DPP or its main DPP service provider offers UpdateDPPById."
    applicability: software
    areas:
      - 1
      - 5
  - id: EN18222-4.1(6)
    section: "4.1"
    clause: "4.1(6)"
    paraphrase: "Recommendation: under the same condition (authorised third parties may change parts of the DPP), the creator or its main DPP service provider also offers UpdateDataElement."
    applicability: software
    areas:
      - 1
      - 5
  - id: EN18222-4.1(9)
    section: "4.1"
    clause: "4.1(9)"
    paraphrase: "Recommendation: an API that can answer in more than one response type selects the type through content negotiation as EN 18216 describes."
    applicability: software
    areas:
      - 2
  - id: EN18222-4.2
    section: "4.2"
    clause: "4.2"
    paraphrase: "ReadDPPById: given a known DPP identifier, the method answers with a status code and that DPP (at most one, of the EN 18223 type); access rules (EN 18246) decide which data elements the answer holds."
    applicability: software
    areas:
      - 1
      - 5
  - id: EN18222-4.3
    section: "4.2"
    clause: "4.3"
    paraphrase: "ReadDPPByProductId: given a unique product identifier as EN 18219 defines it, the method answers with a status code and the DPP currently active for it, its latest version; access rules decide which data elements the answer holds."
    applicability: software
    areas:
      - 1
      - 3
      - 5
  - id: EN18222-4.4
    section: "4.2"
    clause: "4.4"
    paraphrase: "ReadDPPVersionByIdAndDate: given a DPP identifier and a UTC timestamp (ISO 8601-1, as EN 18223 says), the method answers with a status code and the version of the DPP valid at that time; optional for the economic operator; access rules decide which data elements the answer holds. Related: EN18221-4.2(7)."
    applicability: software
    areas:
      - 1
      - 6
  - id: EN18222-4.5(1)
    section: "4.2"
    clause: "4.5(1)"
    paraphrase: "ReadDPPIdsByProductIds: given one or more unique product identifiers (EN 18219), the method answers with a status code and the identifiers of every DPP that matches them, possibly none. Annex ZA maps 4.5 to ESPR-Art10(1)(d), (f), 10(3)(a), (b), 11(a) and (b)."
    applicability: software
    areas:
      - 1
      - 3
      - 7
  - id: EN18222-4.5(2)
    section: "4.2"
    clause: "4.5(2)"
    paraphrase: "The client can page through that list with two inputs, limit and cursor; a cursor never has an empty value."
    applicability: software
    areas:
      - 1
  - id: EN18222-4.6
    section: "4.6"
    clause: "4.6"
    paraphrase: "CreateDPP: the method takes a DPP (EN 18223 type), creates it where the access rules (EN 18246) allow the caller to, and answers with a status code and the new DPP's identifier."
    applicability: software
    areas:
      - 1
      - 5
  - id: EN18222-4.7(1)
    section: "4.6"
    clause: "4.7(1)"
    paraphrase: "UpdateDPPById: the method takes a DPP identifier and a partial DPP holding only the data to change or add, one data element or several, applies it where the access rules allow the patch (4.7(2)), and answers with the updated DPP and a status code that tells why a failed update failed."
    applicability: software
    areas:
      - 1
      - 5
  - id: EN18222-4.7(3)
    section: "4.6"
    clause: "4.7(3)"
    paraphrase: "Recommendation: an update whose parts do not all succeed fails as a whole and leaves the DPP unchanged."
    applicability: software
    areas:
      - 1
      - 6
  - id: EN18222-4.7(4)
    section: "4.6"
    clause: "4.7(4)"
    paraphrase: "Every change to the DPP is archived as EN 18221 requires."
    applicability: software
    areas:
      - 6
    mirrors: EN18221-4.2(5)
  - id: EN18222-4.8
    section: "4.6"
    clause: "4.8"
    paraphrase: "DeleteDPPById: given a DPP identifier, the method removes that DPP where the access rules allow it, a step that matters at the end of the DPP's life, and answers with a status code."
    applicability: software
    areas:
      - 1
      - 6
  - id: EN18222-5.1
    section: "5"
    clause: "5.1"
    paraphrase: "The DPP registry offers the method RegisterProductDPP."
    applicability: commission
    areas:
      - 7
  - id: EN18222-5.2
    section: "5"
    clause: "5.2"
    paraphrase: "RegisterProductDPP, served by the registry: the calling client hands in a registry entry, the registry registers the new DPP and answers with a status code and a unique registration identifier."
    applicability: commission
    areas:
      - 7
  - id: EN18222-6.1
    section: "6"
    clause: "6.1"
    paraphrase: "Option: whoever holds a DPP in custody, or an archiving service, may offer the fine-granular methods ReadDataElement and UpdateDataElement."
    applicability: software
    areas:
      - 1
  - id: EN18222-6.2
    section: "6"
    clause: "6.2"
    paraphrase: "ReadDataElement: given a DPP identifier and the absolute path of one of its data elements, the method answers with a status code and that data element (EN 18223 type)."
    applicability: software
    areas:
      - 1
  - id: EN18222-6.3
    section: "6"
    clause: "6.3"
    paraphrase: "UpdateDataElement: given a DPP identifier, the path of a data element and new content, the method updates that element, which may also mean amending or removing element information, and answers with a status code and the changed element."
    applicability: software
    areas:
      - 1
      - 5
  - id: EN18222-7.1
    section: "7"
    clause: "7.1"
    paraphrase: "The methods use the types of Table 11: identifiers are strings as EN 18223 defines them; a DPP is an EN 18223 object, or a subset of its data elements for an update; a timestamp is an ISO 8601-1 date-time as EN 18223 says; a data element is EN 18223's; the registry entry is a DPP header naming the unique product identifier, the DPP identifier, the unique operator identifiers of the economic operator and of the back-up operator, and the URI of the DPP API endpoint."
    applicability: software
    areas:
      - 1
      - 2
      - 3
      - 7
  - id: EN18222-7.2(1)
    section: "7"
    clause: "7.2(1)"
    paraphrase: "Recommendation: when a method fails, the answer carries a result object that explains why."
    applicability: software
    areas:
      - 1
  - id: EN18222-7.2(2)
    section: "7"
    clause: "7.2(2)"
    paraphrase: "Option: the answer to a failed request may consist of the error object alone."
    applicability: software
    areas:
      - 1
  - id: EN18222-7.2(3)
    section: "7"
    clause: "7.2(3)"
    paraphrase: "The result object (Tables 12 to 14) holds any number of messages; each message has a type (Info, Warning, Error or Exception) and a text, and may add a technology-specific status or error code, a correlation identifier that ties messages together across systems, and a timestamp."
    applicability: software
    areas:
      - 1
  - id: EN18222-7.2(6)
    section: "7"
    clause: "7.2(6)"
    paraphrase: "The status codes allowed (Table 15) are generic codes mapped to HTTP 200, 201, 202, 204 and 501, which carry no result object, and 400, 401, 403, 404, 405, 409, 500 and 502, which carry one."
    applicability: software
    areas:
      - 1
  - id: EN18222-8.1(4)
    section: "8.1"
    clause: "8.1(4)"
    paraphrase: "REST paths start with a version prefix, v1/ for this edition, which later versions of the API replace."
    applicability: software
    areas:
      - 1
      - 13
  - id: EN18222-8.1(5)
    section: "8.1"
    clause: "8.1(5)"
    paraphrase: "An element path (elementIdPath) is written as a JSONPath expression of RFC 9535."
    applicability: software
    areas:
      - 1
  - id: EN18222-8.1(6)
    section: "8.1"
    clause: "8.1(6)"
    paraphrase: "Recommendation: parameters that travel in the URL path, such as the DPP identifier, are percent-encoded."
    applicability: software
    areas:
      - 1
      - 3
  - id: EN18222-8.1(7)
    section: "8.1"
    clause: "8.1(7)"
    paraphrase: "GET, POST and PATCH take an optional query parameter, representation, with the values compressed (the default, EN 18223 5.2) and full (EN 18223 Annexes A and B); a request without it gets the compressed payload."
    applicability: software
    areas:
      - 1
      - 2
  - id: EN18222-8.2
    section: "8.2"
    clause: "8.2"
    paraphrase: "The Life Cycle API is served at these paths (Table 16): GET v1/dpps/{dppId}, GET v1/dppsByProductId/{productId}, GET v1/dppsByIdAndDate/{dppId} with the date as a query parameter, POST v1/dppsByProductIds with a set of product identifiers, POST v1/dpps, PATCH v1/dpps/{dppId} with a partial DPP, and DELETE v1/dpps/{dppId}."
    applicability: software
    areas:
      - 1
      - 13
  - id: EN18222-8.3
    section: "8.2"
    clause: "8.3"
    paraphrase: "The registry serves RegisterProductDPP at POST v1/registerDPP, taking the registry entry and answering with the registration identifier (Table 17)."
    applicability: commission
    areas:
      - 7
  - id: EN18222-8.4
    section: "8.2"
    clause: "8.4"
    paraphrase: "The fine-granular methods are served at GET and PATCH v1/dpps/{dppId}/elements/{elementIdPath} (Table 18)."
    applicability: software
    areas:
      - 1
      - 13
