  - id: TOYS-Art19(5)
    section: Art19
    clause: Art. 19(5)
    paraphrase: "Where the DPP holds all the information an EU declaration of conformity requires under the AI Act, the Cyber Resilience Act, RoHS, EMC, LVD, RED or Delegated Regulation (EU) 2019/945 (drones), points (a) to (d) apply: the passport can carry the full content of those declarations (no ESPR counterpart; nearest ESPR-AnnexIII(e))."
    applicability: software
    areas:
      - 8
    assessment:
      date: 2026-09-07
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/templates/domain/template.ts
          note: reusable AAS template per organisation
        - type: code
          ref: apps/main/src/aas/domain/submodel-base/register-submodel-element-classes.ts
          note: the eleven supported submodel-element types
        - type: code
          ref: apps/main/src/aas/domain/submodel-base/file.ts
          note: File element for an attached declaration of conformity
        - type: code
          ref: apps/client/src/components/aas/LinkCellField.vue
          note: URL property, e.g. a link to the act or the standard cited
        - type: code
          ref: apps/main/src/aas/domain/common/has-semantics.ts
          note: semanticId on every element
      notes: "Software part: a passport able to hold all the information the EU declaration of conformity of each named act requires (the AI Act, the Cyber Resilience Act, RoHS, EMC, LVD, RED and the drone Delegated Regulation each fix a declaration model in an annex: product identification, manufacturer, sole-responsibility statement, object, Union law, standards or specifications, notified body, place, date and signatory), so that the passport can stand in for those declarations under points (a) to (d). Credited: every element of such a declaration is modellable as a text Property, a URL Property or a File element, and a signed declaration can be attached as a document. Missing: no declaration-of-conformity structure per act ships, nothing marks which acts a passport covers or checks that it holds everything the act's declaration model needs before the manufacturer relies on paragraph 5, and an attached PDF is a document, not passport data (#841; the mention itself is TOYS-Art19(6) and TOYS-AnnexVI-I(h)). No ESPR counterpart; nearest ESPR-AnnexIII(e) (Partial, #827), which asks for the compliance documents."
      gapIssue: 841
