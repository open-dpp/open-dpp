      notes: "Optional content fixed in the law: the Annex VI Part II safety information and warnings and the instructions of use (the Mirrors TOYS-AnnexVI-II(a) and II(b) of ESPR-AnnexIII(f), Partial, #827). Credited: templates accept any additional submodel or element, so warnings and instructions are addable today as text, per language in the data model, or as an attached leaflet. Missing: no Part II structure ships to add as such, and a multilingual warning text is not rendered in the public view (#838); tracked with the content cluster #841. Same shape as ESPR-Art10(2), ESPR-AnnexIII-para3 and DET-Art21(3), with the optional set fixed."
      gapIssue: 841
