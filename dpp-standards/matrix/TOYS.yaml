      notes: "Where the toy also needs a passport under an ESPR Art. 4 delegated act or other Union law, its unique product identifier, unique operator identifier and unique registration identifier are the same under both regimes. Credited: one passport (TOYS-Art19(9)) carries one set of product identifiers that is globally unique across the instance, so the product identifier is the same by construction and a GS1 identity is the same everywhere. Missing: the unique operator identifier and the unique registration identifier do not exist in open-dpp at all (no operator identifier on an organisation, no registration-identifier field, no registry client; #579), so two of the three identifiers the clause equates cannot be the same because they cannot be held; and nothing stops an operator from minting a second passport with a different identifier for the other regime (#597, #839). Same finding as DET-Art23(3); no ESPR counterpart."
      gapIssue: 579
