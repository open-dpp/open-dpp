      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/templates/domain/template.ts
          note: reusable AAS template per organisation
        - type: code
          ref: apps/main/src/aas/domain/submodel-base/register-submodel-element-classes.ts
          note: the eleven supported submodel-element types
        - type: code
          ref: apps/main/src/aas/domain/submodel-base/multi-language-property.ts
          note: multilingual text in the data model
        - type: code
          ref: apps/main/src/aas/domain/submodel-base/file.ts
          note: File element for an attached instruction leaflet
        - type: code
