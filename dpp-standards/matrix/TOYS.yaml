criteria:
  # ---- Article 19 ---------------------------------------------------------------------------
  - id: TOYS-Art19(1)
    section: Art19
    clause: Art. 19(1)
    paraphrase: "Before a toy is placed on the market its manufacturer creates a DPP that meets Art. 19 and Art. 20. Restates the first limb of ESPR-Art9(1) with the creator fixed as the manufacturer and the requirements fixed in the Regulation itself, not in a delegated act."
    applicability: mixed
    areas:
      - 1
      - 6
    assessment:
      date: 2026-09-07
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/passports/presentation/passport.controller.ts
          note: POST /passports from a template or an environment, PUT status, AAS update routes
        - type: code
          ref: apps/main/src/passports/application/services/passport.service.ts
          note: createPassportFromTemplate, status changes, draft-only delete
        - type: code
          ref: apps/main/src/digital-product-document/domain/digital-product-document-status.ts
          note: Draft -> Published -> Archived -> Restore
        - type: code
          ref: apps/main/src/permalink/application/services/permalink.application.service.ts
          note: public URL resolution and freeze on publish
        - type: test
          ref: apps/main/src/passports/application/services/passport.service.spec.ts
          note: creation from a template, publish freezes permalinks
        - type: test
          ref: apps/e2e/tests/passport-identity/publish-freeze.spec.ts
          note: publishing freezes the permalink and opens it to anonymous visitors
        - type: doc
          ref: docs/guides/digital-product-document/lifecycle.md
          note: the three lifecycle stages and what each allows; no page on creating, editing or serving a passport
      notes: "Software part: a passport the manufacturer can create before placing the toy on the market, and that meets Art. 19 and 20. Credited: a passport is created from a template or an environment, held as a draft, published and then served publicly at its permalink and through the GS1 resolver; every change is recorded. Missing: the passport does not meet Art. 19 and 20 as this run assesses them, above all the Annex VI content and the declaration-of-conformity elements (#841, the cluster whose delivery makes a passport an Art. 19 passport), the Member-State languages (#838), the single-passport and separation rules (#839), the Safety Gate link on access (#842), the no-tracking rule (#840), the external access classes (#821), the model granularity (#597) and the print-ready carrier (#489); the operator docs cover the lifecycle stages only (#828). Same reading as CPR-Art75(2)(b) after its adversarial review and DET-Art21(1): the generic mechanics are credited, the sector content is the gap. The creator is fixed as the manufacturer: any organisation member can create a passport, which is the manufacturer's own affair. Applies from 1 August 2030."
      gapIssue: 841
  - id: TOYS-Art19(2)(a)
    section: Art19
    clause: Art. 19(2)(a)
    paraphrase: "The DPP corresponds to a specific toy model. Restates ESPR-Art10(1)(f) and ESPR-Art9(2)(d) with the granularity fixed at model level by the law (batch level only under the Art. 19(9) derogation)."
    applicability: software
    areas:
      - 3
      - 8
    assessment:
      date: 2026-09-07
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/unique-product-identifier/domain/unique.product.identifier.ts
          note: granularity is model when a GS1 identity has no batch or serial
        - type: code
          ref: packages/dto/src/unique-product-identifiers/unique-product-identifier-type.ts
          note: Gs1Granularity model, batch, item
        - type: code
          ref: apps/main/src/aas/presentation/environment.service.ts
          note: assetKind Instance for passports, Type for templates
        - type: test
          ref: apps/main/src/unique-product-identifier/domain/unique.product.identifier.spec.ts
          note: model granularity for a bare GTIN
      notes: "The Regulation fixes the passport at the toy model (the conformity-assessment modules of Annex IV speak of the passport of a toy model). Credited: a GS1 identity with a bare GTIN is a model-level identifier and resolves as one, and several identifiers may sit on a passport, so a model passport can be built. Missing: no passport-level granularity or model attribute, an open-dpp UUID identifier carries no level, nothing ties a passport to a model definition so that a changed model yields a new passport, and a passport's AAS asset is always assetKind Instance while Type is reserved for templates, so a model passport cannot declare itself one (#597; same finding as DET-Art21(2)(a), CPR-Art76(2)(d), ESPR-Art9(2)(d) and REG1778 Art. 8(3)). The batch-level derogation is TOYS-Art19(9)."
      gapIssue: 597
  - id: TOYS-Art19(2)(b)
    section: Art19
    clause: Art. 19(2)(b)
    paraphrase: The DPP states that the toy's compliance with the Regulation, in particular the essential safety requirements, has been demonstrated (the declaration-of-conformity statement lives inside the DPP; no ESPR counterpart).
    applicability: software
    areas:
      - 8
    assessment:
      date: 2026-09-07
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/templates/domain/template.ts
          note: reusable AAS template per organisation
        - type: code
          ref: apps/main/src/aas/domain/submodel-base/register-submodel-element-classes.ts
          note: the eleven supported submodel-element types
        - type: code
          ref: apps/main/src/aas/domain/common/has-semantics.ts
          note: semanticId on every element
        - type: code
          ref: apps/client/src/components/presentation/SubmodelElementValue.vue
          note: a text Property renders in the public view
      notes: "The passport states that the toy's compliance with the Regulation, in particular the essential safety requirements of Art. 5 and Annex II, has been demonstrated (recital 54: the passport replaces the EU declaration of conformity; the content rows are TOYS-AnnexVI-I(d) and I(g)). Credited: a text Property holding the statement is modellable in a template, carries a semanticId and renders in the public view. Missing: no compliance-statement element or fixed text ships, nothing marks a passport as carrying the statement, and a multilingual statement is not rendered (#838); tracked in the content cluster #841. Same finding as DET-Art21(2)(b). No ESPR counterpart."
      gapIssue: 841
  - id: TOYS-Art19(2)(c)
    section: Art19
    clause: Art. 19(2)(c)
    paraphrase: The DPP contains at least the data of Annex VI Part I. Restates ESPR-Art9(2)(a) with the mandatory data set fixed in the law instead of a delegated act.
    applicability: software
    areas:
      - 8
    assessment:
      date: 2026-09-07
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/templates/domain/template.ts
          note: reusable AAS template per organisation
        - type: code
          ref: apps/main/src/aas/domain/submodel-base/register-submodel-element-classes.ts
          note: the eleven supported submodel-element types
        - type: code
          ref: apps/main/src/passports/domain/passport.ts
          note: a passport is an AAS Environment per product, created from a template
        - type: code
          ref: apps/main/src/aas/domain/common/has-semantics.ts
          note: semanticId on every element
      notes: "The mandatory data set is fixed in the law (Annex VI Part I, fourteen points) instead of a delegated act. Credited: templates are freely composable per organisation and passports are created from them, so an operator can build the Part I set by hand, element by element, as the Annex VI rows record. Missing: no Annex VI Part I template or submodel ships, and nothing checks that a passport holds the whole set before it is published (#841; a validation against a data model is the semantic-repository question, #826). Same shape as ESPR-Art9(2)(a) and DET-Art21(2)(c), with the set fixed."
      gapIssue: 841
  - id: TOYS-Art19(2)(d)
    section: Art19
    clause: Art. 19(2)(d)
    paraphrase: The DPP is accurate, complete and up to date (the second limb of ESPR Art. 9(1)).
    applicability: mixed
    areas:
