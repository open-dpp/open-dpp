    mirrors: ESPR-Art9(1)
  - id: TOYS-Art19(2)(e)
    section: Art19
    clause: Art. 19(2)(e)
    paraphrase: The DPP is available in the language or languages required by the Member State where the toy is made available (no ESPR counterpart; multilingual passport content).
    applicability: software
    areas:
      - 8
      - 11
    assessment:
      date: 2026-09-07
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/aas/domain/submodel-base/multi-language-property.ts
          note: one text per language in the data model and the API
        - type: code
          ref: packages/dto/src/aas/enums/language-enum.ts
          note: fixed list of 29 language codes; Irish (ga) and Maltese (mt) absent
        - type: code
          ref: apps/client/src/components/aas/form/LanguageTextArrayForm.vue
          note: element and submodel labels editable per language
        - type: code
          ref: apps/client/src/components/presentation/PresentationLanguageSelect.vue
          note: language switcher of the public view, built from the passport's language tags
        - type: code
          ref: apps/client/src/composables/presentation-language.ts
          note: the chosen language travels in the ?lang= query parameter as a BCP 47 tag
        - type: code
          ref: apps/client/src/composables/language.ts
          note: browser preference picks the initial language; per-text resolution with en fallback
        - type: code
          ref: apps/client/src/components/presentation/SubmodelElementValue.vue
          note: "no MultiLanguageProperty branch: the value renders blank"
        - type: code
          ref: apps/client/src/composables/aas-editor.ts
          note: the element menu offers no MultiLanguageProperty
        - type: test
          ref: apps/client/src/composables/language.spec.ts
          note: language resolution and preferred-language selection
      notes: "Software part: let the operator enter the passport in every language a Member State requires and show a visitor one of them. Credited: MultiLanguageProperty in the data model and API, per-language labels editable in the client, a language switcher on the public view driven by the languages present in the passport, a shareable ?lang= choice and browser-preference detection. Missing: a MultiLanguageProperty value is not rendered in the public view (label shown, value blank; also empty in tables) and cannot be created or edited in the client, so values are single-language Properties duplicated by hand; the language list behind every language text lacks Irish and Maltese, so two EU official languages cannot be entered at all; the public view's own strings exist in English and German only; nothing checks completeness per language; no operator documentation (#838). Same finding as DET-Art21(2)(e), the identical clause; no ESPR counterpart."
      gapIssue: 838
  - id: TOYS-Art19(2)(f)
    section: Art19
    clause: Art. 19(2)(f)
    paraphrase: "The DPP is accessible to consumers and other end users, market surveillance authorities, customs authorities, notified bodies, the Commission and other economic operators according to the access rights set by the Art. 49(1)(d) delegated act. Restates ESPR-Art11(b) with a different actor list: notified bodies added; repairers, recyclers, civil society and trade unions not named."
    applicability: software
    areas:
      - 5
      - 11
    assessment:
      date: 2026-09-07
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/aas/domain/security/access-control.ts
          note: per-submodel and per-element access rules
        - type: code
          ref: apps/main/src/aas/domain/security/subject-attributes.ts
          note: "role hierarchy: admin, owner, member, user, anonymous"
        - type: code
          ref: apps/client/src/components/aas/PermissionsForm.vue
          note: editor UI to grant or withdraw the anonymous read right per element
        - type: test
          ref: apps/main/src/aas/domain/security/security.spec.ts
          note: access rules per role and element
        - type: test
          ref: apps/main/src/aas/presentation/environment.service.spec.ts
          note: an anonymous subject is refused on a hidden submodel (ForbiddenError)
      notes: "Software part: give consumers and other end users, market surveillance and customs authorities, notified bodies, the Commission and other economic operators access to the data meant for each, as the Art. 49(1)(d) delegated act will fix (it does not exist yet). Credited: per-submodel and per-element visibility for the roles anonymous, organisation member, organisation owner and instance admin; a published passport is public by default and any element can be withheld from anonymous readers, which covers the consumer class today. Missing: none of the named external classes (market surveillance, customs, a notified body, the Commission, another economic operator) can be expressed, so information cannot be shown to an authority or a notified body and withheld from the public, and there is no credential-based grant (#821; same finding as DET-Art21(2)(f), ESPR-Art9(2)(f), CPR-Art75(2)(c) and BATT-Art77(2)). The delta against ESPR-Art11(b) is the actor list: notified bodies added, repairers, civil society and trade unions absent. Free access is the Mirror TOYS-Art20(3), the no-registration rule TOYS-Art20(4). Re-validate when the delegated act fixes the access rights."
      gapIssue: 821
  - id: TOYS-Art19(2)(g)
    section: Art19
    clause: Art. 19(2)(g)
    paraphrase: The DPP stays available for 10 years after the toy is placed on the market, including after insolvency, liquidation or cessation of the creating operator's activity in the Union. Restates ESPR-Art11(e) and ESPR-Art9(2)(i) with the period fixed at 10 years from placing on the market.
    applicability: mixed
    areas:
      - 6
    assessment:
      date: 2026-09-07
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/passports/application/services/passport.service.ts
          note: deletePassport refuses non-draft passports
        - type: code
          ref: apps/main/src/digital-product-document/domain/digital-product-document-status.ts
          note: Draft -> Published -> Archived -> Restore
        - type: test
          ref: apps/main/src/passports/application/services/passport.service.spec.ts
          note: deletePassport rejects non-draft passports
        - type: doc
          ref: docs/guides/digital-product-document/lifecycle.md
          note: what each stage allows
      notes: "Software part: keep the passport available for 10 years after the toy is placed on the market (Art. 7(3) puts the same 10 years on the manufacturer's keeping duty), including after the creator's insolvency, liquidation or cessation of activity in the Union. Credited: published and archived passports cannot be deleted and archiving is reversible, so a passport stays in the system indefinitely, and the lifecycle is documented. Missing: no representation of an availability period or of the placing-on-the-market date it runs from, an archived passport is no longer served publicly (the permalink service requires Published), no back-up (#596; the back-up copy itself is the Mirror TOYS-Art19(13)) and no escrow, handover or continuity once the operator ceases (#825). Same finding as DET-Art21(2)(g), ESPR-Art9(2)(i) and CPR-Art76(2)(h), with the period fixed at 10 years."
      gapIssue: 825
  - id: TOYS-Art19(2)(h)
    section: Art19
    clause: Art. 19(2)(h)
