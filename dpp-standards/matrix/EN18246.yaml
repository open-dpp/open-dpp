criteria:
  - id: EN18246-4.1(2)
    section: "4.1"
    clause: 4.1(2)
    paraphrase: "All DPP data are protected against modification by anyone not entitled to make it, and every item of data can be traced back to a source that can be verified."
    applicability: software
    areas:
      - 10
      - 5
    assessment:
      date: 2026-10-12
      commit: ea05ef20dbe4eaab478330f40ec32ff52081d83a
      validator: agent:conformance-review
      status: Partial
      evidence:
        - type: code
          ref: apps/main/src/identity/auth/infrastructure/guards/auth.guard.ts
          note: every non-public route needs a session, API key or bearer token and organisation membership
        - type: code
          ref: apps/main/src/aas/domain/security/security.ts
          note: element access rules per role
        - type: code
          ref: apps/main/src/activity-history/infrastructure/activity.schema.ts
          note: user id and time per record, no hash or signature
        - type: test
          ref: apps/main/src/permalink/presentation/permalink.controller.spec.ts
          note: anonymous writes refused on the public routes
        - type: check
          ref: access.anonymous-denied-management
          result: passed
          date: 2026-10-12
        - type: check
          ref: access.foreign-user-denied-management
          result: passed
          date: 2026-10-12
      notes: "Credited: only the owning organisation's members, within the element rules, can change passport data (Checks: anonymous and outside users are refused), and the activity history names the user behind each recorded content change. Missing: nothing makes the data attributable to a source a third party can verify; the user id is internal, unsigned and not in the passport or its export (#824)."
      gapIssue: 824
  - id: EN18246-4.1(3)
    section: "4.1"
    clause: 4.1(3)
    paraphrase: "The mechanisms that keep DPP data intact and authentic work independently of whatever secures the channel the data travel over, so transport security alone does not satisfy them."
    applicability: software
    areas:
      - 10
    assessment:
      date: 2026-10-12
      commit: ea05ef20dbe4eaab478330f40ec32ff52081d83a
      validator: agent:conformance-review
      status: Gap
      evidence:
        - type: code
          ref: apps/main/src/aas/infrastructure/serialization/aas-serialization.service.ts
          note: export envelope without signature or hash
        - type: manual
          ref: "Searched apps/main/src and packages at ea05ef20 for signing, hashing, certificate and credential code (createSign, createHash, subtle.sign, X.509, JWS, verifiable credentials): the only hits are the OAuth Provider's token signing and test helpers; passport data, exports and the activity history are never signed or hashed."
          date: 2026-10-12
      notes: "open-dpp has no integrity or authenticity mechanism of the data's own: no signature, seal, hash or ESDC on passport data or exports. Whatever protection exists is the access control on the routes and, when the operator adds it, TLS on the channel, which is exactly what this clause says is not enough (#824)."
      gapIssue: 824
  - id: EN18246-4.2(3)
    section: "4.2"
    clause: 4.2(3)
    paraphrase: "Each actor with access to controlled DPP data carries an identifier that no other actor anywhere shares (for economic operators, the unique economic operator identifier of 3.9 and EN 18219). Annex ZA maps clause 4.2 to ESPR-Art11(a), organisational interoperability only."
    applicability: software
    areas:
      - 5
      - 10
    assessment:
      date: 2026-10-12
      commit: ea05ef20dbe4eaab478330f40ec32ff52081d83a
      validator: agent:conformance-review
      status: Gap
      evidence:
        - type: code
          ref: apps/main/src/identity/users/domain/user.ts
          note: users known by internal id, name and e-mail
        - type: code
          ref: apps/main/src/aas/domain/security/subject-attributes.ts
          note: "subjects: anonymous, user, member or owner, instance admin"
        - type: code
          ref: apps/main/src/identity/auth/infrastructure/guards/auth.guard.ts
          note: every non-public route needs a session, API key or bearer token and organisation membership
      notes: Actors reaching controlled data are organisation members, API keys acting as their creator, or the instance admin, all known by internal ids, names and e-mail addresses. No actor carries a globally unique identifier such as the operator identifier of EN 18219, and an Organization has none either (#1023, as EN18239-5.2(1)). Annex ZA ties 4.2 to ESPR-Art11(a), which is therefore at most Partial when the interoperability assessment (#762) grades it.
      gapIssue: 1023
  - id: EN18246-4.2(4)
    section: "4.2"
    clause: 4.2(4)
    paraphrase: "Authentication follows the level of assurance the access requires (levels of assurance in the sense of ISO/IEC 29115)."
    applicability: software
    areas:
      - 10
      - 5
    assessment:
      date: 2026-10-12
      commit: ea05ef20dbe4eaab478330f40ec32ff52081d83a
      validator: agent:conformance-review
      status: Partial
      evidence:
        - type: code
          ref: apps/main/src/identity/auth/auth.provider.ts
          note: e-mail and password, optional OAuth Trusted Client, API keys; no second factor
        - type: code
          ref: apps/main/src/identity/auth/infrastructure/guards/auth.guard.ts
          note: every non-public route needs a session, API key or bearer token and organisation membership
      notes: "Credited: controlled data need authentication (password session, API key, or an access token of the optional OAuth Trusted Client). Missing: no notion of level of assurance and only one strength of authentication: no second factor, no identity proofing, no stronger method for more sensitive data or roles, and e-mail verification is sent but not required to sign in (#1023)."
      gapIssue: 1023
