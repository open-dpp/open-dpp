  - id: EN18246-A.3(1)
    section: A
    clause: A.3, first list
    paraphrase: "An ESDC lets a verifier confirm that DPP data were not altered after issuance, confirm who issued them and so where they come from, hold the issuer to the issuance (non-repudiation), and check the issuer's authority and accreditation through its certificate's status against a trusted list or another governance scheme."
    applicability: software
    areas:
      - 10
  - id: EN18246-A.3(2)
    section: A
    clause: A.3, second list
    paraphrase: "An ESDC names its issuer by a recognised identifier (EN 18219) tied to the signing key or certificate (for core product data, normally the economic operator that puts the product on the market), names its subject by a globally unique product identifier, holds the data about that subject, and is signed with the issuer's private key under a certificate managed in a recognised trust framework; the DPP ESDC is signed electronically by the responsible economic operator or its authorised representative."
    applicability: software
    areas:
      - 10
      - 3
