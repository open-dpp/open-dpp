  - id: EN18246-4.7(1)
    section: "4.7"
    clause: 4.7(1)
    paraphrase: "The authenticity and integrity of a DPP's data can be verified; in regulated situations, cross-border ones for instance, that verification costs nothing and uses interoperable mechanisms."
