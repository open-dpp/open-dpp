    section: "4.7"
    clause: 4.7(3)
    paraphrase: "Each change to DPP data, from the first creation to deletion, is tied to the authenticated identity of whoever made it, for instance by valid digital certificates, so that the change cannot be denied later; certificate-based digital signatures, seals, electronic attestations of attributes or ESDCs are named as ways to do it."
