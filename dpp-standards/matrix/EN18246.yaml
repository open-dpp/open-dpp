  - id: EN18246-4.5(2)
    section: "4.5"
    clause: 4.5(2)
    paraphrase: "Any way of making the product identifier authentic and tamper-evident remains fully interoperable with the EN 18219 unique identifiers."
    applicability: software
    areas:
      - 3
      - 10
    assessment:
      date: 2026-10-12
      commit: ea05ef20dbe4eaab478330f40ec32ff52081d83a
      validator: agent:conformance-review
      status: Gap
      evidence:
        - type: code
          ref: apps/client/src/components/QrCode.vue
          note: QR code drawn in the browser (qrcode library) from a link
      notes: "A conditional duty on whatever protects the identifier. open-dpp offers no such protection, so no protected identifier exists whose interoperability with EN 18219 could be shown; graded Gap in the cluster of the missing feature by the map rule of 2026-10-12 (#763: a clause that only constrains a feature open-dpp lacks is Gap in that feature's cluster; one that protects an outcome open-dpp delivers is graded on the outcome). A protection added outside open-dpp would have to keep the GS1 Digital Link resolvable, which the cluster names as a constraint (#1037)."
      gapIssue: 1037
  - id: EN18246-4.5(3)
