  - id: EN18246-4.3(c)
    section: "4.3"
    clause: 4.3(c)
    paraphrase: "Recommendation: the access control in front of DPP data copes with a large volume of requests and the service stays usable and stable under it."
    applicability: mixed
    areas:
      - 10
      - 11
    assessment:
      date: 2026-10-12
      commit: ea05ef20dbe4eaab478330f40ec32ff52081d83a
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/permalink/presentation/permalink.controller.ts
          note: public passport and AAS read routes are OptionalAuth
        - type: code
          ref: apps/main/src/common/throttler/user-or-ip.throttler-guard.ts
          note: throttling on a few account routes only
        - type: doc
          ref: docs/guides/production-setup.md
          note: says the example stack has no TLS termination; no TLS, proxy or backup guide
      notes: "Recommendation, assessed as enablement. Public reads are stateless requests answered from the database, but nothing protects the service from floods of requests: public routes are not rate limited, there is no caching layer or guide for sizing and scaling, and the health endpoint checks no dependency (#1026; hardening and availability in #1027)."
      gapIssue: 1026
  - id: EN18246-4.3(d)
    section: "4.3"
    clause: 4.3(d)
