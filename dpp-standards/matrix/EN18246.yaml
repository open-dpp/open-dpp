  - id: EN18246-4.3(e)
    section: "4.3"
    clause: 4.3(e)
    paraphrase: "Whatever extra security measure is added, public DPP data stay reachable without additional software."
    applicability: software
    areas:
      - 10
      - 11
    assessment:
      date: 2026-10-12
      commit: ea05ef20dbe4eaab478330f40ec32ff52081d83a
      validator: agent:conformance-review
      status: Met
      evidence:
        - type: check
          ref: access.public-view-renders-in-plain-browser
          result: passed
          date: 2026-10-12
        - type: code
          ref: apps/main/src/permalink/presentation/permalink.controller.ts
          note: public passport and AAS read routes are OptionalAuth
        - type: code
          ref: apps/main/src/identity/auth/infrastructure/guards/auth.guard.ts
          note: public routes pass without any credential or challenge
      notes: "Graded on the outcome (map rule of 2026-10-12, #763). No security measure stands in front of public data: the public routes need no credential, CAPTCHA, client certificate, app attestation or token, so nothing an implementation adds there requires extra software (Check access.public-view-renders-in-plain-browser). Should rate limiting arrive (#1026), it has to keep this property; that is noted on the cluster."
  - id: EN18246-4.4(2)
    section: "4.4"
    clause: 4.4(2)
    paraphrase: "Exchanges of DPP data are protected by encryption and authentication following the applicable standards, which keeps the data confidential and unaltered and shuts out tampering, unauthorised reading and leaks; for public data neither is required."
    applicability: mixed
    areas:
      - 1
      - 10
    assessment:
      date: 2026-10-12
      commit: ea05ef20dbe4eaab478330f40ec32ff52081d83a
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/main.ts
          note: plain HTTP listener, no security headers
        - type: code
          ref: apps/main/src/identity/auth/auth.provider.ts
          note: e-mail and password, optional OAuth Trusted Client, API keys; no second factor
        - type: doc
          ref: docs/guides/production-setup.md
          note: says the example stack has no TLS termination; no TLS, proxy or backup guide
      notes: "Credited: controlled data need authentication, and public data need none, as the clause allows. Missing: open-dpp serves plain HTTP and leaves encryption to a reverse proxy it neither ships nor documents, so controlled data and session cookies travel unencrypted unless the operator adds TLS on its own (#1027, as EN18216-4(1) and 4(2)). The TLS Checks skip on the plain-http Instance."
      gapIssue: 1027
  - id: EN18246-4.4(3)
    section: "4.4"
    clause: 4.4(3)
    paraphrase: "Recommendation: DPP service providers apply the requirements ETSI EN 319 401:2024 sets for trust service providers (general policy requirements of an organisation offering trust services)."
