      notes: "Annex A is normative but states what an ESDC provides rather than imposing a duty with a requirement verb; read as what an ESDC must provide where one is used, the means the scope of EN 18246 builds its framework on (4.7(3) also admits signatures, seals and attestations, of which open-dpp has none either). Annex ZA maps nothing here, so these rows cap no law row. open-dpp produces no ESDC or any other signed construct: no issuer signature to confirm integrity and provenance, no non-repudiation of the issuer, and no check of the issuer's authority against a trusted list (#824)."
