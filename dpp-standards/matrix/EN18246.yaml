      status: Not applicable
      evidence: []
      notes: "Operator recommendation by rule: ETSI EN 319 401 holds organisational policy requirements for trust service providers (risk management, staff, assets, operations, incident handling, termination); following them is the DPP service provider's management system, which no software feature provides."
  - id: EN18246-4.4(4)
    section: "4.4"
    clause: 4.4(4)
    paraphrase: "Those responsible provide channels on which any system or actor can exchange DPP data without friction, across platforms and in line with national and international rules; EN 18216 defines those channels."
    applicability: mixed
    areas:
      - 1
      - 2
    assessment:
      date: 2026-10-12
      commit: ea05ef20dbe4eaab478330f40ec32ff52081d83a
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/aas/presentation/aas.endpoints.ts
          note: AAS read, create, modify and delete endpoints
        - type: code
          ref: apps/main/src/permalink/presentation/permalink.controller.ts
          note: public passport and AAS read routes are OptionalAuth
      notes: "This clause defers to EN 18216, whose run (2026-10-11) gives the detail: a RESTful JSON API is met (EN18216-4(6)), while TLS and HTTP/2 are left to the operator (#1027) and nothing negotiates the representation, so a machine following the Digital Link gets the app shell instead of data (#1034). The channel exists and is open, but it is not yet interoperable in the sense EN 18216 sets."
      gapIssue: 1034
