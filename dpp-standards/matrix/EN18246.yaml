# Conformance Matrix: EN18246 (EN 18246:2026). Rules: dpp-standards/README.md.
# Criteria extracted from the final text (English SIS edition, edition 1, git-ignored standards/EN18246-2026.pdf) on 2026-10-12 (ticket #763); assessments are added in place, one per Criterion.
# Gated text: every paraphrase is ours, never a sentence of the standard.
# Clause numbering: one Criterion per paragraph that carries a requirement; "4.7(5)" is the fifth paragraph of 4.7, and paragraphs without a requirement of their own keep their number and are listed below. The five bullets of 4.3 are lettered (a) to (e) in their printed order. 5.4.1 has a single paragraph with two addressees: "-sub1" is the system, "-sub2" the training of stakeholders. Annex A is normative; its key characteristics (A.3) are two Criteria, the mechanism an ESDC provides and the parts it consists of.
# Not extracted, no requirement of their own: the Introduction, clauses 1 (scope: integrity, authenticity and reliability of DPP data exchange through electronically signed data constructs, ESDCs; system architecture, use cases, secure elements of carriers and cryptographic features of identifiers are out of its scope), 2 (normative references: EN 18216, EN 18219, EN 18220, EN 18221, EN 18239, all assessed as their own texts) and 3 (terms, among them additional software 3.10, which excludes browsers, camera-based QR readers and standard protocols), 4.1(1) (public and controlled data), 4.2(1) and 4.2(2) (pointers to EN 18239 for the actors and to 3.9 and EN 18219 for the operator identifier), 4.4(1) (what communication means here), 4.6(3) (a protection may need further carriers or data sources), 5.1.1 (what clause 5.1 covers: anonymous reads with common devices and authenticated CRUD on controlled data), 5.1.4(1), 5.1.7(2) to (4), 5.1.8(1) and (3), 5.2.1(1) and (2), 5.3.2(2) (risk descriptions and examples), 5.2.1(3) (identification mechanisms may be made stringent; the mechanisms are those of EN 18219 and of 4.5 and 5.3.1), A.1, A.2 and the rest of A.3 (what ESDCs are, that their structure depends on the construct used, and the example technologies ISO 22376, ISO/IEC 20248, W3C Verifiable Credentials, electronic attestations of attributes, electronic seals and signatures), the informative Annexes B (the example ESDCs in detail) and C (fair competition: basic search and reading must not need vendor-specific software, voluntary functions complement and never replace the core ones) and the Bibliography (ETSI EN 319 401 among others).
# Mirrors: three bullets restate an EN 18239 clause with no delta and carry no Assessment of their own: 4.3(a) mirrors EN18239-5.2(2); 4.3(b) and 5.1.5(2) restate the first and the second sentence of EN18239-5.2(24). 5.2.2(2) is not a Mirror of EN18239-5.2(3): it binds authentication and identification rather than access and management, and adds the proviso that legal requirements are met.
# Annex ZA (informative) maps a single clause: 4.2 confers presumption of conformity with ESPR Art. 11(a), limited to organisational interoperability for end-to-end communication and data transfer, once the EN is cited in the OJ (not yet: EN 18246 waits for the second implementing decision). The other law rows naming EN18246 in operationalisedBy are rows its clauses address without presumption (map rule of 2026-10-09: Annex ZA plus the links the text supports): ESPR Art. 11(b) and BATT Art. 78(b) (4.3 and 5.4, public access without authentication, software or barriers), ESPR Art. 11(f) and BATT Art. 78(f) (4.1(2), no unauthorised modification), ESPR Art. 11(g) and BATT Art. 78(g) (the text as a whole), ESPR Art. 11(h) and BATT Art. 78(h) (5.1 security and privacy, 5.3 counterfeiting), ESPR Art. 13(2)(a) (verifying authenticity) and REG1778 Art. 8(9)(d) and 9(2)(e) (4.7(1): a DPP verifiable in integrity, which the registry's integrity evidence and the version hash presuppose; the text names neither a hash nor the registry).
