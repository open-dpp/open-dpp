# Conformance Matrix: EN18239 (EN 18239:2026). Rules: dpp-standards/README.md.
# Criteria extracted from the final text (English SIS edition, edition 1, git-ignored standards/EN18239-2026.pdf) on 2026-10-09 (ticket #758); assessments are added in place, one per Criterion.
# Gated text: every paraphrase is ours, never a sentence of the standard.
# Not extracted, no requirement of their own: clause 1 (scope), 2 (normative references: EN 18219 only), 3 (terms), 5.1 (lead-in to 5.2), 6.4.1 (definition of digital operational resilience), Annex A (informative authentication assumptions: identity proofing, multifactor authentication, sole control of the means, protection of exchanged secrets, timely suspension and revocation; 5.2(13) and 5.2(22) point to it as best practice) and the Bibliography (EN ISO/IEC 27000, 27001, EN ISO 22301, ISO/IEC 27031 and the other cited texts are informative here).
# Annex ZA (informative) maps a single clause: 4.2 confers presumption of conformity with ESPR Art. 11(a), limited to organisational interoperability for end-to-end communication and data transfer, once the EN is cited in the OJ. The other law rows naming EN18239 in operationalisedBy are rows its clauses address without presumption (decided 2026-10-09: Annex ZA plus the links the text supports).
standard: EN18239
edition: EN 18239:2026
extractedFrom: standards/EN18239-2026.pdf
extractedAt: 2026-10-09
sections:
  - id: "4"
    title: 4 Business transactions and responsibilities related to the DPP
  - id: "5.2"
    title: 5.2 Requirements for the protection of business confidentiality
  - id: "6.1"
    title: 6.1 General requirements
  - id: "6.2"
    title: 6.2 Access management
  - id: "6.3"
    title: 6.3 Access revoking policy
  - id: "6.4"
    title: 6.4 Digital operational resilience
  - id: "6.5"
    title: 6.5 Security management
criteria:
  - id: EN18239-4.1
    section: "4"
    clause: "4.1"
    paraphrase: "Access rights management is laid out along the phases and stages of the DPP life cycle (taken from EN ISO 11354-1). Only the phases relevant to the product group apply, and a product-group stage the generic list lacks is still covered when access rights management is implemented."
    applicability: mixed
    areas:
      - 5
      - 6
    assessment:
      date: 2026-10-09
      commit: 272eab96e2d191ba9c48edcc3ab4a0822a12b7e4
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/permalink/application/services/permalink.application.service.ts
          note: only a Published passport resolves for non-members; Draft and Archived answer 404
        - type: test
          ref: apps/main/src/permalink/application/services/permalink.application.service.spec.ts
          note: unpublished passport refused to anonymous callers
        - type: code
          ref: apps/main/src/aas/domain/security/security.ts
          note: element access rules are the same in every status
        - type: doc
          ref: docs/guides/digital-product-document/lifecycle.md
          note: Draft, Published, Archived operations; nothing on who sees which status
      notes: "Software part: access that follows the passport's life cycle. Credited: the three statuses gate anonymous reading (only Published resolves). Missing: element access rules cannot vary by phase or stage (production, distribution, use, repair, end of life), there are no product-group stages, and the lifecycle page does not say who sees a passport in which status. The product group's stages come with the legislation-defined access model of #821."
      gapIssue: 821
  - id: EN18239-4.2
    section: "4"
    clause: "4.2"
    paraphrase: "Names the actors who handle a DPP along the value chain and need access to it: economic operators (manufacturer, authorised representative, importer, distributor, dealer, fulfilment service provider), other value-chain actors (consumers, professional repairers, independent operators, recyclers, market surveillance authorities), customs authorities, and service providers including the main and back-up DPP service providers of EN 18221. The list is open-ended. Annex ZA maps this clause to ESPR-Art11(a), organisational interoperability only."
    applicability: software
    areas:
      - 5
    assessment:
      date: 2026-10-09
      commit: 272eab96e2d191ba9c48edcc3ab4a0822a12b7e4
      validator: agent:conformance-review
      status: Partial
      evidence:
        - type: code
          ref: apps/main/src/aas/domain/security/subject-attributes.ts
          note: "access subjects: anonymous, user, organisation member or owner, instance admin"
        - type: code
          ref: apps/main/src/identity/organizations/domain/member-role.enum.ts
        - type: code
          ref: apps/main/src/identity/users/domain/user-role.enum.ts
      notes: "Credited: an economic operator is an Organization whose people are owners or members, the public (consumers) is the anonymous subject, and the instance operator hosting passports for organisations acts as main DPP service provider through the admin role. Missing: no actor type for authorised representatives, importers, distributors, dealers, fulfilment service providers, repairers, independent operators, recyclers, market surveillance or customs authorities, or a back-up DPP service provider; an Organization carries no actor type, so none of these can be told apart or given access of their own (#821). Annex ZA ties this clause to ESPR-Art11(a), organisational interoperability only; that row is assessed with EN 18223 (#762)."
      gapIssue: 821
  - id: EN18239-5.2(1)
    section: "5.2"
    clause: 5.2(1)
    paraphrase: "Every actor in a DPP system (the actors of 4.2) has a globally unique operator identifier as EN 18219 defines it."
    applicability: software
    areas:
      - 3
      - 5
    assessment:
      date: 2026-10-09
      commit: 272eab96e2d191ba9c48edcc3ab4a0822a12b7e4
      validator: agent:conformance-review
      status: Gap
      evidence:
        - type: code
          ref: apps/main/src/identity/organizations/domain/organization.ts
          note: internal database id only; the slug equals the id
      notes: "Organizations carry an internal id and users an internal id and an e-mail address; no EN 18219 operator identifier (GLN, EORI, LEI, VAT or registration number, DID) exists on either, in the API, the DTOs or the client. Operator identifiers as passport content are tracked by the content clusters (#837, #841); this row is about the actor's own identity in the DPP system."
      gapIssue: 1023
  - id: EN18239-5.2(2)
    section: "5.2"
    clause: 5.2(2)
    paraphrase: "Public DPP data can be read without any authentication (so that nobody is excluded, for instance because of their location)."
    applicability: software
    areas:
      - 5
      - 11
    assessment:
      date: 2026-10-09
      commit: 272eab96e2d191ba9c48edcc3ab4a0822a12b7e4
      validator: agent:conformance-review
      status: Met
      evidence:
        - type: code
          ref: apps/main/src/permalink/presentation/permalink.controller.ts
          note: public passport and AAS read routes are OptionalAuth
        - type: code
          ref: apps/main/src/unique-product-identifier/presentation/gs1-resolver.controller.ts
          note: GS1 resolver redirects anonymous scans of published passports
        - type: code
          ref: apps/main/src/aas/domain/security/security.ts
          note: every new submodel gets an anonymous Read rule by default
        - type: test
          ref: apps/main/src/permalink/presentation/permalink.controller.spec.ts
          note: bundle is anonymous readable
        - type: test
          ref: apps/e2e/tests/presentation-bignumber.spec.ts
          note: an anonymous viewer sees a passport value on the public view
        - type: test
          ref: apps/e2e/tests/passport-identity/publish-freeze.spec.ts
          note: publishing opens the permalink to anonymous visitors
        - type: check
          ref: access.anonymous-reads-published
          result: passed
          date: 2026-10-09
      notes: "A published passport and the elements anonymous may read are served without authentication through the permalink, the public AAS routes and the GS1 resolver. Not operational: anonymous Read is the default rule of every new submodel, so publishing is all an economic operator does. Attachments are more open than this clause asks (#836, see EN18239-5.2(22))."
  - id: EN18239-5.2(3)
    section: "5.2"
    clause: 5.2(3)
    paraphrase: "Reading and managing controlled DPP data is never refused merely because of the actor's location or jurisdiction."
    applicability: software
    areas:
      - 5
    assessment:
      date: 2026-10-09
      commit: 272eab96e2d191ba9c48edcc3ab4a0822a12b7e4
      validator: agent:conformance-review
      status: Met
      evidence:
        - type: code
          ref: apps/main/src/identity/auth/infrastructure/guards/auth.guard.ts
          note: decides on session, API key, bearer token and organisation membership only
        - type: code
          ref: apps/main/src/aas/domain/security/subject-attributes.ts
          note: an access rule is keyed on the role, nothing else
        - type: manual
          ref: "Searched apps/main/src, apps/client/src and packages at 272eab96 for geo-IP, country, region and IP allow or deny rules in guards, middleware and access rules: none. The only region setting is the S3 client's storage region."
          date: 2026-10-09
      notes: No access decision looks at an actor's location or jurisdiction. Geo-blocking added by an operator at a reverse proxy would break this clause; the software gives no reason to.
  - id: EN18239-5.2(4)
    section: "5.2"
    clause: 5.2(4)
    paraphrase: "Actors can obtain, and supply on request, everything needed to identify, authorise and account for them, their unique operator identifier included."
    applicability: software
    areas:
      - 3
      - 5
    assessment:
      date: 2026-10-09
      commit: 272eab96e2d191ba9c48edcc3ab4a0822a12b7e4
      validator: agent:conformance-review
      status: Partial
      evidence:
        - type: code
          ref: apps/main/src/identity/organizations/presentation/organizations.controller.ts
          note: members listed with name, e-mail and role
        - type: code
          ref: apps/main/src/activity-history/infrastructure/activity.schema.ts
          note: each recorded change carries the user id
      notes: "Credited: an organisation lists its members with name, e-mail and role through the API, the OAuth id token carries name and e-mail, and the activity history attributes each recorded change to a user. Missing: the unique operator identifier (EN18239-5.2(1)) and any way to present or request it; reads are not accounted to anyone (EN18239-5.2(16))."
      gapIssue: 1023
  - id: EN18239-5.2(5)
    section: "5.2"
    clause: 5.2(5)
    paraphrase: "Authenticating the actors who read or manage controlled DPP data makes them accountable, and managing controlled data (creating, modifying and reading it) relies on non-repudiation mechanisms."
    applicability: software
    areas:
      - 5
      - 10
    assessment:
      date: 2026-10-09
      commit: 272eab96e2d191ba9c48edcc3ab4a0822a12b7e4
      validator: agent:conformance-review
      status: Partial
      evidence:
        - type: code
          ref: apps/main/src/identity/auth/infrastructure/guards/auth.guard.ts
          note: every session, API key and token resolves to one user
        - type: code
          ref: apps/main/src/activity-history/infrastructure/activity.schema.ts
          note: user id and time per change
        - type: test
          ref: apps/main/src/aas/presentation/environment.service.spec.ts
          note: an activity per modifying operation
      notes: "Credited: every session, API key and OAuth token resolves to one user, and the activity history records which user changed which passport or template element, status or access rule, and when (editor drawer, GET /passports/:id/activities). Missing: non-repudiation: no signature or seal binds a user to a change and the records are ordinary database rows; reads of controlled data are attributed to nobody (the request log has IP and user agent, not the user); creating a passport and changing memberships are not recorded."
      gapIssue: 1024
  - id: EN18239-5.2(6)
    section: "5.2"
    clause: 5.2(6)
    paraphrase: "The economic operator can give rights and roles to any notified actor who needs its controlled DPP data, keyed on that actor's globally unique operator identifier; such rights are specific to the product group and follow the relevant legal act."
    applicability: software
    areas:
      - 5
    assessment:
      date: 2026-10-09
      commit: 272eab96e2d191ba9c48edcc3ab4a0822a12b7e4
      validator: agent:conformance-review
      status: Partial
      evidence:
        - type: code
          ref: apps/main/src/identity/organizations/presentation/organizations.controller.ts
          note: owner invites, changes roles, removes members
        - type: code
          ref: apps/main/src/aas/domain/security/security.ts
          note: member rule per element
      notes: "Credited: an owner can invite a person into the organisation, and the member rule of each element limits what members read or edit. Missing: rights cannot go to an actor outside the organisation, to one named actor or by operator identifier; membership is all or nothing across the organisation's passports, and nothing is product-group specific or tied to a legal act (#821; the operator identifier is #1023)."
      gapIssue: 821
  - id: EN18239-5.2(7)
    section: "5.2"
    clause: 5.2(7)
    paraphrase: "The roles that open regulated DPP data are fixed per product group by the relevant legal act; the economic operator can grant further privileges on top of them."
    applicability: software
    areas:
      - 5
    assessment:
      date: 2026-10-09
      commit: 272eab96e2d191ba9c48edcc3ab4a0822a12b7e4
      validator: agent:conformance-review
      status: Partial
      evidence:
        - type: code
          ref: apps/main/src/aas/domain/security/subject-attributes.ts
          note: fixed roles only
        - type: code
          ref: apps/main/src/aas/domain/security/access-control.ts
          note: "policy administration: a subject manages rules of subjects below it"
        - type: code
          ref: apps/client/src/components/aas/PermissionsForm.vue
          note: per-element permissions editor
      notes: "Credited: the economic operator can widen or narrow per element what owners, members and anonymous readers may do, which covers additional privileges for its own people. Missing: no role a product-group legal act defines (authorities, repairers, recyclers and the like) exists, so regulated roles cannot be given their data (#821)."
      gapIssue: 821
  - id: EN18239-5.2(8)
    section: "5.2"
    clause: 5.2(8)
    paraphrase: "The globally unique operator identifier is presented during authentication, for instance inside a trustworthy role credential, so that a holder of such a credential reaches controlled DPP data without each economic operator approving it one by one."
    applicability: software
    areas:
      - 3
      - 5
    assessment:
      date: 2026-10-09
      commit: 272eab96e2d191ba9c48edcc3ab4a0822a12b7e4
      validator: agent:conformance-review
      status: Gap
      evidence:
        - type: code
          ref: apps/main/src/identity/auth/infrastructure/guards/auth.guard.ts
          note: password session, API key or OAuth bearer token; none carries an operator identifier
      notes: Authentication accepts a password session, an API key or an access token of the optional Trusted Client; none carries an operator identifier, and no role credential (a verifiable credential or similar) is accepted, so an authority or notified actor cannot reach controlled data on the strength of its credential. The credential format awaits the implementing acts of ESPR Art. 11 fourth subparagraph (ESPR-Art11-sub4).
      gapIssue: 1023
  - id: EN18239-5.2(9)
    section: "5.2"
    clause: 5.2(9)
    paraphrase: "For additional roles the economic operator defines itself (not fixed by regulation), the economic operator chooses which authentication mechanism applies."
    applicability: software
    areas:
      - 5
    assessment:
      date: 2026-10-09
      commit: 272eab96e2d191ba9c48edcc3ab4a0822a12b7e4
      validator: agent:conformance-review
      status: Partial
      evidence:
        - type: code
          ref: apps/main/src/identity/auth/auth.provider.ts
          note: password sessions and API keys
        - type: code
          ref: apps/main/src/identity/auth/infrastructure/oauth-provider/oauth-provider-plugins.ts
          note: optional OAuth provider for a Trusted Client
        - type: doc
          ref: docs/guides/production-setup.md
          note: section OAuth Provider
      notes: "Credited: an instance offers password sessions, API keys and, when enabled, OAuth login of a Trusted Client. Missing: an economic operator cannot define roles of its own, so it cannot choose a mechanism per role or per organisation; the choice is the instance operator's, for the whole instance."
      gapIssue: 1023
  - id: EN18239-5.2(10)
    section: "5.2"
    clause: 5.2(10)
    paraphrase: "Access rights are expressed at the level of individual data elements; controlled vocabularies such as the EU Vocabularies of the Publications Office may supply the terms."
    applicability: software
    areas:
      - 5
      - 8
    assessment:
      date: 2026-10-09
      commit: 272eab96e2d191ba9c48edcc3ab4a0822a12b7e4
      validator: agent:conformance-review
      status: Met
      evidence:
        - type: code
          ref: apps/main/src/aas/domain/security/access-permission-rule.ts
          note: access permission rule per subject
        - type: code
          ref: apps/main/src/aas/domain/security/permission-per-object.ts
          note: object = idShortPath of a submodel or of one element inside it
        - type: code
          ref: packages/dto/src/aas/enums/permission-enum.ts
          note: Create, Read, Edit, Delete
        - type: test
          ref: apps/main/src/aas/domain/security/security.spec.ts
          note: create security schema and check permissions
        - type: test
          ref: apps/main/src/aas/domain/submodel-base/submodel.spec.ts
          note: values readable by the specified subject
      notes: "Access rights are AAS access permission rules: per subject, a set of Create, Read, Edit and Delete permissions on a submodel or on one element path inside it, editable in the permissions form. The terms are the AAS permission vocabulary; the optional controlled vocabulary the clause suggests is not used. Not operational: every submodel receives element-level default rules. Which roles the rules can name is EN18239-5.2(7) and 5.2(23)."
  - id: EN18239-5.2(11)
    section: "5.2"
    clause: 5.2(11)
    paraphrase: "Access to DPP services is limited so that attacks and unauthorised mass scraping of data are prevented."
    applicability: software
    areas:
      - 5
      - 10
    assessment:
      date: 2026-10-09
      commit: 272eab96e2d191ba9c48edcc3ab4a0822a12b7e4
      validator: agent:conformance-review
      status: Partial
      evidence:
        - type: code
          ref: apps/main/src/identity/auth/auth.provider.ts
          note: API-key calls limited to 100 a minute
        - type: code
          ref: apps/main/src/identity/users/presentation/users.controller.ts
          note: e-mail change throttled to three an hour
        - type: code
          ref: apps/main/src/common/throttler/user-or-ip.throttler-guard.ts
          note: throttler keyed on user or socket address
        - type: test
          ref: apps/main/src/identity/users/presentation/users.controller.spec.ts
          note: 429 on the fourth e-mail change
      notes: "Credited: API-key calls are limited to 100 a minute, e-mail changes to three an hour per user or address, and the authentication library limits sign-in and sign-up in production. Missing: every public read (permalink, public AAS routes, GS1 resolver, attachment download, page-view counter) and every session-authenticated route is unthrottled, so mass scraping of public passports is unhindered; the limits are hard-coded and, with no proxy trust setting, behind a reverse proxy all visitors would share one address. A Check can follow once the shape of the limit is decided."
      gapIssue: 1026
  - id: EN18239-5.2(12)
    section: "5.2"
    clause: 5.2(12)
    paraphrase: "Against counterfeit passports: where the issuer of a DPP has to be authenticated, the issuing economic operator is identified securely."
    applicability: software
    areas:
      - 3
      - 10
    assessment:
      date: 2026-10-09
      commit: 272eab96e2d191ba9c48edcc3ab4a0822a12b7e4
      validator: agent:conformance-review
      status: Gap
      evidence:
        - type: code
          ref: apps/main/src/permalink/application/services/permalink.application.service.ts
          note: freezing on publish fixes the URL, not the content
      notes: "Nothing authenticates the issuer of a passport: no signature, seal or certificate binds a passport to its economic operator, and the organisation behind it is known only by its self-chosen name (no verified operator identifier, EN18239-5.2(1)). Signatures and seals are the integrity cluster #824 (EN 18246, ticket #763)."
      gapIssue: 824
  - id: EN18239-5.2(13)
    section: "5.2"
    clause: 5.2(13)
    paraphrase: "Where a DPP management service needs authentication (issuing, amending, reading controlled data), authentication follows the relevant legal act; Annex A collects the best practice."
    applicability: software
    areas:
      - 5
    assessment:
      date: 2026-10-09
      commit: 272eab96e2d191ba9c48edcc3ab4a0822a12b7e4
      validator: agent:conformance-review
      status: Partial
      evidence:
        - type: code
          ref: apps/main/src/identity/auth/auth.provider.ts
          note: e-mail and password, verification mail on sign-up, API keys
        - type: code
          ref: apps/main/src/identity/auth/infrastructure/guards/auth.guard.ts
      notes: "No legal act fixes the authentication of DPP management yet (the implementing acts on credentials under ESPR Art. 11 fourth subparagraph are not adopted); re-validate when one is. Against the Annex A best practice: credited are password, API-key and OAuth authentication with a verification mail on sign-up and mandatory API-key expiry; missing are multifactor authentication, identity proofing of the person or the organisation, and verification enforced before access."
      gapIssue: 1023
  - id: EN18239-5.2(14)
    section: "5.2"
    clause: 5.2(14)
    paraphrase: "Optional: measures may be put in place that detect, counter or mitigate anomalies threatening service availability."
    applicability: mixed
    areas:
      - 10
    assessment:
      date: 2026-10-09
      commit: 272eab96e2d191ba9c48edcc3ab4a0822a12b7e4
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/common/middleware/logger.middleware.ts
          note: status, duration and correlation id per request; JSON format available
        - type: code
          ref: apps/main/src/status/presentation/status.controller.ts
          note: liveness only, returns the version
      notes: "Optional measure, assessed as enablement. Credited: every request is logged with status, duration and correlation id for an external monitor, and a status endpoint answers liveness. Missing: no anomaly detection, alerting or automatic countermeasure in the software, the status endpoint checks neither database nor storage, and no guide tells an operator how to monitor an instance."
      gapIssue: 1026
  - id: EN18239-5.2(15)
    section: "5.2"
    clause: 5.2(15)
    paraphrase: "Optional: the economic operator may introduce access rate limiting when there is a reasonable, identified risk or a legal requirement, provided legally required information stays available."
    applicability: mixed
    areas:
      - 5
      - 10
    assessment:
      date: 2026-10-09
      commit: 272eab96e2d191ba9c48edcc3ab4a0822a12b7e4
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/identity/users/users.module.ts
          note: throttler limits hard-coded
        - type: code
          ref: apps/main/src/identity/auth/auth.provider.ts
          note: API-key limit hard-coded
      notes: "Optional for the economic operator, assessed as enablement. Credited: the two existing limits show the mechanism. Missing: neither an economic operator nor the instance operator can set or tune a rate limit (no setting, no environment variable), so a limit can neither be introduced for an identified risk nor be kept off the legally required information."
      gapIssue: 1026
  - id: EN18239-5.2(16)
    section: "5.2"
    clause: 5.2(16)
    paraphrase: "Every access to, and every change of, roles, rights or controlled DPP data is logged and auditable; the log is protected against tampering, forgery and deletion and proves its integrity over time."
    applicability: software
    areas:
      - 6
      - 10
    assessment:
      date: 2026-10-09
      commit: 272eab96e2d191ba9c48edcc3ab4a0822a12b7e4
      validator: agent:conformance-review
      status: Partial
      evidence:
        - type: code
          ref: apps/main/src/activity-history/domain/activities/activity-types.ts
          note: content, status, editing-mode and access-rule changes
        - type: code
          ref: apps/main/src/activity-history/infrastructure/activity.repository.ts
          note: records deleted with a deleted draft
        - type: code
          ref: apps/main/src/common/middleware/logger.middleware.ts
          note: "request log: method, URL, status, IP, user agent"
        - type: test
          ref: apps/main/src/activity-history/infrastructure/activity.repository.spec.ts
        - type: test
          ref: apps/main/src/aas/presentation/environment.service.spec.ts
          note: activities of access-rule changes
      notes: "Credited: changes of passport and template content, status, editing mode and element access rules are recorded with user and time and can be listed and downloaded. Missing: reads of controlled data are not logged with the user; membership and role changes, API-key creation and revocation and passport creation are not logged; the records carry no hash chain or signature, can be altered in the database and are deleted together with a deleted draft."
      gapIssue: 1024
