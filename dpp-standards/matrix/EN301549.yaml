# Conformance Matrix: EN301549 (ETSI EN 301 549 V3.2.1 (2021-03), clause 9 Web). Rules: dpp-standards/README.md.
# Criteria extracted on 2026-10-11 (ticket #761) from the free ETSI text V3.2.1, the edition EN 18216:2026 cites (dated reference EN 301 549:2021); assessments are added in place, one per Criterion.
# Normative reference of EN 18216, cited once (EN18216-5-para3), for the accessibility of DPP content wherever people read it. Extract scope, decided by the map owner on 2026-10-11 in #761: clause 9 (web content), because open-dpp shows DPP content to people only as web pages; each clause 9.1.1.1 to 9.4.1.3 requires a web page to satisfy one WCAG 2.1 Level A or AA success criterion, and 9.6 adds the five WCAG conformance requirements.
# Not extracted: clauses 1 to 3 (scope, references, definitions), 4 (functional performance statements: user needs that clauses 5 to 13 meet, no own pass criterion), 5 to 8 and 10 to 13 (generic and closed functionality, two-way voice, video, hardware, non-web documents, non-web software, documentation and support services, relay and emergency services: outside the reach of EN 18216, which cites the standard for the rendering of DPP content only; documents an operator attaches to a passport, clause 10, are the operator's content), 9.0 (informative overview), the void clauses 9.1.4.6 to 9.1.4.9 and 9.2.1.3 (placeholders for WCAG Level AAA numbers), 9.5 (informative list of Level AAA criteria) and the annexes (A: relationship with Directive (EU) 2016/2102, B: mapping to functional performance, C: test procedures that restate each clause, D to F informative).
# Pages assessed: the passport presentation view a GS1 Digital Link or permalink resolves to (anonymous and signed-in visitors, with its language switcher, media and the optional AI chat). The editor and the organisation back office render DPP content to the operator's own members while authoring it; they are not the representation of DPP content to the passport's users and are not assessed here.
