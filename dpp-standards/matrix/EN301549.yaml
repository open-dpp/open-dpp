  - id: EN301549-9.1.3.1
    section: "9.1.3"
    clause: "9.1.3.1"
    paraphrase: "A web page rendering DPP content satisfies WCAG 2.1 success criterion 1.3.1 Info and relationships: Structure and relationships conveyed visually (headings, lists, tables, labels, groups) are also available programmatically or in text."
    applicability: software
    areas:
      - 11
    assessment:
      date: 2026-10-11
      commit: ea05ef20dbe4eaab478330f40ec32ff52081d83a
      validator: agent:conformance-review
      status: Partial
      operational: false
      evidence:
        - type: code
          ref: apps/client/src/components/presentation/SubmodelElementValue.vue
          note: values in dd; booleans as a disabled checkbox; lists through Table.vue
        - type: code
          ref: apps/client/src/components/presentation/Table.vue
          note: lists as tables with column headers
        - type: code
          ref: apps/client/src/components/presentation/Passport.vue
          note: h2 for the passport, h3 per submodel
        - type: manual
          ref: "Against an Instance built from ea05ef20 (port 3001), on a published audit passport of the conformance organisation (permalink eb36457f, built through the API before the Check subject got its content) with a content submodel (text, number, boolean, date and link properties, multilingual text, a PNG image, a PDF, a collection, a list, a range): structure exposed: headings, term and definition pairs, table headers, a tree; axe definition-list and dlitem: dd elements inside table cells without a dl; the boolean checkbox has no programmatic label; the multilingual description rendered nothing (term without value) and the range (bounds 0 and 100) was shown as Value is missing."
          date: 2026-10-11
      notes: "Credited: headings, description lists of term and value, data tables with column headers and an ARIA tree convey the structure. Missing: table cells wrap their values in dd elements outside any dl, the boolean checkbox is not tied to its term, a multilingual-text value is not rendered at all (the MultiLanguageProperty rendering is #838), and a range is reported missing although its bounds are set."
      gapIssue: 1035
