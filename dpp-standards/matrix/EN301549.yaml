criteria:
  - id: EN301549-9.1.1.1
    section: "9.1.1"
    clause: "9.1.1.1"
    paraphrase: "A web page rendering DPP content satisfies WCAG 2.1 success criterion 1.1.1 Non-text content: Every non-text item shown (images, icons, controls, media) has a text alternative serving the same purpose; purely decorative items are hidden from assistive technology."
    applicability: software
    areas:
      - 11
    assessment:
      date: 2026-10-11
      commit: ea05ef20dbe4eaab478330f40ec32ff52081d83a
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/client/src/components/media/MediaPreview.vue
          note: alt is the media title, which upload sets to the file name
        - type: code
          ref: apps/main/src/media/infrastructure/media.service.ts
          note: title and description of an upload are both set to the original file name; no route edits them
        - type: code
          ref: apps/client/src/components/media/ProductImageGalleria.vue
          note: carousel images have the fixed alt Image
        - type: code
          ref: apps/client/src/components/media/BrandingLogo.vue
          note: logo alt brand-image
        - type: manual
          ref: "Against an Instance built from ea05ef20 (port 3001), on a published audit passport of the conformance organisation (permalink eb36457f, built through the API before the Check subject got its content) with a content submodel (text, number, boolean, date and link properties, multilingual text, a PNG image, a PDF, a collection, a list, a range): the product image's alt text was its file name, the logo's brand-image; the image and PDF download links (icon only) had no accessible name, the tree's expand button none, and the boolean value's checkbox no label (axe link-name, button-name, label)."
          date: 2026-10-11
      notes: "Missing: an operator cannot give an image a text alternative (no alt field; the File element's description is not used), so images expose a file name or a fixed word; icon-only controls (download links, tree toggles) have no name; the boolean value is a checkbox without a label. Credited: icons of the navigation carry visible text, and every img has an alt attribute. Operational: the operator would supply the alternatives once a field exists."
      gapIssue: 1035
  - id: EN301549-9.1.2.1
    section: "9.1.2"
    clause: "9.1.2.1"
    paraphrase: "A web page rendering DPP content satisfies WCAG 2.1 success criterion 1.2.1 Audio-only and video-only (prerecorded): Prerecorded audio-only content has a text transcript and prerecorded video-only content has a transcript or an audio track, unless it is itself a labelled alternative for text."
    applicability: software
    areas:
      - 11
    assessment:
      date: 2026-10-11
      commit: ea05ef20dbe4eaab478330f40ec32ff52081d83a
      validator: agent:conformance-review
      status: Met
      operational: false
      evidence:
        - type: code
          ref: apps/main/src/media/presentation/media.controller.ts
          note: uploads accept only JPEG, PNG, HEIC, WebP and PDF (FileTypeValidator)
        - type: code
          ref: apps/client/src/components/media/MediaFieldView.vue
          note: renders an image or a file icon with a download link; no audio or video player
        - type: manual
          ref: "Against an Instance built from ea05ef20 (port 3001), on a published audit passport of the conformance organisation (permalink eb36457f, built through the API before the Check subject got its content) with a content submodel (text, number, boolean, date and link properties, multilingual text, a PNG image, a PDF, a collection, a list, a range): uploading an MP4 and an MP3 file was refused with 400 (file type not accepted); no presentation component renders audio or video."
          date: 2026-10-11
      notes: "No audio or video can reach a passport: uploads take images and PDFs only and the view has no media player, and an anyURI value is rendered as a link to another page. Per EN 301 549 clause 9.0, a page without such content satisfies the criterion."
