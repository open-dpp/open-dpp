# Conformance Matrix: CPR (32024R3110). Rules: dpp-standards/README.md.
# Criteria extracted from research/criteria-sector-laws.md and verified against the Cellar text on 2026-09-07 (ticket #830); assessments are added in place, one per Criterion.
# Clauses outside Chapter X that the paraphrases cite (Art. 14, 15, 16, 18(2)(g), 22(3), 22(5), 22(6), 22(9), 59-61) are not extracted; the ENs carry presumption of conformity under ESPR only, so operationalisedBy stays empty until a CPR act names standards.
# Every operative duty of the chapter waits on the Art. 75(1) delegated act (CPR-Art80(1)); the CPR prevails over ESPR in a conflict (Art. 12(2)).
standard: CPR
edition: 32024R3110
extractedFrom: dpp-standards/research/criteria-sector-laws.md
extractedAt: 2026-09-07
sections:
  - id: Art22
    title: Article 22 – Obligations of manufacturers
  - id: Art75
    title: Article 75 – Construction digital product passport system
  - id: Art76
    title: Article 76 – Digital product passport
  - id: Art77
    title: Article 77 – General requirements for the digital product passport
  - id: Art78
    title: Article 78 – Technical design and operation of the digital product passport
  - id: Art79
    title: Article 79 – Unique identifiers and digital product passport registry
  - id: Art80
    title: Article 80 – Mandatory use and technical adaptation
criteria:
  - id: CPR-Art22(7)
    section: Art22
    clause: Art. 22(7)
    paraphrase: "Obligation trigger: within 18 months of the entry into force of the Art. 75(1) delegated act, the manufacturer makes a DPP per Art. 76 available through the construction DPP system of Art. 75, connected to the data carrier displayed with the CE marking (Art. 18(2)(g)). Counterpart of the first limb of ESPR-Art9(1), with the actor fixed as the manufacturer and a date tied to the delegated act."
    applicability: mixed
    areas:
      - 1
      - 4
      - 6
    assessment:
      date: 2026-09-07
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/digital-product-document/domain/digital-product-document-status.ts
          note: Draft -> Published -> Archived -> Restore
        - type: code
          ref: apps/main/src/permalink/application/services/permalink.application.service.ts
          note: public URL resolution and freeze on publish
        - type: code
          ref: apps/main/src/unique-product-identifier/presentation/gs1-resolver.controller.ts
          note: a scanned carrier redirects to the public view
        - type: test
          ref: apps/e2e/tests/passport-identity/publish-freeze.spec.ts
          note: publishing freezes the permalink and opens it to anonymous visitors
      notes: "Software part: a passport the manufacturer can publish and that is reachable through a data carrier. Credited: a passport is created, published and then served anonymously at its permalink; the QR code (apps/client/src/components/permalinks/PermalinkQrCode.vue) encodes the permalink or the GS1 Digital Link and the resolver answers a scan with a redirect to the public view. Missing: nothing connects to the construction DPP system of Art. 75, which does not exist yet (re-validate once the Art. 75(1) act is adopted), and the operator documentation says nothing about permalinks, QR codes or anonymous access, so the manufacturer has no guide to the software part (#828). Displaying the carrier with the CE marking is the manufacturer's act (CPR-Art77(1)(b))."
      gapIssue: 828
  - id: CPR-Art75(1)
    section: Art75
    clause: Art. 75(1)
    paraphrase: "The Commission adopts a delegated act (Art. 89 procedure) that sets up the construction DPP system under the conditions of Chapter X. Counterpart of ESPR-Art9(2), but one system-wide act rather than product-group acts; every operative duty of the chapter waits on it."
    applicability: commission
    assessment:
      date: 2026-09-07
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Not applicable
      operational: false
      evidence: []
      notes: "Commission duty, assessed Not applicable by rule: the Commission adopts the delegated act that sets up the construction DPP system, and it has not been adopted (watch entry of CPR in sources.yaml). Every operative duty of the chapter waits on it. The software rows of this run record what open-dpp offers today; the rows that act may change are the identifier and carrier rows (CPR-Art76(2)(a)(v), 77(1)(c), 79(1)), the registry row (79(2)), the access-level rows (75(2)(c), 76(2)(f), 77(1)(g)), storage (78(c)) and the back-up system (75(2)(f), 78(e))."
  - id: CPR-Art75(2)(a)
    section: Art75
    clause: Art. 75(2)(a)
    paraphrase: "The system is compatible with, interoperable with and based upon the ESPR DPP, without compromising interoperability with Building Information Modelling (BIM) and taking construction specifics into account. Restates ESPR-Art11(a) with two deltas: the CPR system builds on the ESPR DPP itself, and BIM interoperability is added."
    applicability: mixed
    areas:
      - 1
      - 2
      - 8
    assessment:
      date: 2026-09-07
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Partial
      operational: false
      evidence:
        - type: code
          ref: apps/main/src/aas/domain/environment.ts
          note: a passport is an AAS environment (IEC 63278-1)
        - type: code
          ref: apps/main/src/aas/domain/common/has-semantics.ts
          note: semanticId on every element
        - type: code
          ref: apps/main/src/aas/infrastructure/serialization/aas-serialization.service.ts
          note: JSON export in the open-dpp:json envelope
      notes: "Software part: a construction passport built on and interoperable with the ESPR DPP, and interoperable with BIM. Credited: the passport is an AAS environment with a semanticId on every element, the technical basis the JTC 24 standards give the ESPR DPP (EN 18223). Missing: the export is a proprietary open-dpp:json envelope that fails AAS metamodel verification (Check export.aas-environment-verifies, folded on CPR-Art77(1)(d); #823), and nothing addresses BIM: no IFC or other BIM export, no link between a passport and a BIM object, no property-set mapping. What BIM interoperability requires is for the Art. 75(1) act to fix; re-validate then."
      gapIssue: 823
  - id: CPR-Art75(2)(b)
    section: Art75
    clause: Art. 75(2)(b)
    paraphrase: "The system has the functionalities needed to implement and manage the DPPs of Art. 76 (create, hold, update and serve them)."
    applicability: mixed
    areas:
      - 1
      - 6
    assessment:
      date: 2026-09-07
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/passports/presentation/passport.controller.ts
          note: POST /passports from a template or an environment, PUT status, AAS update routes
        - type: code
          ref: apps/main/src/passports/application/services/passport.service.ts
          note: createPassportFromTemplate, status changes, draft-only delete
        - type: code
          ref: apps/main/src/aas/presentation/environment.service.ts
          note: holds and updates the passport's AAS environment
        - type: code
          ref: apps/main/src/permalink/presentation/permalink.controller.ts
          note: serves the passport publicly at /p/:id
        - type: test
          ref: apps/main/src/passports/presentation/passport.controller.spec.ts
          note: create, update, status and delete routes
        - type: test
          ref: apps/main/src/passports/application/services/passport.service.spec.ts
          note: creation from a template, publish freezes permalinks
        - type: doc
          ref: docs/guides/digital-product-document/lifecycle.md
          note: the three lifecycle stages and what each allows; no page on creating, editing or serving a passport
      notes: "Software part: the functionality to implement and manage passports as Art. 76 describes them; the construction DPP system itself is the Commission's and does not exist yet. Credited: open-dpp creates a passport from a template or an environment, persists it, lets the owning organisation edit it before and after publication through AAS-style routes and the editor, and serves it publicly once published. Missing: the functionalities an Art. 76 passport requires are the ones this run finds absent on the Art. 76(2) and 77 rows, above all the construction content structure (#834, the cluster whose delivery makes a passport an Art. 76 passport), the key-part links (#835), the product-type granularity (#597), the external access levels (#821) and continuity (#825); the operator docs cover the lifecycle stages only. Downgraded from Met by the adversarial review of 2026-09-07. Re-validate when the Art. 75(1) act fixes the system's functionalities."
      gapIssue: 834
  - id: CPR-Art75(2)(c)
    section: Art75
    clause: Art. 75(2)(c)
    paraphrase: "The delegated act determines which actors (economic operators, clients, deinstallers, users and competent national authorities among them) may access which DPP information, weighing the protection of intellectual property rights and sensitive commercial information and the safety of construction works. Restates ESPR-Art9(2)(f) with a delta: the named construction actors and the IP, confidentiality and safety-of-works constraints on access."
    applicability: mixed
    areas:
      - 5
    assessment:
      date: 2026-09-07
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/aas/domain/security/access-control.ts
          note: per-submodel and per-element access rules
        - type: code
          ref: apps/main/src/aas/domain/security/subject-attributes.ts
          note: "role hierarchy: admin, owner, member, user, anonymous"
        - type: code
          ref: apps/client/src/components/aas/PermissionsForm.vue
          note: editor UI to grant or withdraw the anonymous read right per element
        - type: test
          ref: apps/main/src/aas/domain/security/security.spec.ts
          note: access rules per role and element
      notes: "Software part: give each construction actor (economic operators, clients, deinstallers, users, competent national authorities) access to the information meant for it while protecting intellectual property, sensitive commercial information and the safety of works. Credited: per-submodel and per-element visibility for the roles anonymous, organisation member, organisation owner and instance admin; a published passport is public by default and any element can be withheld from anonymous readers. Missing: none of the named construction actors can be expressed as an access class, so information cannot be shown to authorities or clients and withheld from the public (#821, same finding as ESPR-Art9(2)(f)); attachments do not follow the element policy (#836). The actual actor list is for the Art. 75(1) act."
      gapIssue: 821
  - id: CPR-Art75(2)(d)
    section: Art75
    clause: Art. 75(2)(d)
    paraphrase: "The delegated act determines which actors (manufacturers, authorised representatives, importers, distributors and DPP service providers among them) may introduce or update DPP information, including creating a new DPP where necessary, and which information they may introduce or update."
    applicability: mixed
    areas:
      - 5
    mirrors: ESPR-Art9(2)(g)
  - id: CPR-Art75(2)(e)
    section: Art75
    clause: Art. 75(2)(e)
    paraphrase: "The delegated act lays down the detailed arrangements for updating the information in the DPP of an existing product."
    applicability: mixed
    areas:
      - 1
      - 5
      - 6
    mirrors: ESPR-Art9(2)(h)
  - id: CPR-Art75(2)(f)
    section: Art75
    clause: Art. 75(2)(f)
    paraphrase: "The delegated act establishes procedures that keep DPPs available after the insolvency, liquidation or cessation of activity in the Union of the operator that created them, and where necessary after the manufacturer's own availability duty has expired, including a back-up system run by DPP service providers. Folds ESPR-Art11(e) and ESPR-Art10(4) and adds the post-expiry case."
    applicability: mixed
    areas:
      - 6
      - 2
    assessment:
      date: 2026-09-07
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Gap
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/aas/infrastructure/serialization/aas-serialization.service.ts
          note: one-passport JSON export, the only copy an operator can take
      notes: "Software part: a back-up system and a continuity path that keep passports available after the creator's insolvency, liquidation or cessation, or after its own availability duty has expired. Nothing exists: no back-up copy or back-up URL (#596), no escrow, handover or transfer of a passport to a DPP service provider or another operator (#825). The one-passport JSON export is a manual copy in a proprietary format, not a back-up system. The procedures themselves are for the Art. 75(1) act."
      gapIssue: 596
  - id: CPR-Art75(2)(g)
    section: Art75
    clause: Art. 75(2)(g)
    paraphrase: "The delegated act sets requirements for DPP service providers and, if required, a certification scheme to verify them, based as far as possible on the corresponding ESPR developments."
    applicability: commission
    mirrors: ESPR-Art11-sub3
  - id: CPR-Art75(2)(h)
    section: Art75
    clause: Art. 75(2)(h)
    paraphrase: "Where required, the delegated act lays down more detailed or alternative rules and procedures on the life cycle of identifiers, data carriers, digital credentials and the DPP registry than those ESPR sets for the same purpose. Sector-specific power to deviate from ESPR-Art12 and ESPR-Art13; no ESPR counterpart."
    applicability: commission
    assessment:
      date: 2026-09-07
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Not applicable
      operational: false
      evidence: []
      notes: "Commission duty, assessed Not applicable by rule: a power to replace the ESPR rules on identifiers, data carriers, digital credentials and the registry with sector-specific ones. Not exercised, the delegated act does not exist. Once it is, CPR-Art76(2)(a)(v), 77(1)(c), 79(1) and 79(2) are re-validated against the alternative rules with a text trigger."
  - id: CPR-Art75(2)(i)
    section: Art75
    clause: Art. 75(2)(i)
    paraphrase: "The system stays accessible for 25 years after the last product of a product type was placed on the market, and the economic operator makes the DPP available for at least 10 years, without disproportionate cost for longer periods. Restates ESPR-Art9(2)(i) with fixed periods counted from the last product of the type instead of a per-product expected lifetime."
    applicability: mixed
    areas:
      - 6
    assessment:
      date: 2026-09-07
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/passports/application/services/passport.service.ts
          note: deletePassport refuses non-draft passports
        - type: code
          ref: apps/main/src/digital-product-document/domain/digital-product-document-status.ts
          note: Draft -> Published -> Archived -> Restore
        - type: test
          ref: apps/main/src/passports/application/services/passport.service.spec.ts
          note: deletePassport rejects non-draft passports
        - type: doc
          ref: docs/guides/digital-product-document/lifecycle.md
          note: what each stage allows
      notes: "Software part: keep a passport available for 10 years (the operator) within a system that stays accessible for 25 years, both counted from the last product of the product type. Credited: published and archived passports cannot be deleted, archiving is reversible and the lifecycle is documented. Missing: no representation of an availability period or of the date the last product of a type was placed on the market, an archived passport is no longer served publicly (the permalink service requires Published), no back-up (#596) and no continuity once the operator ceases (#825). Same finding as ESPR-Art9(2)(i), with the CPR periods."
      gapIssue: 825
  - id: CPR-Art75(2)(j)
    section: Art75
    clause: Art. 75(2)(j)
    paraphrase: "The delegated act takes into account the need to keep information available for the reuse and remanufacturing of products."
    applicability: commission
    assessment:
      date: 2026-09-07
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Not applicable
      operational: false
      evidence: []
      notes: "Commission duty, assessed Not applicable by rule: a consideration the delegated act must take into account. Reuse and remanufacturing information as passport content is assessed on the content rows (CPR-Art76(2)(a)) once the act names it."
  - id: CPR-Art76(1)
    section: Art76
    clause: Art. 76(1)
    paraphrase: "The information in the DPP is accurate, complete and up to date (the second limb of ESPR Art. 9(1); the placing-on-the-market gate of that clause is the own row CPR-Art22(7))."
    applicability: mixed
    areas:
      - 1
      - 6
    mirrors: ESPR-Art9(1)
  - id: CPR-Art76(2)(a)(i)
    section: Art76
    clause: Art. 76(2)(a)(i)
    paraphrase: "The DPP includes the declaration of performance and conformity of Art. 15 (model in Annex V), the REACH safety-data-sheet and substance information of Art. 15(6), which may be included through a connection to other Union databases where available, and the documentation supplied with the declaration under Annex V. Sector-specific; nearest ESPR-AnnexIII(e), with the environmental data of the declaration, REACH information and Union-database links added."
    applicability: software
    areas:
      - 8
      - 2
      - 7
    assessment:
      date: 2026-09-07
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/templates/domain/template.ts
          note: reusable AAS template per organisation
        - type: code
          ref: apps/main/src/aas/domain/submodel-base/register-submodel-element-classes.ts
          note: the eleven supported submodel-element types
        - type: code
          ref: apps/main/src/aas/domain/submodel-base/file.ts
          note: File element for an attached document
        - type: code
          ref: apps/main/src/media/presentation/media.controller.ts
          note: attachment upload (images and PDF, 15 MB) with virus scan
        - type: code
          ref: apps/client/src/components/aas/LinkCellField.vue
          note: URL property, e.g. a link to a Union database entry
        - type: test
          ref: apps/main/src/media/infrastructure/media.service.spec.ts
          note: upload of passport attachments and download streams
      notes: "The declaration of performance and conformity (Annex V model with environmental performance per life-cycle module), the REACH safety-data-sheet or Art. 33 information of Art. 15(6), which may come through a connection to other Union databases, and the documents supplied with the declaration. Credited: the declaration and its documents can be attached as PDF File elements, its fields modelled by hand in a template, and a database entry linked by a URL property. Missing: no declaration template or submodel (declaration code and version, product-type code, declared performances per essential characteristic, environmental sustainability per module, notified body, harmonised technical specification), no structured REACH or substance information, no connection to a Union database, no document typing (#834). Same shape as ESPR-AnnexIII(e), sector content added."
      gapIssue: 834
  - id: CPR-Art76(2)(a)(ii)
    section: Art76
    clause: Art. 76(2)(a)(ii)
    paraphrase: "The DPP includes the general product information, instructions for use and safety information of Art. 22(6) (content fixed by Annex IV). Restates ESPR-AnnexIII(f) with a delta: general product information is an added, fixed document set."
