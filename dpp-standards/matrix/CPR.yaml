          note: an element can be withheld from anonymous readers
        - type: test
          ref: apps/main/src/media/infrastructure/media.service.spec.ts
          note: upload of passport attachments and download streams
      notes: "The technical documentation of Art. 22(3) (declared use, evidence of performance and conformity, procedures, assessment system, simplified procedures of Art. 59 to 61, environmental calculation), mandatory in the passport. Credited: it can be attached as File elements (PDF) and withheld from the public by an element policy, since it is meant for authorities and notified bodies rather than users. Missing: no structure for its sections, no document typing, no authority access class to disclose it to (#821), and attachments do not follow the element policy (#836); tracked in the content cluster #834. Same shape as ESPR-AnnexIII(e)."
      gapIssue: 834
