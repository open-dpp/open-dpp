      gapIssue: 834
  - id: CPR-Art76(2)(a)(v)
    section: Art76
    clause: Art. 76(2)(a)(v)
    paraphrase: "The DPP includes the unique identifiers issued under Art. 79(1), that is the product, operator and facility identifiers of ESPR Art. 12 unless the delegated act sets alternative rules. Folds ESPR-AnnexIII(b), (g) and (h)."
    applicability: software
    areas:
      - 3
    assessment:
      date: 2026-09-07
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/unique-product-identifier/domain/unique.product.identifier.ts
          note: "product identifier: open-dpp UUID or GS1 identity, several per passport"
        - type: code
          ref: apps/main/src/unique-product-identifier/presentation/gs1-identity.controller.ts
          note: GET /passports/:id/gs1-identity
        - type: test
          ref: apps/main/src/unique-product-identifier/presentation/unique-product-identifier.controller.spec.ts
          note: identifier create, list and lifecycle routes
        - type: test
          ref: apps/e2e/tests/passport-identity/upi-crud.spec.ts
          note: a new passport is seeded with an internal identifier; GS1 identifiers are added
      notes: "The identifiers of Art. 79(1) are those of ESPR Art. 12: the unique product identifier, the unique operator identifiers and the unique facility identifiers. Credited: every passport carries one or more product identifiers (an open-dpp UUID seeded at creation, GS1 identities with GTIN, batch and serial), readable through the API and shown with the passport. Missing: no operator identifier beyond the tenant organisation (no GLN, EORI or other legal-entity scheme) and no facility identifier at all (capability inventory, area 3); the registry client of #579 already asks where the operator and facility identifiers are configured. Which identifiers the CPR finally requires is for the Art. 75(1) act (CPR-Art75(2)(h))."
      gapIssue: 579
