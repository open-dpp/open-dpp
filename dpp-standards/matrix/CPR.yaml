      gapIssue: 834
  - id: CPR-Art76(2)(a)(iii)
    section: Art76
    clause: Art. 76(2)(a)(iii)
    paraphrase: "The DPP includes the technical documentation of Art. 22(3), with the specific sections required for the simplified procedures of Art. 59 to 61. Restates ESPR-AnnexIII(e) with a delta: mandatory in the law, not left to a delegated act."
    applicability: software
    areas:
