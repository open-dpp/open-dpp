# Conformance Matrix: IDTA01001 (Specification of the Asset Administration Shell, Part 1: Metamodel, IDTA-01001-3-2 V3.2). Rules: dpp-standards/README.md.
# Criteria extracted on 2026-10-12 (ticket #1044) from the AsciiDoc sources of release tag v3.2.0 of admin-shell-io/aas-specs-metamodel (commit ecd19127, July 2026, CC-BY-4.0) and the JSON schema of that tag; assessments are added in place, one per Criterion. Public text: the paraphrases are ours, short quotes are allowed.
# Declared standard (map decision of 2026-10-12, #1021): no law and no JTC 24 EN cites the AAS; open-dpp declares it as its data model, so the lens is "implements as declared". Lowest severity; these Criteria never cap a law or EN row.
# What open-dpp declares: its documentation names the Asset Administration Shell (IEC 63278) as its data model but no edition (first finding of #1044). This file grades V3.2, the edition current on the run date (map rule for undated references); V3.2 adds AssetKind Batch, createdAt and updatedAt, Constraints AASd-137 and AASd-138, the container depth of 32 and the informative DPP annex to V3.1.2.
# IEC 63278-1:2023 and this text: IEC 63278-1 (Edition 1.0, 2023-12) specifies the structure of the AAS and its terms; V3.2 takes its definitions from it where available and renamed "submodel" to "Submodel" to match it. IEC 63278-1 holds no metamodel: the metamodel is to become IEC 63278-2, which V3.2 cites without date and which is still in development. IEC 63278-1 is therefore not read for this file; the watch follows IDTA releases (V3.2.x patch releases are binding bugfixes) and the publication of IEC 63278-2.
# Criterion granularity: one Criterion per class clause of the metamodel with its attribute table and the enumerations defined in that clause (id = the class name, IDTA01001-Property); one per Constraint AASd-xxx, wherever the text states it (id = the constraint id); one per further paragraph that states a requirement of its own (the AdministrativeInformation rules on dates and on Submodels sharing a semanticId, the container depth of 32); one per data type group and one per Mappings clause. EventElement is folded into BasicEventElement, OperationVariable into Operation, the logical key enumerations into Key, the deprecated category table into Referable.
# Normative and informative: by its own Structure clause only the clauses marked "(normative)" bind: the metamodel specification, Data Specification Templates and Mappings. Not extracted, no requirement of their own: Terms, Preamble, Introduction, the metamodel overview (an AAS represents exactly one asset, folded into AssetAdministrationShell), Summary and Outlook, Change Notes, Bibliography and all Annexes (Concepts, General Topics with the identifier recommendations and matching strategies, Value-Only example, BNF, UML templates and legend, semantic ids of the metamodel, handling and overview of constraints, usage hints, metamodel with inheritance).
# The Digital Product Passport annex (new in V3.2, informative) maps EN 18223's DPP header and data elements onto the AAS: digitalProductPassportId to AssetAdministrationShell/id, uniqueProductIdentifier to AssetInformation/globalAssetId, granularity to AssetInformation/assetKind (Item = Instance, Model = Type, Batch = Batch), lastUpdate to AdministrativeInformation/updatedAt. It recommends the Submodel template IDTA-02099 for the DPP metadata and equates EN 18223's compressed JSON with the AAS Value-Only format and its expanded JSON with Normal. Not extracted (informative; IDTA Submodel templates are out of the map's scope). Its recommendations are recorded as a finding of the run and handed to the EN 18223 representation cluster #1057.
# References: XML Schema 1.0 Part 2 (the value types, registered as XSD2), RDF 1.1 and BCP 47 (langString and its language tags), RFC 2046 (content types) and RFC 2396 (PathType) are read through on the rows that cite them. IEC 62832 (versions), ISO 15836-1 (Dublin Core), Attribute Based Access Control and the Part 3 data specification templates (IDTA-01003-a and -b) are named in explanations only and not read. Aligned specifications: Part 2 (IDTA01002, #1045) grades the API and the content modifiers that use the Mappings formats; Part 5 (AASX) is not declared by open-dpp.

