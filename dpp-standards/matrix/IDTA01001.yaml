  - id: IDTA01001-AssetAdministrationShell
    section: core
    clause: Asset Administration Shell Attributes, class AssetAdministrationShell
    paraphrase: "An AAS represents exactly one asset. It is identifiable and has data specifications; it carries assetInformation (mandatory), an optional derivedFrom model reference to the AAS it was derived from, and model references to its Submodels (0..*)."
    applicability: software
    areas:
      - 1
    assessment:
      date: 2026-10-12
      commit: dad482466f7c8b760d173b41f2cefab283e9200f
      validator: agent:conformance-review
      status: Partial
      operational: false
      evidence:
        - type: code
          ref: packages/dto/src/aas/asset-administration-shell-json-schema.ts
          note: "derivedFrom: ResourceJsonSchema; extra security attribute"
        - type: code
          ref: apps/main/src/aas/domain/asset-adminstration-shell.ts
      notes: "Credited: a passport holds one shell per environment, with assetInformation, model references to its Submodels (key Submodel, value the Submodel id) and data specifications. Missing: derivedFrom is typed as a Resource instead of a model reference, so it is dropped on creation and update and refused on import (bug #1059); the shell carries a security attribute the metamodel does not have, inside the AAS JSON open-dpp emits."
      gapIssue: 1064
  - id: IDTA01001-AssetInformation
    section: core
    clause: Asset Information Attributes, class AssetInformation and enumeration AssetKind
    paraphrase: "AssetInformation names the assetKind (Type, Instance, Batch, Role or NotApplicable, mandatory), an optional globalAssetId (required once the AAS is exchanged with partners), specific asset ids (0..*), an optional assetType (the asset id of the type asset) and an optional defaultThumbnail (one Resource)."
    applicability: software
    areas:
      - 1
      - 3
    assessment:
      date: 2026-10-12
      commit: dad482466f7c8b760d173b41f2cefab283e9200f
      validator: agent:conformance-review
      status: Partial
      operational: false
      evidence:
        - type: code
          ref: packages/dto/src/aas/enums/asset-kind-enum.ts
          note: Type and Instance only
        - type: code
          ref: packages/dto/src/aas/asset-information-json-schema.ts
          note: "defaultThumbnails: array; the modification schema picks defaultThumbnails only"
        - type: code
          ref: apps/main/src/aas/domain/asset-adminstration-shell.ts
          note: assetKind Instance, globalAssetId = shell id by default
      notes: "Credited: assetKind, globalAssetId, specific asset ids and assetType are held, and every shell open-dpp creates gets assetKind Instance and a globalAssetId. Missing: the AssetKind literals Batch (new in V3.2 for DPPs), Role and NotApplicable; defaultThumbnail is a list (defaultThumbnails) where the metamodel allows one Resource; the API can change only the thumbnails, so globalAssetId, specific asset ids and assetType are settable by import alone. The informative DPP annex maps EN 18223's granularity onto assetKind (Model to Type, Batch to Batch, Item to Instance), which the two literals cannot carry."
      gapIssue: 1064
