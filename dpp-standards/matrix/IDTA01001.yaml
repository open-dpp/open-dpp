criteria:
  - id: IDTA01001-Designators-depth32
    section: designators
    clause: Designators, introduction; Referencing, AasContainerSubmodelElements
    paraphrase: "Recommendation: an implementation supports container elements (collections, lists, entities, annotated relationships) nested to a depth of at least 32."
    applicability: software
    areas:
      - 1
    assessment:
      date: 2026-10-12
      commit: dad482466f7c8b760d173b41f2cefab283e9200f
      validator: agent:conformance-review
      status: Met
      operational: false
      evidence:
        - type: code
          ref: packages/dto/src/aas/submodel-base/submodel-element-collection-json-schema.ts
          note: collections, lists, entities and annotated relationships parse their children recursively (lazy schemas), no depth limit
        - type: code
          ref: apps/main/src/aas/domain/submodel-base/submodel-element-collection.ts
        - type: manual
          ref: "Against an Instance built from dad48246 (port 3001), as a member of the conformance organisation: 32 collections nested in one another, a Property at the bottom, posted to a draft passport answered 201, and the submodel read returned all 32 levels down to the Property (Check metamodel.container-depth-32)."
          date: 2026-10-12
        - type: check
          ref: metamodel.container-depth-32
          result: passed
          date: 2026-10-12
      notes: "Recommendation, met at the depth the text asks for: containers nest recursively in the DTO schemas, the domain classes and the stored document, and 32 levels of collections round-trip through the API. The Check nests collections only; lists, entities and annotated relationships use the same recursive schemas."
  - id: IDTA01001-AdministrativeInformation
    section: common
    clause: Administrative Information Attributes, class AdministrativeInformation
    paraphrase: "Every identifiable may carry administrative information: version and revision (numeric strings of up to four digits), the creator (a subject reference), createdAt and updatedAt (UTC date-times) and the templateId of the Submodel template that guided its creation, all optional; it may itself use data specifications."
    applicability: software
    areas:
      - 1
      - 6
    assessment:
      date: 2026-10-12
      commit: dad482466f7c8b760d173b41f2cefab283e9200f
      validator: agent:conformance-review
      status: Partial
      operational: false
      evidence:
        - type: code
          ref: packages/dto/src/aas/administrative-information-json-schema.ts
          note: version and revision only, both mandatory strings
        - type: code
          ref: apps/main/src/aas/domain/common/administrative-information.ts
          note: increaseVersion on every tracked change; no other attribute
        - type: test
          ref: apps/main/src/aas/domain/common/administrative-information.spec.ts
      notes: "Credited: Submodels and shells carry version and revision; open-dpp creates them as 1 and 0 and raises the version on every tracked change (a probe submodel read back version 2). Missing: creator, createdAt, updatedAt and templateId (createdAt and updatedAt are new in V3.2), and data specifications on the administrative information; version and revision are mandatory where the metamodel makes both optional, so an AdministrativeInformation with only a templateId is refused; their VersionType pattern is unchecked (open-dpp's own repository test stores version 1.0.0, see IDTA01001-StringTypes)."
      gapIssue: 1064
  - id: IDTA01001-AdministrativeInformation-dates
    section: common
    clause: Administrative Information Attributes, paragraphs on versions and dates
    paraphrase: "Version and revision order releases numerically (a higher number is a later release). createdAt is fixed at the first creation of the object, updatedAt marks relevant changes and is never earlier than createdAt, and a higher version implies a later updatedAt; all four are business values, so not every change has to move them."
    applicability: software
    areas:
      - 6
    assessment:
      date: 2026-10-12
      commit: dad482466f7c8b760d173b41f2cefab283e9200f
      validator: agent:conformance-review
      status: Gap
      operational: false
      evidence:
        - type: code
          ref: packages/dto/src/aas/administrative-information-json-schema.ts
          note: no createdAt or updatedAt
      notes: "Gap, not Partial: the clause's requirements are about createdAt and updatedAt (fixed creation date, updatedAt never before createdAt, a later version with a later updatedAt), and the AdministrativeInformation has neither attribute, so none of them can be held. The passport keeps its own createdAt and updatedAt outside the AAS, and that updatedAt never advances (bug #1056, the EN 18223 finding). The numeric ordering of versions holds for the versions open-dpp writes itself (1, 2, 3), not for imported ones (IDTA01001-StringTypes)."
      gapIssue: 1064
  - id: IDTA01001-AdministrativeInformation-submodels
    section: common
    clause: Administrative Information Attributes, paragraphs on Submodels sharing a semanticId or a templateId
    paraphrase: "Two Submodels of one AAS with the same semanticId differ in their version, their createdAt or updatedAt, their creator, a supplementalSemanticId or their templateId; both carry the attribute used to tell them apart, except a supplementalSemanticId, which one of the two suffices to carry. Two Submodels guided by the same Submodel template have different ids and both carry the templateId."
    applicability: software
    areas:
      - 1
      - 8
    assessment:
      date: 2026-10-12
      commit: dad482466f7c8b760d173b41f2cefab283e9200f
      validator: agent:conformance-review
      status: Gap
      operational: false
      evidence:
        - type: code
          ref: apps/main/src/aas/domain/asset-adminstration-shell.ts
          note: addSubmodel adds the reference without comparing semanticIds
        - type: code
          ref: apps/main/src/aas/domain/submodel-base/submodel.ts
          note: every Submodel starts with version 1, revision 0
      notes: "Nothing compares two Submodels of one shell that share a semanticId: both may carry the same version (every Submodel starts at 1), and createdAt, updatedAt, creator and templateId, the other distinguishing attributes, do not exist (IDTA01001-AdministrativeInformation)."
      gapIssue: 1063
  - id: IDTA01001-HasDataSpecification
    section: common
    clause: Has Data Specification Attributes, class HasDataSpecification
    paraphrase: "An element that has data specifications names, by external reference to their global ids, the data specification templates whose additional attributes it carries (0..*)."
    applicability: software
    areas:
      - 8
    assessment:
      date: 2026-10-12
      commit: dad482466f7c8b760d173b41f2cefab283e9200f
      validator: agent:conformance-review
      status: Partial
      operational: false
      evidence:
        - type: code
          ref: packages/dto/src/aas/embedded-data-specification-json-schema.ts
          note: dataSpecification reference only
        - type: code
          ref: apps/main/src/aas/domain/embedded-data-specification.ts
        - type: manual
          ref: "Against an Instance built from dad48246 (port 3001), as a member of the conformance organisation: a draft passport got a Template submodel with a semanticId, a supplemental semantic id, a TemplateQualifier, an extension with refersTo and an embedded data specification reference, holding a Property (Int, with valueId and semanticId), a Range (Int, 1 to 9), a MultiLanguageProperty (en and de, with valueId), a ReferenceElement, a list (orderRelevant false, semanticIdListElement, valueTypeListElement String) and a collection. The submodel read returned every attribute as posted, the values read keyed them by idShort; the draft was deleted afterwards."
          date: 2026-10-12
      notes: "Credited: shells, Submodels, every SubmodelElement and ConceptDescriptions hold data specification references (embeddedDataSpecifications), and a probe reference to the IEC 61360 template round-tripped. Missing: the AdministrativeInformation cannot hold one, and the data specification content is dropped (IDTA01001-EmbeddedDataSpecifications), so the reference names attributes the element cannot carry."
      gapIssue: 1064
  - id: IDTA01001-HasExtensions
    section: common
    clause: Has Extensions Attributes, classes HasExtensions and Extension
