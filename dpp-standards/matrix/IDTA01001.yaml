  - id: IDTA01001-HasSemantics
    section: common
    clause: Has Semantics Attributes, class HasSemantics
    paraphrase: "An element with semantics may name its main semantic definition (semanticId, a Reference, 0..1) and any number of supplemental semantic definitions (supplementalSemanticId, 0..*)."
    applicability: software
    areas:
      - 8
    assessment:
      date: 2026-10-12
      commit: dad482466f7c8b760d173b41f2cefab283e9200f
      validator: agent:conformance-review
      status: Met
      operational: false
      evidence:
        - type: code
          ref: packages/dto/src/aas/submodel-base/submodel-base-json-schema.ts
          note: semanticId 0..1, supplementalSemanticIds 0..* on Submodels and SubmodelElements
        - type: code
          ref: packages/dto/src/aas/common/qualifier-json-schema.ts
        - type: code
          ref: packages/dto/src/aas/specific-asset-id-json-schema.ts
        - type: manual
          ref: "Against an Instance built from dad48246 (port 3001), as a member of the conformance organisation: a draft passport got a Template submodel with a semanticId, a supplemental semantic id, a TemplateQualifier, an extension with refersTo and an embedded data specification reference, holding a Property (Int, with valueId and semanticId), a Range (Int, 1 to 9), a MultiLanguageProperty (en and de, with valueId), a ReferenceElement, a list (orderRelevant false, semanticIdListElement, valueTypeListElement String) and a collection. The submodel read returned every attribute as posted, the values read keyed them by idShort; the draft was deleted afterwards."
          date: 2026-10-12
      notes: "Submodels, SubmodelElements, qualifiers, extensions and specific asset ids hold a semanticId and supplemental semantic ids through the API; a probe Submodel's and Property's semantic ids round-tripped. The editor has no field for them (an EN 18223 finding, #1057), which does not change what the model holds. The ConceptDescription DTO also accepts a semanticId, an attribute the metamodel does not give it (IDTA01001-ConceptDescription). AASd-118 has its own row."
