  - id: IDTA01001-ValueOnly
    section: mappings
    clause: Format "Value" (Value-Only Serialization) in JSON, serialization rules
    paraphrase: "Value-Only JSON: a Submodel or collection is an object keyed by idShort, a list an array keeping every index, each data element as its value (MultiLanguageProperty as language objects, Range as min and max, File and Blob as contentType and value, references and specific asset ids in Normal form, relationships, annotations, entities and events as named objects), elements without a value and Operations and Capabilities omitted."
    applicability: software
    areas:
      - 2
    assessment:
      date: 2026-10-12
      commit: dad482466f7c8b760d173b41f2cefab283e9200f
      validator: agent:conformance-review
      status: Partial
      operational: false
      evidence:
        - type: code
          ref: apps/main/src/aas/domain/value-visitor.ts
          note: the $value serialization
        - type: test
          ref: apps/main/src/aas/domain/value-visitor.spec.ts
        - type: manual
          ref: "Against an Instance built from dad48246 (port 3001), as a member of the conformance organisation: a draft passport got a Template submodel with a semanticId, a supplemental semantic id, a TemplateQualifier, an extension with refersTo and an embedded data specification reference, holding a Property (Int, with valueId and semanticId), a Range (Int, 1 to 9), a MultiLanguageProperty (en and de, with valueId), a ReferenceElement, a list (orderRelevant false, semanticIdListElement, valueTypeListElement String) and a collection. The submodel read returned every attribute as posted, the values read keyed them by idShort; the draft was deleted afterwards."
          date: 2026-10-12
      notes: "Credited: the values read keys Submodels and collections by idShort, writes lists as arrays and serializes Properties, MultiLanguageProperties (language objects), Ranges, Files, Blobs and references as the text says (manual probe; the EN 18223 Check format.compressed-keys-are-element-ids also asserts that no semanticId appears, which a conforming Value-Only payload with specific asset ids would break, so it is not tagged here). Missing: annotations of annotated relationships are dropped; specific asset ids are written as name-value pairs instead of in Normal form; elements without a value appear as null instead of being omitted; a list drops items whose value is empty or unreadable, so indices shift; an Entity's empty globalAssetId appears as null."
      gapIssue: 1065
