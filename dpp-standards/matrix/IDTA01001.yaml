          date: 2026-10-12
      notes: "Credited: shells, Submodels, every SubmodelElement and ConceptDescriptions hold extensions with all attributes of the class; a probe extension with valueType, value and a refersTo model reference round-tripped. Missing: refersTo is typed as a model reference to a referable, and open-dpp accepts any reference there (an external one answered 201, Check metamodel.extension-refers-to-model-reference). Name uniqueness is AASd-077's row."
      gapIssue: 1063
