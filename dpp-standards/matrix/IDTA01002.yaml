          date: 2026-10-13
      notes: "The resolver compares each path segment with the stored idShort by strict string equality, so TradeName and tradename are different paths (Check aasapi.idshort-case-sensitive: 200 against 404)."
  - id: IDTA01002-Superpaths
    section: http
    clause: HTTP/REST API, Design Decisions (superpaths); General, Relation of Interfaces; Service Specifications and Profiles
    paraphrase: "Interfaces are combined through superpaths that the service specifications define: an AAS Repository reaches the AAS interface, the submodels and their elements of one shell below /shells/{aasIdentifier} (/asset-information, /submodel-refs, /submodels/{submodelIdentifier}/submodel-elements/…), a Submodel Repository reaches the Submodel interface below /submodels/{submodelIdentifier}; the shell's submodels attribute maps to /submodel-refs, apart from the /submodels superpath."
    applicability: software
    areas:
      - 1
    assessment:
      date: 2026-10-13
      commit: dad482466f7c8b760d173b41f2cefab283e9200f
      validator: agent:conformance-review
      status: Partial
      operational: false
      evidence:
        - type: code
          ref: apps/main/src/aas/presentation/aas.decorators.ts
          note: /shells lists; /submodels/{id}/submodel-elements/{idShortPath} descends; below /shells/{aasId} only open-dpp's PATCH
        - type: code
          ref: apps/main/src/passports/presentation/passport.controller.ts
        - type: check
          ref: aasapi.submodel-refs-superpath
          result: failed
          date: 2026-10-13
      notes: "Credited: the Submodel Repository superpath is served, the Submodel interface being reached below /submodels/{submodelIdentifier} (elements, paths and values), and both repositories share one base, the per-passport URL. Missing: the AAS Repository superpaths; below /shells/{aasIdentifier} open-dpp serves only its own PATCH, so /submodel-refs, /asset-information and the submodels of one shell are not reachable through the shell (Check aasapi.submodel-refs-superpath answers 404), and the shell's submodels attribute is returned inline rather than as /submodel-refs."
      gapIssue: 1067
  - id: IDTA01002-JSON
    section: http
    clause: Service Specifications and Profiles (SerializationFormat JSON); HTTP/REST API, Payload; Data Types for Payload, File Content
    paraphrase: "The profiles graded exchange JSON: payloads follow the JSON mapping of Part 1 (Value-Only payloads its Value-Only mapping), error and paging envelopes are JSON, and file content is arbitrary binary data sent as application/octet-stream when a content type is needed."
    applicability: software
    areas:
      - 1
      - 2
    assessment:
      date: 2026-10-13
      commit: dad482466f7c8b760d173b41f2cefab283e9200f
      validator: agent:conformance-review
      status: Partial
      operational: false
      evidence:
        - type: code
          ref: apps/main/src/aas/presentation/responses/submodel.response.ts
          note: responses are JSON built from the domain's toPlain
        - type: code
          ref: apps/main/src/pagination/paging-result.ts
          note: the paging envelope is JSON
        - type: code
          ref: packages/exception/src/exception.handler.ts
          note: the error envelopes are JSON
        - type: check
          ref: format.public-reads-are-json
          result: passed
          date: 2026-10-13
      notes: "Credited: every AAS route exchanges JSON, paging and error envelopes included (Check format.public-reads-are-json). Missing: the payloads deviate from Part 1's JSON mapping (explicit nulls and empty arrays, no modelType on shells and on submodel reads, value types without the xs: prefix: IDTA01001-JSON-rules, #823) and the Value-Only payloads from its Value-Only mapping (every value a string: IDTA01001-ValueOnly, #1065); file content is not served through the AAS routes (IDTA01002-GetFileByPath), so there is no octet-stream answer to judge."
      gapIssue: 823
  - id: IDTA01002-AASa-002
    section: http
    clause: HTTP/REST API, Mapping of Operations (GetAllSubmodelsBySemanticId), Constraint AASa-002
    paraphrase: "Constraint AASa-002: the base64url-encoded semanticId passed as query parameter is at most 3072 characters long."
    applicability: software
    areas:
      - 1
      - 8
    assessment:
      date: 2026-10-13
      commit: dad482466f7c8b760d173b41f2cefab283e9200f
      validator: agent:conformance-review
      status: Gap
      operational: false
      evidence:
        - type: code
          ref: apps/main/src/aas/presentation/aas.decorators.ts
          note: no semanticId query parameter
      notes: "The constraint bounds the base64url-encoded semanticId query parameter of GetAllSubmodelsBySemanticId; open-dpp reads no such parameter (IDTA01002-GetAllSubmodelsBySemanticId), so nothing can honour or break the 3072-character limit. Graded with the missing filter by the map's conditional-clause rule."
      gapIssue: 1067
  - id: IDTA01002-Versioning
    section: versioning
    clause: HTTP/REST API, API Versioning; Versioning
    paraphrase: "The API is versioned major.minor; versions with the same major stay compatible, so a client for an older or newer minor keeps working, and a consistent OpenAPI description is provided per major version. URL-based versioning with the prefix api/v<major>/ of Part 2 (api/v3/) is recommended; the segment before the functional path may also be a tenant or any other server choice, and a /description endpoint is recommended for each service."
    applicability: software
    areas:
      - 1
      - 13
    assessment:
      date: 2026-10-13
      commit: dad482466f7c8b760d173b41f2cefab283e9200f
      validator: agent:conformance-review
      status: Partial
      operational: false
      evidence:
        - type: code
          ref: apps/main/src/main.ts
          note: URI versioning with every version as default; /api/<path> redirects 308 to /api/v1/<path>
        - type: code
          ref: apps/main/src/open-api-docs/index.ts
          note: one OpenAPI 3.1 document, versioned with the latest API version
      notes: "Credited: the API is versioned in the URL by major (/api/v1, /api/v2), the recommended form, both majors are served side by side with the passport base between the version and the functional path, and a machine-readable OpenAPI 3.1 description is served (Check api.openapi-document-served). Missing: the versions are open-dpp's own, without a minor, and nothing states which Part 2 version (api/v3) the AAS routes follow; the OpenAPI document describes the latest major only, omits several AAS routes and advertises write methods on the public base; and there is no /description endpoint (IDTA01002-GetSelfDescription)."
      gapIssue: 1067
  - id: IDTA01002-Pagination
    section: pagination
    clause: HTTP/REST API, Pagination; Design Decisions (pagination)
    paraphrase: "GetAll operations page their results: the answer is a Result holding the items in result and a paging_metadata object whose cursor points at the next page, its absence meaning the end has been reached; a missing cursor asks for the first page, limit is the maximum page size (the server may return fewer, decides when limit is absent; 100 in the text), and the cursor is an opaque string the client never interprets."
    applicability: software
    areas:
      - 1
    assessment:
      date: 2026-10-13
      commit: dad482466f7c8b760d173b41f2cefab283e9200f
      validator: agent:conformance-review
      status: Partial
      operational: false
      evidence:
        - type: code
          ref: apps/main/src/pagination/pagination.ts
          note: "nextPages: the cursor is the id of the page's last item, also on the last page; without a limit everything is returned"
        - type: code
          ref: apps/main/src/pagination/paging-result.ts
          note: result and paging_metadata.cursor
        - type: code
          ref: apps/main/src/digital-product-document/presentation/digital-product-document-decorators.ts
          note: "limit: an optional coerced number without a minimum"
        - type: test
          ref: apps/main/src/pagination/pagination.spec.ts
        - type: check
          ref: aasapi.pagination-end-without-cursor
