criteria:
  - id: IDTA01002-Methods-POST
    section: general
    clause: General, Design Principles (POST); API Interfaces, PostSubmodelElement and PostSubmodelElementByPath
    paraphrase: "POST creates a new resource whose identifier is part of the payload (the id of an identifiable, the idShort of an element), so creating an identifiable is idempotent: there is never more than one identifiable with the same id in one system, and posting the same object twice does not create two. A post into a SubmodelElementList appends at its end."
    applicability: software
    areas:
      - 1
      - 3
    assessment:
      date: 2026-10-13
      commit: dad482466f7c8b760d173b41f2cefab283e9200f
      validator: agent:conformance-review
      status: Partial
      operational: false
      evidence:
        - type: code
          ref: apps/main/src/aas/presentation/aas.decorators.ts
          note: ApiPostSubmodel, ApiPostSubmodelElement and ApiPostSubmodelElementAtIdShortPath
        - type: code
          ref: packages/dto/src/aas/submodel-base/submodel-json-schema.ts
          note: SubmodelRequestDtoSchema keeps a posted id and defaults a UUID
        - type: code
          ref: apps/main/src/aas/domain/environment.ts
          note: addSubmodel refuses an id the passport already lists
        - type: code
          ref: apps/main/src/aas/domain/submodel-base/submodel-base.ts
          note: addSubmodelElementOrFail refuses an idShort already used below the parent
        - type: check
          ref: aasapi.post-into-list-appends
          result: passed
          date: 2026-10-13
        - type: check
          ref: aasapi.post-same-id-not-duplicated
          result: passed
          date: 2026-10-13
      notes: "Credited: the identifier travels in the payload (a Submodel's id, an element's idShort), a second post of the same id or idShort into the same passport is refused, and an element posted below a SubmodelElementList is appended at its end (Checks aasapi.post-same-id-not-duplicated, aasapi.post-into-list-appends). Missing: an identifiable's id is unique within one passport, not across the repository, so the rule that one system never holds two identifiables with the same id does not hold in full; the details sit in a related private finding until it is fixed. The refusal answers 400 where Part 2 expects 409 (IDTA01002-StatusCodes)."
      gapIssue: 1069
  - id: IDTA01002-Methods-PUT
    section: general
    clause: General, Design Principles (PUT); Change Log V3.0.4 to V3.1
    paraphrase: "PUT replaces an existing resource, or creates it when it does not exist yet, wherever a POST of that resource would have been possible; a repository answers 201 when it created the resource and 204 when it replaced one."
    applicability: software
    areas:
      - 1
    assessment:
      date: 2026-10-13
      commit: dad482466f7c8b760d173b41f2cefab283e9200f
      validator: agent:conformance-review
      status: Gap
      operational: false
      evidence:
        - type: code
          ref: apps/main/src/aas/presentation/aas.decorators.ts
          note: no PUT decorator on any AAS route
        - type: code
          ref: apps/main/src/passports/presentation/passport.controller.ts
          note: PUT only on /:id/status and /:id/editing-mode, open-dpp's own routes
        - type: check
          ref: aasapi.put-submodel-replaces
          result: failed
          date: 2026-10-13
      notes: "No AAS route accepts PUT: shells, submodels, asset information, thumbnails, elements and files are never replaced or created by PUT (Check aasapi.put-submodel-replaces answers 404); updates go through PATCH (IDTA01002-Methods-PATCH) and creation through POST, so the 201-or-204 rule of a PUT has nothing to apply to."
      gapIssue: 1067
  - id: IDTA01002-Methods-PATCH
    section: general
    clause: General, Design Principles (PATCH); Annex SerializationModifier Examples, Description
    paraphrase: "PATCH updates an existing resource; the serialization modifiers name the content replaced (content=value updates all values from the Value-Only form, values stay unchanged with content=metadata). The structure sent must match the stored one: the same element types, every element already present; elements are replaced one by one, and if one sent element does not exist nothing changes. A SubmodelElementList may be patched with fewer elements, never more."
    applicability: software
    areas:
      - 1
    assessment:
      date: 2026-10-13
      commit: dad482466f7c8b760d173b41f2cefab283e9200f
      validator: agent:conformance-review
      status: Partial
      operational: false
      evidence:
        - type: code
          ref: apps/main/src/aas/presentation/aas.decorators.ts
          note: ApiPatchSubmodel, ApiPatchSubmodelElement, ApiPatchSubmodelValue and ApiPatchSubmodelElementValue
        - type: code
          ref: packages/dto/src/aas/submodel-base/submodel-element-modification-schema.ts
          note: the Normal-form body is idShort, displayName and description
        - type: code
          ref: apps/main/src/aas/domain/value-modifier-visitor.ts
          note: the Value-Only PATCH replaces values element by element and refuses several types
        - type: test
          ref: apps/main/src/aas/domain/value-modifier-visitor.spec.ts
      notes: "Credited: PATCH updates submodels and elements in place; the Value-Only PATCH (/$value) replaces the values of the elements it names, keeps the structure, fails as a whole when one named element is unknown or mistyped (Check api.update-all-or-nothing of EN 18222) and never adds elements. Missing: the Normal-form PATCH takes idShort, displayName and description only, content=metadata is not offered (IDTA01002-Content-Metadata), Blob, Entity, Range and relationship values are refused by the $value PATCH, and every PATCH answers 200 with the updated resource where Part 2 expects 204 (IDTA01002-StatusCodes)."
      gapIssue: 1069
  - id: IDTA01002-HTTPS
    section: http
    clause: HTTP/REST API, Design Decisions (transport)
    paraphrase: "An endpoint of the HTTP/REST API always uses HTTPS (port 443) with an up-to-date level of encryption; the specification assumes HTTP/1.1."
    applicability: mixed
    areas:
      - 10
    assessment:
      date: 2026-10-13
      commit: dad482466f7c8b760d173b41f2cefab283e9200f
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/main.ts
          note: listens on plain HTTP on OPEN_DPP_PORT; TLS is left to a proxy
        - type: code
          ref: apps/main/src/open-api-docs/index.ts
          note: the documented servers are https origins
        - type: doc
          ref: docs/guides/production-setup.md
          note: names TLS termination as a production duty the example compose stack lacks; no proxy guide
      notes: "Mixed clause assessed on the software part, as EN18216-4(1) and EN18216-4(4) were: open-dpp serves plain HTTP and leaves TLS, its version floor and HTTP/2 to a reverse proxy the operator provides; the production guide says TLS termination is needed but ships and documents no proxy configuration (#1027), while the API documentation assumes https origins. The Check transport.tls-1-2-minimum skips on a plain-http Instance and judges a deployed one."
      gapIssue: 1027
  - id: IDTA01002-IdentifierEncoding
    section: http
    clause: HTTP/REST API, Design Decisions (identifier encoding); Addressing Resources, Note 1
    paraphrase: "Identifiers of identifiables (shells, submodels, concept descriptions) are passed in paths and query parameters base64url-encoded (RFC 4648) over the UTF-8 bytes of the string, without and never ending in '=' padding; lists of encoded ids are comma-separated. An identifiable is addressed by its identifier only."
    applicability: software
    areas:
      - 1
      - 3
    assessment:
      date: 2026-10-13
      commit: dad482466f7c8b760d173b41f2cefab283e9200f
      validator: agent:conformance-review
      status: Partial
      operational: false
      evidence:
        - type: code
          ref: apps/main/src/aas/presentation/aas.decorators.ts
          note: "IdBaseSchema: a UUID is taken raw, else standard base64 is decoded, else the raw string is used"
        - type: test
          ref: apps/main/src/aas/presentation/aas.decorator.spec.ts
          note: parses a UUID and a base64-encoded IRI; no base64url case
        - type: code
          ref: packages/api-client/src/dpp/aas/aasNamespace.ts
          note: the shipped client inserts identifiers into paths unencoded
        - type: check
          ref: aasapi.base64url-identifier-accepted
          result: failed
          date: 2026-10-13
      notes: "Credited: submodel and shell identifiers are taken from the path, decoded and resolved by the identifier alone; UUIDs pass raw, so open-dpp's own ids work in either encoding. Missing: the decoding is standard base64 (RFC 4648 section 4, with +, / and = padding), not base64url: an IRI whose base64url form differs from its base64 form is not found (Check aasapi.base64url-identifier-accepted), and a padded value is accepted although Part 2 forbids padding; no route takes a comma-separated list of ids; the shipped api-client sends ids unencoded."
      gapIssue: 1069
  - id: IDTA01002-IdShortPath
    section: http
    clause: HTTP/REST API, Addressing Resources; Design Decisions (idShortPath)
    paraphrase: "Every referable other than an identifiable is addressed by its idShortPath: a chain of idShorts separated by dots, with the index of a SubmodelElementList item in square brackets (sme1.sme2[0].p1), rooted at the submodel and descending through submodelElements, value, statements and annotations. Because of the brackets the path is URL-encoded in the request."
    applicability: software
    areas:
      - 1
    assessment:
      date: 2026-10-13
      commit: dad482466f7c8b760d173b41f2cefab283e9200f
      validator: agent:conformance-review
      status: Partial
      operational: false
      evidence:
        - type: code
          ref: apps/main/src/aas/domain/common/id-short-path.ts
          note: a dot-separated chain of idShorts, no index segments
        - type: code
          ref: apps/main/src/aas/presentation/aas.decorators.ts
          note: "IdShortPathParamSchema: dot-separated segments; brackets are literal characters"
        - type: test
          ref: apps/main/src/aas/domain/common/id-short-path.spec.ts
        - type: test
          ref: apps/main/src/aas/presentation/aas.decorator.spec.ts
        - type: check
          ref: aasapi.idshortpath-list-index
          result: failed
          date: 2026-10-13
      notes: "Credited: every element below a submodel is addressed by its dotted idShortPath, rooted at the submodel and descending through the value of collections and lists, and the path is one URL path segment. Missing: a SubmodelElementList item is not addressable by its index in square brackets (Check aasapi.idshortpath-list-index answers 404): list items carry an idShort open-dpp requires, and the resolver matches idShorts only. Tracked with the idShortPath index of Part 1 in #1065."
      gapIssue: 1065
  - id: IDTA01002-IdShortCaseSensitive
    section: http
    clause: HTTP/REST API, Design Decisions (idShort comparison)
    paraphrase: "The HTTP/REST API compares idShorts case-sensitively."
    applicability: software
    areas:
      - 1
    assessment:
      date: 2026-10-13
      commit: dad482466f7c8b760d173b41f2cefab283e9200f
      validator: agent:conformance-review
      status: Met
      operational: false
