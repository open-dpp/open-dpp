# Conformance Matrix: IDTA01002 (Specification of the Asset Administration Shell, Part 2: Application Programming Interfaces, IDTA-01002-3-2 V3.2.0). Rules: dpp-standards/README.md.
# Criteria extracted on 2026-10-12 (ticket #1045) from the AsciiDoc sources and the OpenAPI files of release tag v3.2.0 of admin-shell-io/aas-specs-api (commit f136ba14, July 2026, CC-BY-4.0); assessments are added in place, one per Criterion. Public text: the paraphrases are ours, short quotes are allowed.
# Declared standard (map decision of 2026-10-12, #1021): no law and no JTC 24 EN cites the AAS API; open-dpp declares the AAS as its data model and serves AAS-shaped routes, so the lens is "implements as declared". Lowest severity; these Criteria never cap a law or EN row. EN 18222 defines an API of its own; its file (EN18222) grades that API, this file grades the AAS API.
# Profiles graded (scoped file, #1045): Part 2 groups operations into service specifications and profiles. open-dpp serves one AAS environment per passport and per template: below the base URL /api/v{1,2}/passports/{passportId} (and /templates/{templateId}) it lists shells at /shells and serves submodels at /submodels/{submodelIdentifier}/submodel-elements/{idShortPath}, the root paths of the AAS Repository and of the Submodel Repository service specifications; members read and write there, and anyone reads published passports below /api/v{1,2}/p/{permalink}. Part 2 lets the path segment before the functional endpoint be a tenant or any other server choice (HTTP/REST API, API Versioning), so the passport base is read as a server base URL. The pair that fits best is therefore AssetAdministrationShellRepositoryServiceSpecification/SSP-001 together with SubmodelRepositoryServiceSpecification/SSP-001 (the Full profiles, both at one base URL); their Read profiles (SSP-002) are the subsets the public base is measured against. The AAS Service and Submodel Service specifications (one shell or one submodel per endpoint, /aas and /submodel) fit worse and hold no operation the pair lacks.
# In scope: every operation of the two Full profiles except the left-out interfaces below (the AAS Repository, AAS, Submodel Repository and Submodel interfaces and the Description interface), one Criterion per operation; and the general rules every operation follows (design principles, design decisions, addressing, versioning, pagination, serialization modifiers, status codes and the result object, security alignment and the normative operation-to-right annex). Operations the profile texts omit but their OpenAPI files carry (DeleteSubmodelElementByPath, PatchSubmodelElementValueByPath) are extracted; superpath operations the AAS Repository profile text lists but its OpenAPI file never defines (GetAllSubmodels, PostSubmodel and the filters below /shells/{aasIdentifier}/submodels) are graded once, on the Submodel Repository rows. The experimental RecentChanges operations are in both Full profiles and are extracted.
# Left out, with the reason: the registry, discovery and serialization interfaces (GenerateSerializationByIds, although both Full profiles list it), by the ticket's scope; open-dpp's export is graded as a serialization in IDTA01001 (Mappings). The AASX File Server, the Concept Description Repository, the Query profiles (AAS Repository SSP-003, Submodel Repository SSP-005, with the query language and its constraint AASa-005), the Signature profiles (SSP-004, SSP-006, the $signed JWS), the History profiles (SSP-006, SSP-007, $history and the date parameter), the Identifiable profile (SSP-005, a subset of SSP-001) and the Template profiles (Submodel Repository SSP-003 and SSP-004 with AASa-003 and AASa-004): none is part of the profiles graded. Bulk operations belong to the registry profiles. The ID Link and LinkSet interactions are exemplary sequences.
# The Digital Product Passport annex (new in V3.2) carries no normative or informative marker, is written in "shall" and is bound to no profile. It maps EN 18222's Life Cycle, registry and fine-granular API onto AAS operations (ReadDPPById onto GetAssetAdministrationShellById plus the submodels, historical versions onto the History profiles, the DppMetadata submodel IDTA-02099-1 as the DPP header) and says a DPP service built on AAS shall implement all of it. open-dpp does not claim to be such a service, EN 18222 is graded in its own file, and IDTA submodel templates are outside the map; the annex is not extracted, and its mapping is handed to the EN 18222 Life Cycle API cluster #1052.
# Normativity: Part 2 has no conformance clause of its own, only the BCP 14 keywords; the profile enumeration says a server listing a profile "implemented all features" of it, and the interface is the unit of compliance statements. Not extracted, no requirement on a server: Terms, Preamble, Introduction, the naming rules and semantic ids of operations (they bind the specification's own operation names), Interactions (exemplary), API Code Generation, Summary and Outlook, Change Log, Bibliography, the UML, class-table and API-table template annexes, the overview of constraints (non-normative), the SerializationModifier examples (their PATCH rules are folded into IDTA01002-Methods-PATCH) and the Conformance Test Corpus (informative; it names no test tool).
# Text defects found while reading (recorded, not graded): the Submodel Repository Read profile identifier is printed as SubmodelServiceSpecification/SSP-002 (the OpenAPI file has SubmodelRepositoryServiceSpecification/SSP-002); the profile enumeration lacks the 3.2 History profiles and swaps two Submodel Service labels; the default page size is 100 in the text but the OpenAPI Limit parameter has minimum 1 and no default; the result object's attribute is "message" in the text and "messages" in the OpenAPI schema; three clauses state three different rules for modifiers on PUT.
# References: IDTA-01001 V3.2 (payloads; graded in IDTA01001), IDTA-01004 V3.1 (security; named by the alignment clause, not declared by open-dpp, read through on IDTA01002-Security and IDTA01002-OperationRights only), RFC 4648 (base64url) and RFC 7231 (status codes) are read through on the rows that cite them. RFC 7515 (JWS) belongs to the left-out signature profiles.
# Grading reading (applied by the first Assess, 2026-10-13): an operation row is Met when open-dpp serves the operation at the specified path with the specified method, parameters, payload and status codes; Partial when the route is served with that method but deviates in parameters, modifiers, envelopes or status codes, or serves a subset of the specified content; Gap when no route serves the operation, even where another route has a similar effect (named in the notes). A filter variant of a listing (by idShort, semanticId, assetIds) is graded on its own effect, so a parameter the server ignores is Gap. A general rule is graded across the routes served; a rule that only constrains a feature open-dpp lacks is Gap in that feature's cluster (map rule of 2026-10-12). Operations on element types open-dpp refuses on write (Operation) are Gap in the coverage cluster #1064; the content formats are graded in IDTA01001, and the rows here that rest on them point at #1065. Evidence is the code at the assessed commit and the Checks of apps/e2e/tests/conformance/aas-api.spec.ts (class aasapi) run against an Instance built from it; aas-test-engines 1.0.3 tests API V3.0 only and stops on the missing modelType of open-dpp's shells, so no external test tool is wrapped (a deviation from the ticket's Checks line).

