criteria:
  - id: IDTA01002-Methods-POST
    section: general
    clause: General, Design Principles (POST); API Interfaces, PostSubmodelElement and PostSubmodelElementByPath
    paraphrase: "POST creates a new resource whose identifier is part of the payload (the id of an identifiable, the idShort of an element), so creating an identifiable is idempotent: there is never more than one identifiable with the same id in one system, and posting the same object twice does not create two. A post into a SubmodelElementList appends at its end."
    applicability: software
    areas:
      - 1
      - 3
  - id: IDTA01002-Methods-PUT
    section: general
    clause: General, Design Principles (PUT); Change Log V3.0.4 to V3.1
    paraphrase: "PUT replaces an existing resource, or creates it when it does not exist yet, wherever a POST of that resource would have been possible; a repository answers 201 when it created the resource and 204 when it replaced one."
    applicability: software
    areas:
      - 1
  - id: IDTA01002-Methods-PATCH
    section: general
    clause: General, Design Principles (PATCH); Annex SerializationModifier Examples, Description
    paraphrase: "PATCH updates an existing resource; the serialization modifiers name the content replaced (content=value updates all values from the Value-Only form, values stay unchanged with content=metadata). The structure sent must match the stored one: the same element types, every element already present; elements are replaced one by one, and if one sent element does not exist nothing changes. A SubmodelElementList may be patched with fewer elements, never more."
    applicability: software
    areas:
      - 1
  - id: IDTA01002-HTTPS
    section: http
    clause: HTTP/REST API, Design Decisions (transport)
    paraphrase: "An endpoint of the HTTP/REST API always uses HTTPS (port 443) with an up-to-date level of encryption; the specification assumes HTTP/1.1."
    applicability: mixed
    areas:
      - 10
  - id: IDTA01002-IdentifierEncoding
    section: http
    clause: HTTP/REST API, Design Decisions (identifier encoding); Addressing Resources, Note 1
    paraphrase: "Identifiers of identifiables (shells, submodels, concept descriptions) are passed in paths and query parameters base64url-encoded (RFC 4648) over the UTF-8 bytes of the string, without and never ending in '=' padding; lists of encoded ids are comma-separated. An identifiable is addressed by its identifier only."
    applicability: software
    areas:
      - 1
      - 3
  - id: IDTA01002-IdShortPath
    section: http
    clause: HTTP/REST API, Addressing Resources; Design Decisions (idShortPath)
    paraphrase: "Every referable other than an identifiable is addressed by its idShortPath: a chain of idShorts separated by dots, with the index of a SubmodelElementList item in square brackets (sme1.sme2[0].p1), rooted at the submodel and descending through submodelElements, value, statements and annotations. Because of the brackets the path is URL-encoded in the request."
    applicability: software
    areas:
      - 1
  - id: IDTA01002-IdShortCaseSensitive
    section: http
    clause: HTTP/REST API, Design Decisions (idShort comparison)
    paraphrase: "The HTTP/REST API compares idShorts case-sensitively."
    applicability: software
    areas:
      - 1
  - id: IDTA01002-Superpaths
    section: http
    clause: HTTP/REST API, Design Decisions (superpaths); General, Relation of Interfaces; Service Specifications and Profiles
    paraphrase: "Interfaces are combined through superpaths that the service specifications define: an AAS Repository reaches the AAS interface, the submodels and their elements of one shell below /shells/{aasIdentifier} (/asset-information, /submodel-refs, /submodels/{submodelIdentifier}/submodel-elements/…), a Submodel Repository reaches the Submodel interface below /submodels/{submodelIdentifier}; the shell's submodels attribute maps to /submodel-refs, apart from the /submodels superpath."
    applicability: software
    areas:
      - 1
  - id: IDTA01002-JSON
    section: http
    clause: Service Specifications and Profiles (SerializationFormat JSON); HTTP/REST API, Payload; Data Types for Payload, File Content
    paraphrase: "The profiles graded exchange JSON: payloads follow the JSON mapping of Part 1 (Value-Only payloads its Value-Only mapping), error and paging envelopes are JSON, and file content is arbitrary binary data sent as application/octet-stream when a content type is needed."
    applicability: software
    areas:
      - 1
      - 2
  - id: IDTA01002-AASa-002
    section: http
    clause: HTTP/REST API, Mapping of Operations (GetAllSubmodelsBySemanticId), Constraint AASa-002
    paraphrase: "Constraint AASa-002: the base64url-encoded semanticId passed as query parameter is at most 3072 characters long."
    applicability: software
    areas:
      - 1
      - 8
  - id: IDTA01002-Versioning
    section: versioning
    clause: HTTP/REST API, API Versioning; Versioning
    paraphrase: "The API is versioned major.minor; versions with the same major stay compatible, so a client for an older or newer minor keeps working, and a consistent OpenAPI description is provided per major version. URL-based versioning with the prefix api/v<major>/ of Part 2 (api/v3/) is recommended; the segment before the functional path may also be a tenant or any other server choice, and a /description endpoint is recommended for each service."
    applicability: software
    areas:
      - 1
      - 13
  - id: IDTA01002-Pagination
    section: pagination
    clause: HTTP/REST API, Pagination; Design Decisions (pagination)
    paraphrase: "GetAll operations page their results: the answer is a Result holding the items in result and a paging_metadata object whose cursor points at the next page, its absence meaning the end has been reached; a missing cursor asks for the first page, limit is the maximum page size (the server may return fewer, decides when limit is absent; 100 in the text), and the cursor is an opaque string the client never interprets."
    applicability: software
    areas:
      - 1
  - id: IDTA01002-Pagination-order
    section: pagination
    clause: HTTP/REST API, Pagination (ordering)
    paraphrase: "The server orders result sets deterministically: two items never swap places between requests, even when their attributes changed in between; created or deleted items may shift later pages, and the server need not disclose its ordering."
    applicability: software
    areas:
      - 1
  - id: IDTA01002-AASa-001
    section: pagination
    clause: HTTP/REST API, Pagination, Constraint AASa-001
    paraphrase: "Constraint AASa-001: the cursor query parameter is never empty; a client without a cursor omits the parameter."
    applicability: software
    areas:
      - 1
  - id: IDTA01002-Level
    section: modifiers
    clause: Basic Operation Parameters, Enumeration Level; HTTP/REST API, Design Decisions
    paraphrase: "The Level modifier, query parameter ?level=, sets the depth of the content: deep (the default) returns every child on every sublevel, core returns the requested element and its direct children only, so a client can walk the hierarchy step by step."
    applicability: software
    areas:
      - 1
  - id: IDTA01002-Content-Metadata
    section: modifiers
    clause: Basic Operation Parameters, Enumeration Content (Metadata); HTTP/REST API, Design Decisions
    paraphrase: "Content=Metadata, path suffix /$metadata, returns (and on PATCH accepts) only the metadata of the element and its children, without values, in the Part 1 metadata format."
    applicability: software
    areas:
      - 1
      - 2
  - id: IDTA01002-Content-Value
    section: modifiers
    clause: Basic Operation Parameters, Enumeration Content (Value); HTTP/REST API, Design Decisions and Modifier Constraints
    paraphrase: "Content=Value, path suffix /$value, returns (and on PATCH accepts) only the raw values in the Part 1 Value-Only serialization, JSON only, as an unnamed JSON object or array with no idShort-named property at the root; with level=core the direct children appear without values ({} for a collection, [] for a list)."
    applicability: software
    areas:
      - 1
      - 2
  - id: IDTA01002-Content-Reference
    section: modifiers
    clause: Basic Operation Parameters, Enumeration Content (Reference); HTTP/REST API, Design Decisions
    paraphrase: "Content=Reference, path suffix /$reference, returns only the reference to the requested referable (a shell, a submodel or an element), ignoring its children."
    applicability: software
    areas:
      - 1
      - 2
  - id: IDTA01002-Content-Path
    section: modifiers
    clause: Basic Operation Parameters, Enumeration Content (Path); HTTP/REST API, Design Decisions
    paraphrase: "Content=Path, path suffix /$path, returns the idShort of the requested submodel, collection, list, annotated relationship or entity and the idShortPaths of its children, in the Part 1 path format."
    applicability: software
    areas:
      - 1
      - 2
  - id: IDTA01002-Extent
    section: modifiers
    clause: Basic Operation Parameters, Enumeration Extent; HTTP/REST API, Design Decisions (blobs)
    paraphrase: "The Extent modifier, query parameter ?extent=, applies to Blob elements: withoutBlobValue (the default) leaves the Blob content out of the payload, withBlobValue returns it base64-encoded."
    applicability: software
    areas:
      - 1
      - 2
  - id: IDTA01002-ModifierApplicability
    section: modifiers
    clause: Basic Operation Parameters, Applicability of SerializationModifiers; HTTP/REST API, Mapping of Operations (GetSubmodelElementByPath, Note)
    paraphrase: "Which modifiers a resource accepts is fixed per type: a shell takes content Normal or Reference only; submodels, collections, lists and entities take every level, content and extent value; data elements take content Normal, Metadata, Value and Reference (Blob also both extents); Capability and Operation take Normal and Reference. A path suffix the element does not define (a Capability's /$value) is answered 400 with an error description."
    applicability: software
    areas:
      - 1
  - id: IDTA01002-ModifierConstraints
    section: modifiers
    clause: HTTP/REST API, Modifier Constraints; Basic Operation Parameters, Applicability of SerializationModifiers
    paraphrase: "Modifiers combine under rules: Content=Metadata with Extent=withBlobValue is not allowed, Content=Metadata with any Level is answered 400, Level=deep with Content=Reference is not allowed, POST takes no modifiers, and PUT takes them with the meaning they have on GET except Reference and Path (another clause allows only Extent on PUT)."
    applicability: software
    areas:
      - 1
  - id: IDTA01002-StatusCodes
    section: status
    clause: HTTP/REST API, Mapping of Status Codes; Data Types for Payload, Generic Status Codes; the OpenAPI responses of the profiles
    paraphrase: "Generic status codes map to HTTP: 200 success with payload, 201 created (with the created resource and a Location header), 202 accepted, 204 success without payload (updates and deletes), 400 malformed request, 401 missing or invalid credentials, 403 refused authorization, 404 resource not found, 405 method not allowed for that resource, 409 conflict (a resource with the same id or idShort exists), 500 internal error, 501 an operation beyond the supported profiles, 502 bad gateway."
    applicability: software
    areas:
      - 1
  - id: IDTA01002-Result
    section: status
    clause: Data Types for Payload, General Result Object (Result, Message, MessageTypeEnum)
    paraphrase: "A failed operation returns a Result object explaining why: a list of Messages, each with a messageType (Info, Warning, Error, Exception) and a text, and optionally a technology-dependent code, a correlationId relating messages across systems, and a timestamp; every failure status except 501 carries one."
    applicability: software
    areas:
      - 1
  - id: IDTA01002-Security
    section: security
    clause: Editorial Notes, Alignment with other AAS Specifications (IDTA-01004)
    paraphrase: "Part 2 is used together with Part 4 Security (IDTA-01004 V3.1): security measures are applied to the API and access control rules are implemented; an implementation supporting only a subset of the access rules states which."
    applicability: software
    areas:
      - 5
      - 10
  - id: IDTA01002-OperationRights
    section: security
    clause: Annex Operation to RIGHT Mapping (normative)
    paraphrase: "A security implementation evaluates every HTTP operation against one fixed IDTA-01004 right: reads of resources and values need READ, reads of references, paths and submodel-refs need VIEW, creating POSTs need CREATE, PATCH and replacing PUTs need UPDATE (CREATE when a PUT creates), DELETE needs DELETE, invocations and their status and result need EXECUTE; a request denied for that right is refused whatever the HTTP method."
    applicability: software
    areas:
      - 5
      - 10
  - id: IDTA01002-GetSelfDescription
    section: description
    clause: API Interfaces, Operation GetSelfDescription; Data Types for Payload, ServiceDescription; Service Specifications and Profiles, Profiles
    paraphrase: "GET /description returns a ServiceDescription listing, as URIs https://admin-shell.io/aas/API/<major>/<minor>/<Name>ServiceSpecification/SSP-<nnn>, the one or more profiles the server implements in full; a profile is listed only when its API is served at or below that path, a server hosting several lists them all, and a server-wide /description may list everything it offers."
    applicability: software
    areas:
      - 1
      - 13
  - id: IDTA01002-GetAllAssetAdministrationShells
    section: aas-repo
    clause: API Interfaces, Operation GetAllAssetAdministrationShells; OpenAPI GET /shells (and /shells/$reference)
    paraphrase: "GET /shells returns all shells of the repository as a paged Result, optionally filtered by createdFrom and updatedFrom (new in V3.2, OR-combined) and combined with limit and cursor; the /$reference suffix returns their references instead."
    applicability: software
    areas:
      - 1
  - id: IDTA01002-GetAllAssetAdministrationShellsRecentChanges
    section: aas-repo
    clause: API Interfaces, Operation GetAllAssetAdministrationShellsRecentChanges (experimental); Data Types for Payload, Recent Changes; OpenAPI GET /shells/$recent-changes
    paraphrase: "Experimental: GET /shells/$recent-changes returns a paged list of light change records of shells (id, createdAt, updatedAt, asset ids) created or updated at or after the given dates, the filters AND-combined except createdFrom and updatedFrom, which form an OR group."
    applicability: software
    areas:
      - 1
      - 6
  - id: IDTA01002-GetAssetAdministrationShellById
    section: aas-repo
    clause: API Interfaces, Operation GetAssetAdministrationShellById; OpenAPI GET /shells/{aasIdentifier} (and /$reference)
    paraphrase: "GET /shells/{aasIdentifier} returns the shell with that identifier (404 when there is none); the /$reference suffix returns its reference."
    applicability: software
    areas:
      - 1
  - id: IDTA01002-GetAllAssetAdministrationShellsByAssetId
    section: aas-repo
    clause: API Interfaces, Operation GetAllAssetAdministrationShellsByAssetId; HTTP/REST API, Design Decisions (assetIds); OpenAPI GET /shells?assetIds=
    paraphrase: "GET /shells?assetIds= returns the shells linked to a global asset id or to specific asset ids; each name-value pair is serialized to JSON and base64url-encoded, every pair given must match on the server, and their order does not change the result."
    applicability: software
    areas:
      - 1
      - 3
  - id: IDTA01002-GetAllAssetAdministrationShellsByIdShort
    section: aas-repo
    clause: API Interfaces, Operation GetAllAssetAdministrationShellsByIdShort; OpenAPI GET /shells?idShort=
    paraphrase: "GET /shells?idShort= returns the shells with that idShort, paged."
    applicability: software
    areas:
      - 1
  - id: IDTA01002-PostAssetAdministrationShell
    section: aas-repo
    clause: API Interfaces, Operation PostAssetAdministrationShell; OpenAPI POST /shells
    paraphrase: "POST /shells creates a shell whose id is set in the payload and answers 201 with the created shell; an existing id is a conflict (409)."
    applicability: software
    areas:
      - 1
  - id: IDTA01002-PutAssetAdministrationShellById
    section: aas-repo
    clause: API Interfaces, Operation PutAssetAdministrationShellById; OpenAPI PUT /shells/{aasIdentifier}
    paraphrase: "PUT /shells/{aasIdentifier} replaces the shell (204) or creates it (201); since V3.2 an id in the body that differs from the path identifier is answered 400."
    applicability: software
    areas:
      - 1
  - id: IDTA01002-DeleteAssetAdministrationShellById
    section: aas-repo
    clause: API Interfaces, Operation DeleteAssetAdministrationShellById; OpenAPI DELETE /shells/{aasIdentifier}
    paraphrase: "DELETE /shells/{aasIdentifier} deletes the shell (204; 404 when there is none)."
    applicability: software
    areas:
      - 1
  - id: IDTA01002-GetAllSubmodelReferences
    section: aas
    clause: API Interfaces, Operation GetAllSubmodelReferences; OpenAPI GET /shells/{aasIdentifier}/submodel-refs
    paraphrase: "GET /shells/{aasIdentifier}/submodel-refs returns the shell's submodel references, paged."
    applicability: software
    areas:
      - 1
  - id: IDTA01002-PostSubmodelReference
    section: aas
    clause: API Interfaces, Operation PostSubmodelReference; HTTP/REST API, Mapping of Operations; OpenAPI POST /shells/{aasIdentifier}/submodel-refs
    paraphrase: "POST …/submodel-refs adds a submodel reference to the shell and answers 201 with it and a Location header ending in /submodel-refs/{base64url submodel id}; a reference already held is a conflict (409)."
    applicability: software
    areas:
      - 1
  - id: IDTA01002-DeleteSubmodelReference
    section: aas
    clause: API Interfaces, Operation DeleteSubmodelReference; OpenAPI DELETE /shells/{aasIdentifier}/submodel-refs/{submodelIdentifier}
    paraphrase: "DELETE …/submodel-refs/{submodelIdentifier} removes the reference to that submodel from the shell (204)."
    applicability: software
    areas:
      - 1
  - id: IDTA01002-GetAssetInformation
    section: aas
    clause: API Interfaces, Operation GetAssetInformation; OpenAPI GET /shells/{aasIdentifier}/asset-information
    paraphrase: "GET …/asset-information returns the shell's asset information."
    applicability: software
    areas:
      - 1
      - 3
  - id: IDTA01002-PutAssetInformation
    section: aas
    clause: API Interfaces, Operation PutAssetInformation; OpenAPI PUT /shells/{aasIdentifier}/asset-information
    paraphrase: "PUT …/asset-information replaces the shell's asset information (204)."
    applicability: software
    areas:
      - 1
      - 3
  - id: IDTA01002-GetThumbnail
    section: aas
    clause: API Interfaces, Operation GetThumbnail; OpenAPI GET /shells/{aasIdentifier}/asset-information/thumbnail
    paraphrase: "GET …/asset-information/thumbnail returns the thumbnail file of the asset as binary content."
    applicability: software
    areas:
      - 1
  - id: IDTA01002-PutThumbnail
    section: aas
    clause: API Interfaces, Operation PutThumbnail; OpenAPI PUT /shells/{aasIdentifier}/asset-information/thumbnail
    paraphrase: "PUT …/asset-information/thumbnail replaces the thumbnail file, uploaded as the binary file part of a multipart request whose filename travels in Content-Disposition (204)."
    applicability: software
    areas:
      - 1
  - id: IDTA01002-DeleteThumbnail
    section: aas
    clause: API Interfaces, Operation DeleteThumbnail; OpenAPI DELETE /shells/{aasIdentifier}/asset-information/thumbnail
    paraphrase: "DELETE …/asset-information/thumbnail deletes the thumbnail file (204; 200 is deprecated)."
    applicability: software
    areas:
      - 1
  - id: IDTA01002-GetAllSubmodels
    section: sm-repo
    clause: API Interfaces, Operation GetAllSubmodels; OpenAPI GET /submodels (and /$metadata, /$value, /$reference, /$path)
    paraphrase: "GET /submodels returns all submodels of the repository as a paged Result, optionally filtered by createdFrom and updatedFrom (new in V3.2), with the level and extent modifiers and the content suffixes."
    applicability: software
    areas:
      - 1
  - id: IDTA01002-GetAllSubmodelsRecentChanges
    section: sm-repo
    clause: API Interfaces, Operation GetAllSubmodelsRecentChanges (experimental); Data Types for Payload, Recent Changes; OpenAPI GET /submodels/$recent-changes
    paraphrase: "Experimental: GET /submodels/$recent-changes returns a paged list of light change records of submodels (id, createdAt, updatedAt, semantic ids) created or updated at or after the given dates."
    applicability: software
    areas:
      - 1
      - 6
  - id: IDTA01002-GetSubmodelById
    section: sm-repo
    clause: API Interfaces, Operation GetSubmodelById and GetSubmodel; OpenAPI GET /submodels/{submodelIdentifier} (and its content suffixes)
    paraphrase: "GET /submodels/{submodelIdentifier} returns the submodel with that identifier (404 when there is none), with the level and extent modifiers and the /$metadata, /$value, /$reference and /$path suffixes."
    applicability: software
    areas:
      - 1
  - id: IDTA01002-GetAllSubmodelsBySemanticId
    section: sm-repo
    clause: API Interfaces, Operation GetAllSubmodelsBySemanticId; HTTP/REST API, Design Decisions (semanticId); OpenAPI GET /submodels?semanticId=
    paraphrase: "GET /submodels?semanticId= returns the submodels whose semanticId or supplementalSemanticIds hold the given reference, serialized to JSON and base64url-encoded, paged."
    applicability: software
    areas:
      - 1
      - 8
  - id: IDTA01002-GetAllSubmodelsByIdShort
    section: sm-repo
    clause: API Interfaces, Operation GetAllSubmodelsByIdShort; OpenAPI GET /submodels?idShort=
    paraphrase: "GET /submodels?idShort= returns the submodels with that idShort, paged."
    applicability: software
    areas:
      - 1
  - id: IDTA01002-PostSubmodel
    section: sm-repo
