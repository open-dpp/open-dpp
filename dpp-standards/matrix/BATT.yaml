  - id: BATT-Art77(5)
    section: Art77
    clause: Art. 77(5)
    paraphrase: All passport information is based on open standards, in an interoperable format, transferable through an open interoperable network without vendor lock-in, machine-readable, structured and searchable, per Art. 78.
    applicability: software
    areas:
