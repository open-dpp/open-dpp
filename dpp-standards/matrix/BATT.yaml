  - id: BATT-Art77(1)
    section: Art77
    clause: Art. 77(1)
    paraphrase: From 18 February 2027 each LMT, industrial above 2 kWh and EV battery placed on the market or put into service has an electronic record, the battery passport.
    applicability: mixed
    areas:
      - 8
      - 1
    assessment:
      date: 2026-09-06
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Met
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/passports/domain/passport.ts
          note: a passport is an AAS Environment created per product/battery
        - type: test
          ref: apps/main/src/passports/domain/passport.spec.ts
        - type: doc
          ref: docs/guides/passports.md
      notes: open-dpp creates an electronic passport record (AAS Environment) per product; an operator can create one per battery. The battery-specific content is tracked separately (no shipped Annex XIII template).
  - id: BATT-Art77(2)-sub1
    section: Art77
    clause: Art. 77(2) first subparagraph
