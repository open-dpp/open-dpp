criteria:
  - id: BATT-Art13(6)
    section: Art13
    clause: Art. 13(6) chapeau
    paraphrase: From 18 February 2027 every battery carries a QR code per Annex VI Part C (high contrast, readable by common hand-held QR readers).
    applicability: mixed
    areas:
      - 4
    operationalisedBy:
      - EN18220
    assessment:
      date: 2026-09-06
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/client/src/components/QrCode.vue
          note: client-side QR generation
      notes: "Client-side QR generation exists, but not the Annex VI Part C battery-label format (high contrast, specified layout). Tracked by #489."
      gapIssue: 489
  - id: BATT-Art13(6)(a)
    section: Art13
    clause: Art. 13(6)(a)
    paraphrase: For LMT batteries, industrial batteries above 2 kWh and EV batteries the QR code gives access to the battery passport.
    applicability: software
    areas:
      - 4
      - 3
      - 11
    operationalisedBy:
      - EN18220
      - EN18219
    assessment:
      date: 2026-09-06
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Met
      operational: true
      evidence:
        - type: code
          ref: apps/client/src/components/QrCode.vue
          note: QR code of the permalink/GS1 link
        - type: code
          ref: apps/main/src/unique-product-identifier/presentation/gs1-resolver.controller.ts
          note: resolves the scanned key to the passport
        - type: test
          ref: apps/e2e/tests/passport-identity/gs1-resolver.spec.ts
        - type: doc
          ref: docs/guides/passports.md
      notes: A scanned QR code carrying the GS1 Digital Link resolves to the passport's public presentation view; the resolver E2E test proves the chain. The Annex VI Part C carrier format itself is tracked as a Gap (Art. 13(6) chapeau).
  - id: BATT-Art13(6)(b)
    section: Art13
    clause: Art. 13(6)(b)
    paraphrase: For other batteries the QR code gives access to the Art. 13(1)-(5) label information, the declaration of conformity, the due-diligence report and the Art. 74(1)(a)-(f) waste information.
    applicability: software
    areas:
      - 11
      - 8
    operationalisedBy:
      - EN18220
    assessment:
      date: 2026-09-06
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/templates/domain/template.ts
          note: reusable AAS template per organisation
        - type: code
          ref: apps/main/src/aas/domain/submodel-base/register-submodel-element-classes.ts
          note: full AAS submodel-element type set
      notes: The generic AAS template system can model this attribute (Property/MultiLanguageProperty/File/collections); open-dpp ships no battery passport template and no semantic binding. The E2E fixture apps/e2e/tests/api/battery-passport.ts proves a full Annex XIII passport is expressible.
      gapIssue: 522
