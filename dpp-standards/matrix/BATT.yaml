      - 2
      - 13
    operationalisedBy:
      - EN18216
      - EN18222
      - EN18223
    assessment:
      date: 2026-09-06
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Partial
      operational: false
      evidence:
        - type: code
          ref: apps/main/src/aas/infrastructure/serialization/aas-serialization.service.ts
          note: JSON export
        - type: code
          ref: apps/main/src/open-api-docs/index.ts
          note: served OpenAPI 3.1
        - type: check
          ref: api.openapi-document-served
          result: passed
          date: 2026-09-07
        - type: check
          ref: export.aas-environment-verifies
          result: failed
          date: 2026-09-07
      notes: Passport data are machine-readable structured JSON over a documented OpenAPI and searchable via the API, but the export is a proprietary open-dpp:json envelope, not standard AAS JSON (it omits the AAS-required shell id); the export.aas-environment-verifies Check fails. Interoperability without vendor lock-in is therefore not met.
      gapIssue: 823
