        - type: manual
          ref: "Checked 2026-10-12 against an Instance built from dad48246 (worktree, port 3001) as an organisation member: a SubmodelElementList declared typeValueListElement Property, posted with a SubmodelElementCollection item, answered 201; a list declared valueTypeListElement Double with a String item answered 201; an empty SubmodelElementCollection answered 201."
          date: 2026-10-12
        - type: check
          ref: model.list-items-one-type
          result: failed
          date: 2026-10-12
      notes: "Mandatory. Credited: a SubmodelElementList declares the type of its items (typeValueListElement, and valueTypeListElement for properties) and refuses a mismatching item added on its own. Missing: a list posted with its items is stored unchecked, so a list of properties can hold a collection and a list of doubles a string (bug #1054; Check model.list-items-one-type fails), and no MultiValuedDataElement is offered (#1057)."
      gapIssue: 1057
