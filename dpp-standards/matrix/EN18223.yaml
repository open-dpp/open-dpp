# Conformance Matrix: EN18223 (EN 18223:2026). Rules: dpp-standards/README.md.
# Criteria extracted from the final text (English SIS edition, edition 1, git-ignored standards/EN18223-2026.pdf) on 2026-10-12 (ticket #762); assessments are added in place, one per Criterion.
# Gated text: every paraphrase is ours, never a sentence of the standard.
# Clause numbering: one Criterion per paragraph that carries a requirement (shall, should or may), numbered as the PDF sets the paragraphs apart ("4.1.2.1(6)"); EXAMPLEs are not paragraphs. Table 1, the attributes a DPP instance publishes (4.1.2.1(5)), gives one Criterion per attribute ("4.1.2.1(5)(dppStatus)"), because each attribute has its own counterpart in open-dpp or none; the enumeration of 4.1.2.2 is graded with the granularity row, and {DataElement} through the rows of 4.1.2.3 to 4.1.2.8.2. Table 2 gives one Criterion per attribute, elementId split into its two mandatory uniqueness rules (-sub1) and the recommendation (-sub2). The class clauses 4.1.2.4 to 4.1.2.8.2 define, without a modal verb of their own, what 4.1.2.1(5) and 5.2.1(1) oblige, so each is one Criterion under its bare clause number; a clause of several paragraphs numbers them ("4.1.2.4(2)", "5.2.4(1)"), a clause of one paragraph keeps its bare number ("5.2.7") and splits two requirements into -sub1 and -sub2 ("5.2.3-sub1"). A list item with a modal verb of its own is lettered in printed order: 4.1.2.1(4)(d), the one-type rule of a MultiValuedDataElement and the only item of the principles of 4.1.2.1(4) with a "shall" (the other items describe the classes graded in 4.1.2.3 to 4.1.2.8.2, the abstract DataElement among them), and 4.1.2.9(a) to (d) after its lead recommendation. 4.3(2) holds four requirements, -sub1 to -sub4. The serialisation clauses 5.2.2 to 5.2.9 and Annexes A and B are obliged by 5.2.1(2).
# Not extracted, no requirement of their own: the Foreword and Introduction (0.2 to 0.4 name the organisational, semantic and technical layers), clauses 1 (scope), 2 (normative references, forms below), 3 (terms; 3.5 the DPP ID), 4.1.1 (the UML diagrams illustrate; where diagram, prose and JSON disagree, the prose and tables of clause 4 prevail), 4.1.2.1(1) to (3) (Figure 1 and the DPP as a container of zero or more data elements), the descriptive items of 4.1.2.1(4) (the five concrete classes under an abstract DataElement that never appears itself, graded through the class rows), 4.1.2.4(1) (says what 4.1.2.4(2) requires, without a modal verb), the EXAMPLE of dppStatus values (graded with the dppStatus row), 4.1.2.1(7) ({DataElement} stands for further content, ESPR Annex III points beyond Table 1 included), the placeholder sentence of 4.1.2.6, the closing sentence of 4.1.2.7 (legal acts may add attributes), 4.3(3) (what the decoupled approach brings; dictionaryReference ties an element to its definition, graded with 4.1.2.3(dictionaryReference)), 5.1, the EXAMPLEs of 5.2.4 to 5.2.9, Annex ZA (below) and the Bibliography.
# Mirrors: none. 4.2(2) is close to EN18221-4.2(5) (every change to the DPP is archived as EN 18221 lays down, delegated acts setting the extent), which EN18222-4.7(4) mirrors, but it also asks for each change to be logged, so it is an own Criterion. 4.2(1) is an own recommendation on what each change record holds (identifiers, time, actor, changed properties).
# References (forms decided in #1021, confirmed by this Extract). Clause 2 names three: ISO 8601-1:2019 as amended by Amd 1:2022 (dated), read through Table 7, which spells out the date and date-time patterns the text uses, and RFC 3339, its free Internet profile, not bought (registered as ISO8601); EN 18219 (undated), graded by pointing at its rows (the identifier formats of Table 1); EN 18221 (undated), graded by pointing at its rows (4.2(2) mirrors EN18221-4.2(5)). Bound by the body though listed only in the Bibliography, read through and graded on this file's rows: RFC 3986 (the url of Table 5 and the anyURI pattern of Table 7; registered by EN 18219), ISO 639:2023 and EN ISO 3166-1:2020 (the two-letter language and country codes of the language tags of Tables 5 and 6; registered as ISO639 and ISO3166), W3C XML Schema 1.0 Part 2 (the built-in data types 4.1.2.9 admits and excludes; registered as XSD2). The IANA media type registry named by the contentType of Table 5 is a registry, not a standard: graded on 4.1.2.7, no entry. Graded by pointing at other files: ISO/IEC 21778:2017 (the native JSON types of 5.2.3(1), a recommendation; its matrix file is ISO21778), EN 18216 (the data syntaxes 5.2.1(1) names) and EN 18239 (the actor of 4.2(1), a recommendation). No requirement: ISO 18435-1 and ISO 18308 (sources of the terms), ISO/IEC 19505-2 (the UML notation of the diagrams), ESPR (the law). Listed in the Bibliography but cited nowhere in the text: EN ISO 11354-1, EN 18220, EN 18222 and EN 18246. The text cites neither IEC 63278 nor the Asset Administration Shell, which the EN18223 source entry wrongly named.
# Findings: The compressed JSON cannot be read back on its own: it keys elements by elementId and drops dictionaryReference, valueDataType and the class (5.2.2(2)), list items lose the elementId Table 2 makes mandatory (5.2.7), a multi-language element or a related resource looks like an ordinary list or collection, the string-plus-valueDataType fallback of 5.2.3 has no place in it, and header attributes and top-level elementIds share one object with nothing preventing a clash (the XML of Annex B separates them by namespace). The text never says which serialisation is mandatory, nor defines "compressed" and "full", which EN 18222 8.1 uses. EN 18222 Table 11 types Identifier and Timestamp as EN 18223 defines them, but EN 18223 defines no such types (identifiers are strings, the one timestamp is lastUpdated), and EN 18222's registry entry calls itself a DPP header with other attributes than Table 1. Table 4 allows a MultiValuedDataElement zero items where 4.1.2.6 and Figure 1 ask for at least one. Table 7 gives a JSON form for ten XSD types only, leaving duration, time, the g types, hexBinary and the integer subtypes without one, and the valueDataType prefix "xsd:" is shown only by example. The language tags of Tables 5 and 6 are no BCP 47 tags, their case differs between the tables and it stays open whether the country part is mandatory. The instance carries no version of its own, though EN 18221 archives versions and EN 18222 reads one by date. Clause 1 promises a model of data dictionaries and organisational interoperability; the body has three paragraphs on repositories (4.3) and no organisational clause. Annexes A and B are normative but hold examples only. Annex A's Example 2 is no valid JSON (objects listed without keys or array), its Example 4 calls the item list "value" where Example 1 calls it "elements", gives the numbers as strings and repeats the elementId efficiencyRating2 (against the uniqueness rule of Table 2), its dictionary references carry a single slash after "https:" and stray spaces, Example 5 ends an object with a comma, Example 6 tags Greek "gr" (ISO 639 has "el") and Example 5 a bare "en", where Tables 5 and 6 ask for a language and a country code. Annex B's examples are no well-formed XML (a space after "<", an escaped "<" before closing tags, dashes in the date, broken comments), and Annex B is the compressed XML serialisation although EN 18222 8.1 points the full representation to Annexes A and B. The header examples write the granularity "Model" and the status "Active" where 4.1.2.2 and the status examples are lower case, and their dppSchemaVersion differs between 5.2.4 and Annex B. The class names appear as SingleValueDataElement and MultiValueDataElement beside SingleValuedDataElement and MultiValuedDataElement; the principles of 4.1.2.1 send DataElementCollection to 4.1.2.3 and MultiValuedDataElement to 4.1.2.4 (meant: 4.1.2.4 and 4.1.2.6); 4.1.2.4's list of what a collection holds leaves out MultiLanguageDataElement. 4.2 cites "EN 182391" (EN 18239 with its footnote marker run in). Annex ZA maps ESPR Art. 11(d) (a new DPP linked to the original one) to RelatedResource, which the text defines for documents and certificates; no class or header attribute links one DPP to another. It maps Art. 7(8) (a language customers understand) to the multi-language classes, which make language-tagged values possible but require none. The footnotes still call EN 18239 and EN 18246 under preparation, as in EN 18219, EN 18220 and EN 18222.
# Annex ZA (informative) maps clauses to ESPR, with presumption of conformity since the OJ citation by Implementing Decision (EU) 2026/1736, and no remark limiting any row: Art. 7(8) through 4.1.2.8 and 4.1.2.8.2; Art. 10(1)(d) through 4.1; Art. 10(1)(f) through 4.1.2; Art. 11(a) through clauses 4 and 5; Art. 11(d) through 4.1.2.7. The rows that never cap a law row: the recommendations 4.1.2.1(6)-sub2, 4.1.2.3(elementId)-sub2, 4.1.2.9, 4.2(1), 4.3(2)-sub1 and 5.2.3-sub1; the options 4.1.2.9(d), 5.2.3-sub2 and 5.2.6-sub2; the optional attributes facilityId, contentSpecificationIds and dictionaryReference; Annex B, which binds only an XML serialisation, optional under EN 18216 5(b); and the repository and Commission duties 4.3(2)-sub2 to -sub4 and 5.2.5-sub2. Every other row caps. This Extract added ESPR-Art7(8) to the ESPR file (Annex ZA maps it; the Tier A extraction had taken Art. 7(2)(b) and 7(5) only) and EN18223 to operationalisedBy of ESPR-Art7(8) and 10(1)(f), and, as rows the text addresses without presumption (map rule of 2026-10-09), of ESPR-Art9(2)(d) and REG1778-Art8(7)(c) (the granularity of Table 1), ESPR-AnnexIII(b), (g), (h) and (i) (the identifiers of Table 1) and ESPR-AnnexIII(e) and (f) (documents as RelatedResource). It dropped EN18223 from the registry rows the text never mentions: ESPR-Art13(4), 13(5), REG1778-Art3(b), 8(1), 8(2), 8(6), 8(10), 9(4), 19(2) and BATT-Art77(10), and from REG1778-Art12(6) (the repository's APIs, which 4.3 does not touch). The other law rows naming EN18223 stay: ESPR-Art10(1)(d), 11(a) and 11(d) (Annex ZA), BATT-Art77(5), 78(a) and 77(7)-sub1 (their battery counterparts), REG1778-Art3(g), 12(2)(a), (b) and (e) (the semantic repository of 4.3), REG1778-Art11(3) and 8(7)(a) (data structured by and conforming to the repository's definitions), 11(4) (versioned data models: dppSchemaVersion and contentSpecificationIds), 8(7) (a DPP the registry can read: clause 5) and 8(7)(b) (registry data matching the DPP's header).

