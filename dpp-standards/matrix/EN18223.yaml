    paraphrase: "Optional: inside a MultiValuedDataElement it may be reduced to a bare value of a native JSON type."
    applicability: software
    areas:
      - 2
  - id: EN18223-5.2.7
    section: "5.2"
    clause: "5.2.7"
    paraphrase: "A MultiValuedDataElement is serialised as a JSON array whose items share one JSON type, simple or object; an item carries no key and is identified by its index."
    applicability: software
    areas:
      - 2
  - id: EN18223-5.2.8
    section: "5.2"
    clause: "5.2.8"
    paraphrase: "A RelatedResource is serialised as a JSON object carrying its attributes (resourceTitle, contentType, url, language)."
    applicability: software
    areas:
      - 2
  - id: EN18223-5.2.9
    section: "5.2"
    clause: "5.2.9"
    paraphrase: "A MultiLanguageDataElement is serialised as a JSON array of objects, one per MultiLanguageValue, each holding the value and its language."
    applicability: software
    areas:
      - 2
  - id: EN18223-A
    section: "A"
    clause: Annex A (normative)
    paraphrase: "Expanded full JSON: the DPP's data elements sit in an elements array after the header, and every element is an object carrying elementId, objectType (its class name), dictionaryReference, valueDataType where it applies, and its value or, for collections and lists, its nested elements."
    applicability: software
    areas:
      - 2
  - id: EN18223-B
    section: "A"
    clause: Annex B (normative)
    paraphrase: "Compressed XML: the DPP is a DigitalProductPassport element in the EN 18223 schema namespace with the header attributes as child elements; data elements are elements named by their elementId in the namespace of their content specification, list items are item elements, and each multi-language value is a MultiLanguageValue element holding value and language."
    applicability: software
    areas:
      - 2
