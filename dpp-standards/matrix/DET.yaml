criteria:
  # ---- Article 21 -----------------------------------------------------------------------------
  - id: DET-Art21(1)
    section: Art21
    clause: Art. 21(1)
    paraphrase: Before a detergent or end-user surfactant is placed on the market its manufacturer creates a DPP for it that meets Art. 21 and Art. 22. Related to ESPR-Art9(1), with the creator fixed as the manufacturer and no delegated act in between; the accuracy limb is Art. 21(2)(d).
    applicability: mixed
    areas:
      - 1
      - 6
    assessment:
      date: 2026-09-07
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/passports/presentation/passport.controller.ts
          note: POST /passports from a template or an environment, PUT status, AAS update routes
        - type: code
          ref: apps/main/src/passports/application/services/passport.service.ts
          note: createPassportFromTemplate, status changes, draft-only delete
        - type: code
          ref: apps/main/src/digital-product-document/domain/digital-product-document-status.ts
          note: Draft -> Published -> Archived -> Restore
        - type: code
          ref: apps/main/src/permalink/application/services/permalink.application.service.ts
          note: public URL resolution and freeze on publish
        - type: test
          ref: apps/main/src/passports/application/services/passport.service.spec.ts
          note: creation from a template, publish freezes permalinks
        - type: test
          ref: apps/e2e/tests/passport-identity/publish-freeze.spec.ts
          note: publishing freezes the permalink and opens it to anonymous visitors
        - type: doc
          ref: docs/guides/digital-product-document/lifecycle.md
          note: the three lifecycle stages and what each allows; no page on creating, editing or serving a passport
      notes: "Software part: a passport the manufacturer can create before placing the product on the market, and that meets Art. 21 and 22. Credited: a passport is created from a template or an environment, held as a draft, published and then served publicly at its permalink and through the GS1 resolver; every change is recorded. Missing: the passport does not meet Art. 21 and 22 as this run assesses them, above all the Annex VI content (#837, the cluster whose delivery makes a passport an Art. 21 passport), the Member-State languages (#838), the single-passport and separation rules (#839), the no-tracking rule (#840), the external access classes (#821), the model granularity (#597) and the print-ready carrier (#489); the operator docs cover the lifecycle stages only (#828). Same reading as CPR-Art75(2)(b) after its adversarial review: the generic mechanics are credited, the sector content is the gap. The creator is fixed as the manufacturer: any organisation member can create a passport, which is the manufacturer's own affair."
      gapIssue: 837
  - id: DET-Art21(2)(a)
    section: Art21
    clause: Art. 21(2)(a)
    paraphrase: The DPP corresponds to a specific model of detergent or end-user surfactant. Related to ESPR-Art10(1)(f) and ESPR-Art9(2)(d), with the granularity fixed at model level by the law itself (batch or item only by the Art. 21(7) derogation).
    applicability: software
    areas:
      - 3
      - 8
    assessment:
      date: 2026-09-07
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/unique-product-identifier/domain/unique.product.identifier.ts
          note: granularity is model when a GS1 identity has no batch or serial
        - type: code
          ref: packages/dto/src/unique-product-identifiers/unique-product-identifier-type.ts
          note: Gs1Granularity model, batch, item
        - type: code
          ref: apps/main/src/aas/presentation/environment.service.ts
          note: assetKind Instance for passports, Type for templates
        - type: test
          ref: apps/main/src/unique-product-identifier/domain/unique.product.identifier.spec.ts
          note: model granularity for a bare GTIN
      notes: "The Regulation fixes the passport at the model of detergent or end-user surfactant (recital 45: the same model as long as neither the formula nor the production changes the label). Credited: a GS1 identity with a bare GTIN is a model-level identifier and resolves as one, and several identifiers may sit on a passport, so a model passport can be built. Missing: no passport-level granularity or model attribute, an open-dpp UUID identifier carries no level, nothing ties a passport to a label version or formula so that a change forcing a new label yields a new model passport, and a passport's AAS asset is always assetKind Instance while Type is reserved for templates, so a model passport cannot declare itself one (#597; same finding as CPR-Art76(2)(d), ESPR-Art9(2)(d) and REG1778 Art. 8(3)). The batch or item override is DET-Art21(7)."
      gapIssue: 597
  - id: DET-Art21(2)(b)
    section: Art21
    clause: Art. 21(2)(b)
    paraphrase: The DPP states that the product's compliance with the Regulation has been demonstrated (the declaration-of-conformity statement inside the passport; content detail in Annex VI Part A(g)). No ESPR counterpart.
    applicability: software
    areas:
      - 8
    assessment:
      date: 2026-09-07
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/templates/domain/template.ts
          note: reusable AAS template per organisation
        - type: code
          ref: apps/main/src/aas/domain/submodel-base/register-submodel-element-classes.ts
          note: the eleven supported submodel-element types
        - type: code
          ref: apps/main/src/aas/domain/common/has-semantics.ts
          note: semanticId on every element
        - type: code
          ref: apps/client/src/components/presentation/SubmodelElementValue.vue
          note: a text Property renders in the public view
      notes: "The passport states that the product's compliance with the Regulation has been demonstrated (recital 49: the manufacturer declares compliance and takes responsibility; the wording is DET-AnnexVI-A(g)). Credited: a text Property holding the statement is modellable in a template, carries a semanticId and renders in the public view. Missing: no compliance-statement element or fixed text ships, nothing marks a passport as carrying the statement, and a multilingual statement is not rendered (#838); tracked in the content cluster #837. No ESPR counterpart."
      gapIssue: 837
  - id: DET-Art21(2)(c)
    section: Art21
    clause: Art. 21(2)(c)
    paraphrase: The DPP contains at least the data of Annex VI Part A. Related to ESPR-Art9(2)(a), with the mandatory data set fixed in the law instead of a delegated act.
    applicability: software
    areas:
      - 8
    assessment:
      date: 2026-09-07
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/templates/domain/template.ts
          note: reusable AAS template per organisation
        - type: code
          ref: apps/main/src/aas/domain/submodel-base/register-submodel-element-classes.ts
          note: the eleven supported submodel-element types
        - type: code
          ref: apps/main/src/passports/domain/passport.ts
          note: a passport is an AAS Environment per product, created from a template
        - type: code
          ref: apps/main/src/aas/domain/common/has-semantics.ts
          note: semanticId on every element
      notes: "The mandatory data set is fixed in the law (Annex VI Part A) instead of a delegated act. Credited: templates are freely composable per organisation and passports are created from them, so an operator can build the Part A set by hand, element by element, as the Annex VI rows record. Missing: no Annex VI Part A template or submodel ships, and nothing checks that a passport holds the whole set before it is published (#837; a validation against a data model is the semantic-repository question, #826). Same shape as ESPR-Art9(2)(a), with the set fixed."
      gapIssue: 837
  - id: DET-Art21(2)(d)
    section: Art21
    clause: Art. 21(2)(d)
    paraphrase: The DPP is accurate, complete and up to date.
    applicability: mixed
    areas:
      - 1
      - 6
    mirrors: ESPR-Art9(1)
  - id: DET-Art21(2)(e)
    section: Art21
    clause: Art. 21(2)(e)
    paraphrase: The DPP is available in the language or languages required by the Member State in which the product is made available on the market. No ESPR counterpart (multilingual passport content).
    applicability: software
    areas:
      - 8
      - 11
    assessment:
      date: 2026-09-07
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/aas/domain/submodel-base/multi-language-property.ts
          note: one text per language in the data model and the API
        - type: code
          ref: packages/dto/src/aas/enums/language-enum.ts
          note: fixed list of 29 language codes; Irish (ga) and Maltese (mt) absent
        - type: code
          ref: apps/client/src/components/aas/form/LanguageTextArrayForm.vue
          note: element and submodel labels editable per language
        - type: code
          ref: apps/client/src/components/presentation/PresentationLanguageSelect.vue
          note: language switcher of the public view, built from the passport's language tags
        - type: code
          ref: apps/client/src/composables/presentation-language.ts
          note: the chosen language travels in the ?lang= query parameter as a BCP 47 tag
        - type: code
          ref: apps/client/src/composables/language.ts
          note: browser preference picks the initial language; per-text resolution with en fallback
        - type: code
          ref: apps/client/src/components/presentation/SubmodelElementValue.vue
          note: "no MultiLanguageProperty branch: the value renders blank"
        - type: code
          ref: apps/client/src/composables/aas-editor.ts
          note: the element menu offers no MultiLanguageProperty
        - type: test
          ref: apps/client/src/composables/language.spec.ts
          note: language resolution and preferred-language selection
      notes: "Software part: let the operator enter the passport in every language a Member State requires and show a visitor one of them. Credited: MultiLanguageProperty in the data model and API, per-language labels editable in the client, a language switcher on the public view driven by the languages present in the passport, a shareable ?lang= choice and browser-preference detection. Missing: a MultiLanguageProperty value is not rendered in the public view (label shown, value blank; also empty in tables) and cannot be created or edited in the client, so values are single-language Properties duplicated by hand; the language list behind every language text lacks Irish and Maltese, so two EU official languages cannot be entered at all; the public view's own strings exist in English and German only; nothing checks completeness per language; no operator documentation (#838). No ESPR counterpart; the same clause returns in the Toy Safety Regulation Art. 19(2)(e)."
      gapIssue: 838
  - id: DET-Art21(2)(f)
    section: Art21
    clause: Art. 21(2)(f)
    paraphrase: The DPP is accessible to consumers or other end-users, market surveillance authorities, customs authorities, the Commission and other economic operators according to the access rights the Art. 21(10)(d) implementing act lays down. Related to ESPR-Art11(b), with a closed and shorter actor list (no repairers, civil society or trade unions) and the rights set by an implementing act.
    applicability: software
    areas:
      - 5
      - 11
    assessment:
      date: 2026-09-07
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/aas/domain/security/access-control.ts
          note: per-submodel and per-element access rules
        - type: code
          ref: apps/main/src/aas/domain/security/subject-attributes.ts
          note: "role hierarchy: admin, owner, member, user, anonymous"
        - type: code
          ref: apps/client/src/components/aas/PermissionsForm.vue
          note: editor UI to grant or withdraw the anonymous read right per element
        - type: test
          ref: apps/main/src/aas/domain/security/security.spec.ts
          note: access rules per role and element
        - type: test
          ref: apps/main/src/aas/presentation/environment.service.spec.ts
          note: an anonymous subject is refused on a hidden submodel (ForbiddenError)
      notes: "Software part: give consumers and other end-users, market surveillance and customs authorities, the Commission and other economic operators access to the data meant for each, as the Art. 21(10)(d) implementing act will fix (it does not exist yet). Credited: per-submodel and per-element visibility for the roles anonymous, organisation member, organisation owner and instance admin; a published passport is public by default and any element can be withheld from anonymous readers, which covers the consumer class today. Missing: none of the named external classes (market surveillance, customs, the Commission, another economic operator) can be expressed, so information cannot be shown to an authority and withheld from the public, and there is no credential-based grant (#821; same finding as ESPR-Art9(2)(f), CPR-Art75(2)(c) and BATT-Art77(2)). Free access and the no-registration rule are DET-Art22(c) (Mirror) and DET-Art22(d). Re-validate when the implementing act fixes the access rights."
      gapIssue: 821
  - id: DET-Art21(2)(g)
    section: Art21
    clause: Art. 21(2)(g)
    paraphrase: The DPP stays available for 10 years from the date the product is placed on the market, including after insolvency, liquidation or cessation of activity in the Union of the operator that created it. Related to ESPR-Art11(e) and ESPR-Art9(2)(i), with the period fixed at 10 years by the law.
    applicability: mixed
    areas:
      - 6
    assessment:
      date: 2026-09-07
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/passports/application/services/passport.service.ts
          note: deletePassport refuses non-draft passports
        - type: code
          ref: apps/main/src/digital-product-document/domain/digital-product-document-status.ts
          note: Draft -> Published -> Archived -> Restore
        - type: test
          ref: apps/main/src/passports/application/services/passport.service.spec.ts
          note: deletePassport rejects non-draft passports
        - type: doc
          ref: docs/guides/digital-product-document/lifecycle.md
          note: what each stage allows
      notes: "Software part: keep the passport available for 10 years from the placing on the market (Art. 8(3) puts the same 10 years on the manufacturer's keeping and updating duty), including after the creator's insolvency, liquidation or cessation. Credited: published and archived passports cannot be deleted and archiving is reversible, so a passport stays in the system indefinitely, and the lifecycle is documented. Missing: no representation of an availability period or of the placing-on-the-market date it runs from, an archived passport is no longer served publicly (the permalink service requires Published), no back-up (#596; the back-up copy itself is the Mirror DET-Art21(12)(c)) and no escrow, handover or continuity once the operator ceases (#825). Same finding as ESPR-Art9(2)(i) and CPR-Art76(2)(h), with the period fixed at 10 years."
      gapIssue: 825
  - id: DET-Art21(2)(h)
    section: Art21
    clause: Art. 21(2)(h)
    paraphrase: The DPP is connected through a data carrier to a persistent unique product identifier.
    applicability: software
    areas:
      - 3
      - 4
    mirrors: ESPR-Art10(1)(a)
  - id: DET-Art21(2)(i)
    section: Art21
    clause: Art. 21(2)(i)
    paraphrase: The DPP fulfils the specific and technical requirements the Art. 21(10) implementing act lays down. Not assessable until that act exists; its content then enters the matrix as an act under a registered source.
    applicability: software
    areas:
      - 12
  - id: DET-Art21(3)
    section: Art21
    clause: Art. 21(3)
    paraphrase: Besides the Annex VI Part A data the DPP may contain the Annex VI Part B data (the labelling information). Related to ESPR-Art10(2) and ESPR-AnnexIII-para3, with the optional set fixed in the law.
    applicability: software
    areas:
      - 8
    assessment:
      date: 2026-09-07
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/templates/domain/template.ts
          note: reusable AAS template per organisation
        - type: code
          ref: apps/main/src/aas/domain/submodel-base/register-submodel-element-classes.ts
          note: the eleven supported submodel-element types
        - type: code
          ref: apps/main/src/aas/domain/submodel-base/submodel-element-list.ts
          note: a list for the dosage table
      notes: "Optional content fixed in the law: the Annex VI Part B labelling information (Art. 17(3) and (4), that is the Annex V general labelling and dosage information). Credited: templates accept any additional submodel or element, so the label text and a dosage table are addable today. Missing: no Annex V label or dosage structure ships to add as such, and a multilingual label text is not rendered in the public view (#838); tracked with the content cluster #837, the content row itself is DET-AnnexVI-B. Same shape as ESPR-Art10(2) and ESPR-AnnexIII-para3, with the optional set fixed."
      gapIssue: 837
  - id: DET-Art21(4)(a)
    section: Art21
    clause: Art. 21(4)(a)
    paraphrase: The data carrier is printed or otherwise physically present on the label or the packaging, or on the accompanying documents for products transported in bulk, as the Art. 21(10) implementing act specifies. Related to ESPR-Art10(1)(b), with the label named and the bulk-transport documents added.
    applicability: mixed
    areas:
      - 4
    assessment:
      date: 2026-09-07
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/client/src/components/QrCode.vue
          note: QR code rendered into a canvas
        - type: code
          ref: apps/client/src/components/permalinks/PermalinkQrCode.vue
          note: a QR code per permalink, URL copyable
        - type: code
          ref: apps/client/src/components/presentation/PassportQrCodeDialog.vue
          note: QR dialog of a passport
        - type: test
          ref: apps/e2e/tests/passport-identity/permalink-crud.spec.ts
          note: "the QR dialog of a permalink: URL text and copy button (the canvas itself is not asserted)"
      notes: "Software part: a carrier the manufacturer can print on the label or packaging, or on the documents accompanying a bulk consignment, as the Art. 21(10) implementing act will specify (it does not exist yet). Credited: a QR code is rendered for every permalink and for the GS1 Digital Link. Missing: the QR exists only as an on-screen canvas, with no image download (PNG or SVG), no print layout and no server endpoint returning the carrier, so the manufacturer must regenerate the code from the copied URL with another tool; no GS1 2D code with FNC1 either (#489). The operator docs mention neither permalinks nor QR codes (#828). Placing it is the manufacturer's act; re-validate when the act fixes the placement. Same finding as CPR-Art77(1)(b)."
      gapIssue: 489
  - id: DET-Art21(4)(b)
    section: Art21
    clause: Art. 21(4)(b)
    paraphrase: The data carrier is indelible. A physical property of the printed carrier; no ESPR counterpart.
    applicability: operator
    areas:
      - 4
    assessment:
      date: 2026-09-07
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Not applicable
      operational: false
      evidence: []
      notes: "Operator duty, assessed Not applicable by rule: the indelibility of the printed carrier is a property of the label or packaging print, not of the software. The carrier image the operator prints is assessed on DET-Art21(4)(a)."
  - id: DET-Art21(4)(c)
    section: Art21
    clause: Art. 21(4)(c)
    paraphrase: The data carrier is positioned so that digital devices can process it automatically. Related to ESPR-Art9(2)(c), with machine processability fixed in the law instead of a delegated act; the carrier format is the software part, its placement the operator's.
    applicability: mixed
    areas:
      - 4
    assessment:
      date: 2026-09-07
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/client/src/components/QrCode.vue
          note: standard QR symbology from the qrcode library, one-module quiet zone
        - type: code
          ref: packages/dto/src/unique-product-identifiers/gs1/gs1-digital-link.ts
          note: the encoded URI is a GS1 Digital Link
        - type: code
          ref: apps/main/src/unique-product-identifier/presentation/gs1-resolver.controller.ts
          note: a scanned key redirects to the public view
        - type: test
          ref: apps/e2e/tests/passport-identity/gs1-resolver.spec.ts
          note: a scanned key on a published passport redirects to its view
      notes: "Machine processability fixed in the law instead of a delegated act; the carrier format is the software part, its positioning the operator's. Credited: the carrier is a standard QR symbology encoding a URL (permalink or GS1 Digital Link) that any camera application processes, and a scan resolves to the passport. Missing: no print-ready artwork with symbol size, quiet zone and error-correction guidance, so machine readability on the printed label depends on what the operator regenerates elsewhere, and no verification of the symbol against ISO/IEC 18004 or the GS1 2D specifications (#489; the carrier standards are the EN 18220 ticket #757). Positioning on the label so that devices read it is the operator's act."
      gapIssue: 489
  - id: DET-Art21(4)(d)
    section: Art21
    clause: Art. 21(4)(d)
    paraphrase: For products made available through refill, the data carrier is present on the refill station. A placement duty; no ESPR counterpart.
    applicability: operator
    areas:
      - 4
    assessment:
      date: 2026-09-07
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Not applicable
      operational: false
      evidence: []
      notes: "Operator duty, assessed Not applicable by rule: placing the carrier on the refill station (and on every refilled packaging, Art. 17(2)) is the act of the operator selling through refill. The same carrier image serves; nothing refill-specific is needed from the software."
  - id: DET-Art21(4)(e)
    section: Art21
    clause: Art. 21(4)(e)
    paraphrase: The data carrier is accompanied by the statement "Please scan for more comprehensive information on the product" or a similar statement. No ESPR counterpart; the software part is a carrier rendering that carries the caption.
    applicability: mixed
    areas:
      - 4
    assessment:
      date: 2026-09-07
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/client/src/components/permalinks/PermalinkQrCode.vue
          note: the only texts near the code are the kind label and the URL
        - type: code
          ref: apps/client/src/translations/en-US.json
          note: no scan-for-information caption string exists
        - type: code
          ref: apps/client/src/components/presentation/PassportQrCodeDialog.vue
          note: draft and archived warnings only
      notes: "The printed carrier is accompanied by the statement asking the reader to scan for more comprehensive product information, or a similar one. Software part: a carrier artwork that carries the caption, so the label designer need not add it. Missing: no caption is rendered next to the QR code and no exportable artwork exists at all (#489, told this caption requirement in a comment); the operator adds the statement when designing the label, unguided by the docs (#828). No ESPR counterpart."
      gapIssue: 489
