          ref: apps/main/src/unique-product-identifier/infrastructure/unique-product-identifier.repository.spec.ts
          note: global uniqueness of a bare GTIN across passports
      notes: "Where the product also needs a passport under an ESPR delegated act or other Union law, its unique product identifier, unique operator identifier and unique registration identifier are the same under both regimes. Credited: one passport (DET-Art21(6)) carries one set of product identifiers that is globally unique across the instance, so the product identifier is the same by construction and a GS1 identity is the same everywhere. Missing: the unique operator identifier and the unique registration identifier do not exist in open-dpp at all (no operator identifier on an organisation, no registration-identifier field, no registry client; #579), so two of the three identifiers the clause equates cannot be the same because they cannot be held; and nothing stops an operator from minting a second passport with a different identifier for the other regime (#597, #839). Identifier reuse across regimes has no ESPR counterpart."
