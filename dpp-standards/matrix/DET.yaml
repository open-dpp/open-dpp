# Conformance Matrix: DET (32026R0405). Rules: dpp-standards/README.md.
# Criteria extracted from research/criteria-sector-laws.md and verified against the Cellar text on 2026-09-07 (ticket #830); assessments are added in place, one per Criterion.
# Clauses outside Chapter V, Art. 30(2)-(3) and Annex VI that the paraphrases cite (Art. 2, 8, 17-20, 29, Annex IV, V, VII) are not extracted; the ENs carry presumption of conformity under ESPR only, so operationalisedBy stays empty until the Art. 21(10) implementing act names standards.
# A Mirror (mirrors: <ESPR id>) restates the ESPR Criterion with no delta and inherits its Assessment; own rows name the related ESPR id in the paraphrase.
standard: DET
edition: 32026R0405
extractedFrom: dpp-standards/research/criteria-sector-laws.md
extractedAt: 2026-09-07
sections:
  - id: Art21
    title: Article 21 – Digital product passport
  - id: Art22
    title: Article 22 – Technical design and operation of the digital product passport
  - id: Art23
    title: Article 23 – Data carriers and unique identifiers
  - id: Art24
    title: Article 24 – Digital product passport registry
  - id: Art25
