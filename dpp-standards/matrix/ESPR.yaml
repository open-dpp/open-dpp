  - id: ESPR-Art7(5)
    section: Art7
    clause: Art. 7(5) chapeau
    paraphrase: Information requirements must make "substances of concern" trackable through the whole product life cycle (unless another delegated act already does so), covering at least points (a) to (e).
    applicability: software
    areas:
      - 8
      - 9
    assessment:
      date: 2026-09-06
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/templates/domain/template.ts
          note: reusable AAS template per organisation
        - type: code
          ref: apps/main/src/aas/domain/submodel-base/register-submodel-element-classes.ts
          note: full AAS submodel-element type set
        - type: code
          ref: apps/main/src/aas/domain/common/has-semantics.ts
          note: semanticId on every element
        - type: code
          ref: apps/main/src/aas/domain/submodel-base/submodel-element-collection.ts
          note: one collection per substance, component or spare part
        - type: code
          ref: apps/main/src/traceability-events/presentation/traceability-events.controller.ts
          note: opaque EPCIS/UNTP/open-dpp event store
      notes: "Software part: keep substances of concern in the passport and traceable throughout the life cycle. A SubmodelElementCollection per substance with the (a) to (e) attributes is modellable and the passport persists and stays editable across the product's life; no substances-of-concern submodel, semantics or threshold logic exists, and the traceability-events store (opaque EPCIS, UNTP or open-dpp payloads, no query) tracks no substance. Not Gap because the data can be held and kept updated through the ordinary edit path."
      gapIssue: 827
