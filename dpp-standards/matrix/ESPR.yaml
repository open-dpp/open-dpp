  - id: ESPR-Art9(1)
    section: Art9
    clause: Art. 9(1)
    paraphrase: A product may only be placed on the market or put into service if a DPP exists per the delegated act and Arts. 10-11; DPP data must be accurate, complete and up to date.
    applicability: mixed
    areas:
      - 1
      - 6
    operationalisedBy:
      - EN18222
    assessment:
      date: 2026-09-06
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/passports/domain/passport.ts
          note: a passport is an AAS Environment per product
        - type: code
          ref: apps/main/src/digital-product-document/domain/digital-product-document-status.ts
          note: Draft -> Published -> Archived -> Restore
        - type: code
          ref: apps/main/src/passports/presentation/passport.controller.ts
          note: organisation-scoped create and update routes
        - type: code
          ref: apps/main/src/activity-history/domain/change-tracker.ts
          note: activity history of every change
        - type: test
          ref: apps/e2e/tests/passport-identity/publish-freeze.spec.ts
          note: publishing opens the permalink to anonymous visitors
        - type: doc
          ref: docs/guides/passports.md
          note: passport lifecycle
      notes: "Software part: a passport exists before the product is placed on the market and its data can be kept accurate, complete and up to date. Credited: passports are created from templates, published through the Draft -> Published lifecycle, stay editable after publication, and every change is recorded in the activity history. Missing: completeness can only be checked against the delegated act's data model, and open-dpp can neither import nor validate against one (#826); conformity with Art. 10 and 11 is assessed on those rows."
      gapIssue: 826
