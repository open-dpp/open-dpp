criteria:
  - id: ESPR-Art7(2)(b)(i)
    section: Art7
    clause: Art. 7(2)(b)(i)
    paraphrase: Products may have to be accompanied by performance information on Annex I parameters, including a repairability score, durability score, carbon footprint or environmental footprint.
    applicability: software
    areas:
      - 8
    assessment:
      date: 2026-09-06
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/templates/domain/template.ts
          note: reusable AAS template per organisation
        - type: code
          ref: apps/main/src/aas/domain/submodel-base/register-submodel-element-classes.ts
          note: full AAS submodel-element type set
        - type: code
          ref: apps/main/src/aas/domain/common/has-semantics.ts
          note: semanticId on every element
      notes: "Software part: hold performance information (repairability score, durability score, carbon or environmental footprint) in the passport. The generic AAS template carries numeric and text Properties with a semanticId, and the public view renders them; open-dpp ships no ESPR template, no score element and no footprint submodel (only test fixtures name PCF semantic ids). Modellable by hand, not provided."
      gapIssue: 827
  - id: ESPR-Art7(2)(b)(ii)
    section: Art7
    clause: Art. 7(2)(b)(ii)
    paraphrase: Information for customers and other actors on installing, using, maintaining and repairing the product, installing third-party operating systems, collection for refurbishment or remanufacture, and return or end-of-life handling.
    applicability: software
    areas:
      - 8
      - 11
    assessment:
      date: 2026-09-06
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/templates/domain/template.ts
          note: reusable AAS template per organisation
        - type: code
          ref: apps/main/src/aas/domain/submodel-base/register-submodel-element-classes.ts
          note: full AAS submodel-element type set
        - type: code
          ref: apps/main/src/aas/domain/common/has-semantics.ts
          note: semanticId on every element
        - type: code
          ref: apps/main/src/aas/domain/submodel-base/multi-language-property.ts
          note: multilingual text values
        - type: code
          ref: apps/main/src/aas/domain/submodel-base/file.ts
          note: File element for attached documents
        - type: code
          ref: apps/client/src/view/presentation/View.vue
          note: public presentation view
      notes: "Software part: publish customer-facing instructions (installation, use, maintenance, repair, third-party operating systems, collection for refurbishment, return and end-of-life handling). MultiLanguageProperty and File elements carry multilingual text and attached manuals, and the public presentation view shows them to anyone with the link. No instruction structure or semantics ship; the UI chrome is en/de only but the content language is the operator's choice per LanguageText."
      gapIssue: 827
