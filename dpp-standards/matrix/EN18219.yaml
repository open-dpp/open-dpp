  - id: EN18219-6.1
    section: "6.1"
    clause: "6.1"
    paraphrase: Where the law requires them, an economic operator and a facility each have a unique identifier that meets clause 4 and follows one of the four schemes of clause 6. Annex ZA maps 6.1 to ESPR-Art12(1), (2) and (3).
    applicability: mixed
    areas:
      - 3
      - 5
  - id: EN18219-6.2.2(a)
    section: "6.2"
    clause: 6.2.2(a)
    paraphrase: "Scheme 6: ISO/IEC 6523-1:2023 keeps operator identifier schemes apart from one another."
    applicability: software
    areas:
      - 3
  - id: EN18219-6.2.2(b)
    section: "6.2"
    clause: 6.2.2(b)
    paraphrase: "Scheme 6: the identifier comes from a scheme registered under ISO/IEC 6523-2:2025."
    applicability: software
    areas:
      - 3
  - id: EN18219-6.2.2(c)
    section: "6.2"
    clause: 6.2.2(c)
    paraphrase: "Scheme 6: operator and facility identifiers are built and resolved as the registered scheme specifies."
    applicability: software
    areas:
      - 3
  - id: EN18219-6.2.3
    section: "6.2"
    clause: 6.2.3
    paraphrase: "Guideline: where useful, the operator may also encode and resolve the identifier over HTTP per ISO/IEC 18975:2024, or build it as a URL per EN IEC 61406-2:2024."
    applicability: software
    areas:
      - 3
  - id: EN18219-6.3.2(a)
    section: "6.3"
    clause: 6.3.2(a)
    paraphrase: "Scheme 7: operator and facility identifiers use GS1 Application Identifiers or ASC MH10.8.2 Data Identifiers per ISO/IEC 15418:2016."
    applicability: software
    areas:
      - 3
  - id: EN18219-6.3.2(b)
    section: "6.3"
    clause: 6.3.2(b)
    paraphrase: "Scheme 7, with ASC MH10.8.2 Data Identifiers: the identifiers conform to EN IEC 61406-2:2024 (one of three alternatives with (c) and (d))"
    applicability: software
    areas:
      - 3
  - id: EN18219-6.3.2(c)
    section: "6.3"
    clause: 6.3.2(c)
    paraphrase: "Scheme 7, with ASC MH10.8.2 Data Identifiers: the identifiers conform to ISO/IEC 15459-3:2014 and ISO/IEC 18975:2024 and use a scheme registered under ISO/IEC 15459-2:2015 (alternative to (b) and (d))"
    applicability: software
    areas:
      - 3
  - id: EN18219-6.3.2(d)
    section: "6.3"
    clause: 6.3.2(d)
    paraphrase: "Scheme 7, with GS1 Application Identifiers: the identifiers conform to the GS1 General Specifications 25.0 (as ISO/IEC 15459-3 applies) and the GS1 Digital Link URI Syntax 1.6.0 (as ISO/IEC 18975 applies) and use a GS1 scheme registered under ISO/IEC 15459-2:2015."
    applicability: software
    areas:
      - 3
