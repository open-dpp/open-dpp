    section: "5.3"
    clause: 5.3.3(b)
    paraphrase: "Guideline: an EN IEC 61406-2:2024 Identification Link is recommended for full model, batch and item identification that stays semantically interoperable with existing schemes; it can also tell what kind of object it names (product, person, location, document) and carry further data elements or classifications."
