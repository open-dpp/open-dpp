      gapIssue: 825
  - id: EN18219-4.2.2(3)
    section: "4.2"
    clause: 4.2.2(3)
    paraphrase: The identifier stays available even after insolvency, liquidation or cessation of activity (permanence). A note adds that the EU DPP registry gives identifiers of products on the EU market a minimum of preservation and permanence.
    applicability: software
    areas:
      - 3
      - 6
      - 7
    assessment:
      date: 2026-10-12
      commit: dad482466f7c8b760d173b41f2cefab283e9200f
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/passports/domain/registry-export-item.ts
          note: registry upload file with the unique product identifier
        - type: code
          ref: packages/dto/src/branding/branding.dto.ts
          note: "permalinkBaseUrl: an organisation can put its links under its own domain"
        - type: code
          ref: apps/main/src/permalink/application/services/base-url-resolver.service.ts
