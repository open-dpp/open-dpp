# Conformance Matrix: EN18219 (EN 18219:2026). Rules: dpp-standards/README.md.
# Criteria extracted from the final text (English SIS edition, edition 1, git-ignored standards/EN18219-2026.pdf) on 2026-10-12 (ticket #756); assessments are added in place, one per Criterion.
# Gated text: every paraphrase is ours, never a sentence of the standard.
# Clause numbering: the requirements of 4.1.2 to 4.6.2 and the guidelines of 4.3.3 to 4.5.3 are numbered lists, one Criterion per numbered item ("4.1.2(1)"); the scheme requirements of clauses 5 and 6 are lettered lists, one Criterion per lettered item ("5.2.2.1(d)"), as EN 18239 5.2 and EN 18246 4.3 were extracted. A list that offers a choice of one option is one Criterion: 5.4.3 (one of three DID methods) and 6.2.3 (ISO/IEC 18975 or EN IEC 61406-2). Guidelines (may, should) are graded as enablement and never cap a law row (map rule of 2026-10-12).
# Not extracted, no requirement of their own: the Introduction (0.2: the schemes of clauses 5 and 6 are alternatives, each acceptable when its own rules and clause 4 are both met), clause 1 (scope: product, operator and facility identifiers at three granularity levels, from issuing agencies, self-issuing systems or both), 2 (normative references, forms below), 3 (terms; 3.1.25 defines the unique product identifier as a unique string that also gives a web link to the DPP, which Annex ZA cites for ESPR Art. 10(1)(c) and which 4.3.2(2) grades), the principles 4.1.1 to 4.6.1 (intent only; 4.2.1 makes the economic operator responsible for recording and keeping its identifiers, itself or by way of a DPP service provider, and 4.6.1 restates what 4.6.2(2) requires), the scheme descriptions 5.2.1, 5.3.1, 5.4.1, 5.5.1, 5.6.1, 6.2.1, 6.3.1, 6.4.1 and 6.5.1, the example list of 6.2.3 (LEI, ASC DI, GS1 AI and PEPPOL identifiers for operators), the informative Annexes A (choosing the granularity level; A.6 repeats 4.4.2(3)), B and C (overview tables and examples per scheme for products and for operators and facilities) and the Bibliography.
# References (forms decided in #1021, confirmed by this Extract). Read-through, graded on this file's rows: ISO/IEC 646:1991 (through ECMA-6), ISO/IEC 10646:2020 and RFC 3986 (4.3.2(1)); ISO/IEC 15418:2016 (through the GS1 General Specifications 25.0 for AIs 01, 10 and 21, 5.2.2.1(b)); ISO/IEC 15459-2:2015 (through the AIM register of Issuing Agency Codes, version 2026-06-16, where GS1 holds codes 0 to 9, 5.2.2.1(g)). Read later in #1043: GS1 Digital Link URI Syntax 1.6.0, ISO/IEC 18975:2024 and ISO/IEC 15459-3, -4 and -6 (files of their own, the ISO texts after the purchase #1042) and EN IEC 61406-1:2022 (read-through); the rows resting on them stay unassessed: 5.1, 5.2.2.1(a), (c), (d), (f), 5.3.2.1(a) and 5.3.3(a). Gap, unread (alternatives open-dpp does not offer; they never cap a law row): EN IEC 61406-2:2024, ISO/IEC 6523-1:2023 and -2:2025, ISO 26324:2025, W3C DIDs v1.0, DID Resolution v0.3, VC Data Model 2.0, ISO/IEC 15434:2025, DIN 16598:2022 and the GS1 General Specifications for the GS1 operator and facility scheme. Not applicable, unread: ISO/IEC 15961-1:2021, ISO/IEC 17360:2023 and the GS1 EPC Tag Data Standard 2.3 (RFID encoding, the hardware side of an RF alternative) and ISO/IEC 19762:2025 (vocabulary). ISO 3166-1 and ISO 639-1, listed in the ticket as bound in the body, appear only in the informative Annexes B and C (a country-of-origin element in a 2D example, VAT number prefixes) and move down to Not applicable, unread. EN 18220 (undated) is graded by pointing at its rows: 4.5.2(1) waits for them (#757).
# Finding: the text dates the GS1 Digital Link URI Syntax 1.6.0 to 2022 (clause 2 and 5.2.2.1(d)), but GS1 published 1.6.0 on 2025-03-06 and ratified 1.7.0 in August 2026; #1043 reads 1.6.0, the cited edition, and records the delta. The text's footnotes still call EN 18239 and EN 18246 under preparation.
# Annex ZA (informative) maps clauses to ESPR, with presumption of conformity since the OJ citation by Implementing Decision (EU) 2026/1736: Art. 10(1)(a) through 4.1.2, 4.2.2, 4.5.2 and 5.1; 10(1)(c) through 5.1 and 3.1.25; 10(1)(d) through 4.3.2, 4.4.2, 4.5.2 and 4.6.2; 10(1)(f) through 4.4.2; 10(3)(a) through 4.5.2; 11(a) through 4.5.2 and 4.6.2; 11(b) through 4.6.2; 11(d) through 4.4.2; 11(e) through 4.2.2, for the identifier's persistence only; 12(1) to (3) through 6.1. It marks every other point of Art. 10, 11 and 12 not applicable, so this Extract added EN18219 to operationalisedBy of ESPR-Art10(1)(d), 10(3)(a), 11(a), 11(b) and 11(e), and removed it from the Commission rows ESPR-Art12(4)(a), (b) and 12(5)(a) to (e), which the text does not touch. The other law rows naming EN18219 are rows its clauses address without presumption (map rule of 2026-10-09): ESPR-Art9(2)(d) and Annex III (b), (c), (g), (h), (i), (k) and second paragraph (4.4, clauses 5 and 6), BATT-Art13(6)(a), 77(2)-sub1, 77(3)-sub1, 77(3)-sub2 and 77(7)-sub1, REG1778-Art8(3), (4), (5), 8(7)(c) and 9(2)(a).

