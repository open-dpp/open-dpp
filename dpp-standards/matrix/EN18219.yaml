criteria:
  - id: EN18219-4.1.2(1)
    section: "4.1"
    clause: 4.1.2(1)
    paraphrase: An identifier is never used for a second, different object (no reassignment). Annex ZA maps 4.1.2 to ESPR-Art10(1)(a).
    applicability: software
    areas:
      - 3
    assessment:
      date: 2026-10-12
      commit: dad482466f7c8b760d173b41f2cefab283e9200f
      validator: agent:conformance-review
      status: Partial
      evidence:
        - type: code
          ref: apps/main/src/unique-product-identifier/application/services/upi-collection.service.ts
          note: a GS1 identity can be changed or deleted only while its passport is a draft
        - type: code
          ref: apps/main/src/unique-product-identifier/infrastructure/unique-product-identifier.schema.ts
          note: instance-wide unique index on type and canonical value
        - type: code
          ref: apps/main/src/permalink/application/services/permalink.application.service.ts
          note: a published permalink cannot be deleted; its URL is frozen at publication
        - type: code
          ref: apps/main/src/passports/application/services/passport.service.ts
          note: only draft passports can be deleted
        - type: test
          ref: apps/main/src/unique-product-identifier/application/services/upi-collection.service.spec.ts
          note: update and delete on a published passport refused; duplicate key refused
        - type: test
          ref: apps/main/src/unique-product-identifier/infrastructure/unique-product-identifier.repository.spec.ts
          note: duplicate full key rejected by the unique index
        - type: test
          ref: apps/main/src/permalink/domain/permalink.spec.ts
          note: published URL immutable, slug locked once published
        - type: manual
          ref: "Checked 2026-10-12 against an Instance built from dad48246 (worktree, port 3001): the conformance subject's GTIN 04006381333931 and serial went to a second passport under batch B1 (201); once that passport was published, /gs1/v1/01/04006381333931/21/<serial> redirected to the subject's view and /gs1/v1/01/04006381333931/10/B1/21/<serial> to the second passport's view."
          date: 2026-10-12
        - type: check
          ref: identifiers.gs1-identity-unique
          result: passed
          date: 2026-10-12
        - type: check
          ref: identifiers.item-key-single-passport
          result: failed
          date: 2026-10-12
        - type: check
          ref: identifiers.published-identity-locked
          result: passed
          date: 2026-10-12
        - type: check
          ref: identifiers.published-permalink-locked
          result: passed
          date: 2026-10-12
      notes: "Credited: an identifier open-dpp issues is never moved to another passport. A GS1 identity (GTIN with optional batch and serial) is unique across the instance and, once its passport is published, can be neither changed nor deleted; published permalinks keep their frozen URL and can be neither deleted nor re-slugged; published passports cannot be deleted, so nothing frees their identifiers (Checks identifiers.gs1-identity-unique, identifiers.published-identity-locked, identifiers.published-permalink-locked). Before publication a draft's identity can still be edited or deleted and its key reused, but a draft does not resolve (resolver.draft-hidden), so nothing has been issued yet. Missing: the item key (a GTIN with a serial) is not protected as such: the same GTIN and serial can be assigned to a second passport under a batch and then identify that passport as well (manual check, Check identifiers.item-key-single-passport fails; bug #1046). Whether a GTIN is used for another object outside the instance depends on the GS1 allocation the operator follows (4.1.2(2)) (#518)."
      gapIssue: 518
  - id: EN18219-4.1.2(2)
    section: "4.1"
    clause: 4.1.2(2)
    paraphrase: An identifier is unique worldwide within the domain it serves and means one and the same thing in every context it can turn up in (distinct).
    applicability: software
    areas:
      - 3
    assessment:
      date: 2026-10-12
      commit: dad482466f7c8b760d173b41f2cefab283e9200f
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: packages/dto/src/unique-product-identifiers/gs1/gs1-digital-link.ts
          note: normalizeToGtin14 checks digits, length and the mod-10 check digit only
        - type: code
          ref: apps/main/src/unique-product-identifier/infrastructure/unique-product-identifier.schema.ts
          note: uniqueness of the canonical Digital Link path, per instance
        - type: test
          ref: apps/main/src/unique-product-identifier/infrastructure/unique-product-identifier.repository.spec.ts
          note: global uniqueness of a bare GTIN and of a full key within the instance
        - type: manual
          ref: "Checked 2026-10-12 against an Instance built from dad48246 (worktree, port 3001): POST /unique-product-identifiers with GTIN 2001234567893 (GS1 prefix 20, a restricted circulation number) on a draft passport answered 201 and the Digital Link .../01/02001234567893/21/RCN1 (Check identifiers.restricted-gtin-refused fails for the same reason)."
          date: 2026-10-12
        - type: manual
          ref: "Checked 2026-10-12 against an Instance built from dad48246 (worktree, port 3001): the conformance subject's GTIN 04006381333931 and serial went to a second passport under batch B1 (201); once that passport was published, /gs1/v1/01/04006381333931/21/<serial> redirected to the subject's view and /gs1/v1/01/04006381333931/10/B1/21/<serial> to the second passport's view."
          date: 2026-10-12
        - type: check
          ref: identifiers.item-key-single-passport
          result: failed
          date: 2026-10-12
        - type: check
          ref: identifiers.restricted-gtin-refused
          result: failed
          date: 2026-10-12
      notes: "Credited: a GS1 identity is unique within the instance (one canonical value maps to exactly one passport), the GTIN is unique worldwide when the operator takes it from its own GS1 licence, and open-dpp's own identifiers are random UUIDs or instance-unique slugs under the instance's or the operator's domain. Missing: (1) restricted circulation numbers (GS1 prefixes 02, 04 and 20 to 29), which are unique only within a region or a company, pass as GS1 identities (manual check, Check identifiers.restricted-gtin-refused); (2) uniqueness is checked on the whole path, so the same GTIN and serial, which name one item, can go to a second passport under a batch and then resolve to two passports depending on whether the batch is in the link (manual check, Check identifiers.item-key-single-passport); (3) nothing ties a GTIN to the operator's GS1 company prefix, so two organisations or two instances can claim the same key; (4) no operator documentation says that GTINs must come from the operator's own licence (#518; bug #1046 for (1) and (2); the guide itself sits with #828)."
      gapIssue: 518
  - id: EN18219-4.1.2(3)
    section: "4.1"
    clause: 4.1.2(3)
    paraphrase: Once issued, an identifier never identifies another object as well, neither alongside the first nor after it (non-coexistence).
    applicability: software
    areas:
      - 3
    assessment:
      date: 2026-10-12
      commit: dad482466f7c8b760d173b41f2cefab283e9200f
      validator: agent:conformance-review
      status: Partial
      evidence:
        - type: code
          ref: apps/main/src/unique-product-identifier/infrastructure/unique-product-identifier.schema.ts
          note: unique index on the canonical value, which includes the batch
        - type: code
          ref: apps/main/src/unique-product-identifier/application/services/upi-collection.service.ts
          note: identities locked once the passport is published
        - type: test
          ref: apps/main/src/unique-product-identifier/infrastructure/unique-product-identifier.repository.spec.ts
          note: a duplicate full key is rejected; two passports may share a GTIN with different serials
        - type: test
          ref: apps/main/src/unique-product-identifier/application/services/upi-collection.service.spec.ts
          note: update and delete refused on a published passport
        - type: manual
          ref: "Checked 2026-10-12 against an Instance built from dad48246 (worktree, port 3001): the conformance subject's GTIN 04006381333931 and serial went to a second passport under batch B1 (201); once that passport was published, /gs1/v1/01/04006381333931/21/<serial> redirected to the subject's view and /gs1/v1/01/04006381333931/10/B1/21/<serial> to the second passport's view."
          date: 2026-10-12
        - type: check
          ref: identifiers.gs1-identity-unique
          result: passed
          date: 2026-10-12
        - type: check
          ref: identifiers.item-key-single-passport
          result: failed
          date: 2026-10-12
        - type: check
          ref: identifiers.published-identity-locked
          result: passed
          date: 2026-10-12
      notes: "Credited: once issued (the passport is published), an identifier stays with its passport: the identical key cannot be assigned again (Check identifiers.gs1-identity-unique) and the published identity cannot be changed or deleted (Check identifiers.published-identity-locked). Missing: an item key coexists with a second object when the same GTIN and serial are assigned to another passport with a batch added; open-dpp treats the two paths as different identities and the resolver serves both (manual check, Check identifiers.item-key-single-passport fails; bug #1046) (#518)."
      gapIssue: 518
  - id: EN18219-4.1.2(4)
    section: "4.1"
    clause: 4.1.2(4)
    paraphrase: The identification scheme behind an identifier is made known to registries, so that uniqueness holds across domains (cross-domain identification).
    applicability: software
    areas:
      - 3
      - 7
    assessment:
      date: 2026-10-12
      commit: dad482466f7c8b760d173b41f2cefab283e9200f
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/passports/domain/registry-export-item.ts
          note: "the item carries one uniqueProductIdentifier: the published URL of the passport's oldest permalink"
        - type: code
          ref: apps/main/src/passports/domain/registry-export-file.ts
          note: file of up to 100 items, product group fixed to batteries, no scheme field
        - type: test
          ref: apps/main/src/passports/domain/registry-export-item.spec.ts
      notes: "Credited: since the registry export (#579, on main since dad48246) the operator can download, for published passports, registry upload files that carry each passport's unique product identifier. Missing: the file names no identification scheme, so a registry learns the value but not the scheme it follows, and the value is the published URL of the passport's oldest permalink (a heuristic marked temporary in the code), which is the open-dpp /p/ link even when the passport also has a GS1 Digital Link (#518). The upload itself is the operator's manual step."
      gapIssue: 518
  - id: EN18219-4.2.2(1)
    section: "4.2"
    clause: 4.2.2(1)
    paraphrase: Once assigned, the identifier stays unchanged and keeps referring, without ambiguity, to the same object for the object's whole life cycle (consistency). Annex ZA maps 4.2.2 to ESPR-Art10(1)(a) and, for the identifier's persistence only, to ESPR-Art11(e).
    applicability: software
    areas:
      - 3
      - 6
    assessment:
      date: 2026-10-12
      commit: dad482466f7c8b760d173b41f2cefab283e9200f
      validator: agent:conformance-review
      status: Partial
      evidence:
        - type: code
          ref: apps/main/src/permalink/domain/permalink.ts
          note: "withPublishedUrl: the public URL is frozen once and is immutable; slug, base URL and configuration locked"
        - type: code
          ref: apps/main/src/permalink/application/services/permalink.application.service.ts
          note: freezeAllForPassport at publication
        - type: code
          ref: apps/main/src/unique-product-identifier/application/services/upi-collection.service.ts
          note: GS1 identity locked once the passport leaves draft
        - type: test
          ref: apps/main/src/permalink/domain/permalink.spec.ts
          note: frozen URL immutable, slug locked
        - type: test
          ref: apps/e2e/tests/passport-identity/publish-freeze.spec.ts
          note: publishing freezes the public URLs
        - type: test
          ref: apps/main/src/unique-product-identifier/application/services/upi-collection.service.spec.ts
          note: update refused on a published passport
        - type: manual
          ref: "Checked 2026-10-12 against an Instance built from dad48246 (worktree, port 3001): the conformance subject's GTIN 04006381333931 and serial went to a second passport under batch B1 (201); once that passport was published, /gs1/v1/01/04006381333931/21/<serial> redirected to the subject's view and /gs1/v1/01/04006381333931/10/B1/21/<serial> to the second passport's view."
          date: 2026-10-12
        - type: check
          ref: identifiers.item-key-single-passport
          result: failed
          date: 2026-10-12
        - type: check
          ref: identifiers.published-identity-locked
          result: passed
          date: 2026-10-12
        - type: check
          ref: identifiers.published-permalink-locked
          result: passed
          date: 2026-10-12
        - type: check
          ref: identifiers.published-permalink-survives-config-deletion
          result: failed
          date: 2026-10-12
        - type: check
          ref: resolver.percent-in-key-resolves-to-own-passport
          result: failed
          date: 2026-10-12
      notes: "Credited: at publication every permalink's public URL is frozen (later changes to the organisation's or the instance's base URL do not alter it) and the GS1 identity is locked, so the identifier stays the same and keeps resolving to the same passport (Checks identifiers.published-identity-locked, identifiers.published-permalink-locked); archiving and restoring never move it. Missing: the item key does not keep referring to one passport without ambiguity, because the same GTIN and serial can be given to a second passport under a batch, and the link with the batch then opens that passport (bug #1046) (#518). Not graded here: whether the identifier outlives the instance or follows the passport to another platform (4.2.2(3), 4.5.3(2))."
      gapIssue: 518
  - id: EN18219-4.2.2(2)
    section: "4.2"
    clause: 4.2.2(2)
    paraphrase: The identifier is kept at least for its expected lifetime, or as long as applicable law requires (preservation).
    applicability: software
    areas:
      - 3
      - 6
    assessment:
      date: 2026-10-12
      commit: dad482466f7c8b760d173b41f2cefab283e9200f
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/passports/application/services/passport.service.ts
          note: only draft passports can be deleted
        - type: code
          ref: apps/main/src/unique-product-identifier/application/services/upi-collection.service.ts
          note: identities of non-draft passports cannot be deleted
        - type: test
