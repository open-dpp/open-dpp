          result: passed
          date: 2026-10-12
      notes: "Credited: every identifier open-dpp builds itself is 7-bit: GTINs are digits, batch and serial are restricted to GS1 CSET 82 (which uses only invariant characters of ISO/IEC 646, read through ECMA-6), slugs to lower-case letters, digits and hyphens, permalink ids are UUIDs, and base URLs pass the WHATWG URL parser, which turns an internationalised host into punycode and percent-encodes the path. In URIs, batch, serial and data-attribute values are percent-encoded except for the RFC 3986 unreserved characters, which stay as they are (Check identifiers.uris-ascii-rfc3986 with a batch of / & % \" < >). Encoding characters of ISO/IEC 10646 beyond ASCII never arises, because no identifier component admits them. Missing: a base URL (the organisation's, a permalink's own or the instance's) may hold |, ^, [ or ] in its path, which the URL parser leaves unencoded, so permalinks and Digital Links under such a base are no RFC 3986 URIs (manual check; bug #1048) (#518)."
      gapIssue: 518
