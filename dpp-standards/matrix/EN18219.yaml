    applicability: software
    areas:
      - 3
  - id: EN18219-5.2.2.2(a)
    section: "5.2"
    clause: 5.2.2.2(a)
    paraphrase: "Scheme 1, query string: the identifier follows ISO/IEC 15459-4:2014 for individual products and/or ISO/IEC 15459-6:2014 for groupings."
    applicability: software
    areas:
      - 3
  - id: EN18219-5.2.2.2(b)
    section: "5.2"
    clause: 5.2.2.2(b)
    paraphrase: "Scheme 1, query string: the identifier uses ASC MH10.8.2 Data Identifiers as ISO/IEC 15418:2016 defines them."
    applicability: software
