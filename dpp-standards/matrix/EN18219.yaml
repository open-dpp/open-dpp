criteria:
  - id: EN18219-4.1.2(1)
    section: "4.1"
    clause: 4.1.2(1)
    paraphrase: An identifier is never used for a second, different object (no reassignment). Annex ZA maps 4.1.2 to ESPR-Art10(1)(a).
    applicability: software
    areas:
      - 3
  - id: EN18219-4.1.2(2)
    section: "4.1"
    clause: 4.1.2(2)
    paraphrase: An identifier is unique worldwide within the domain it serves and means one and the same thing in every context it can turn up in (distinct).
    applicability: software
    areas:
      - 3
  - id: EN18219-4.1.2(3)
    section: "4.1"
    clause: 4.1.2(3)
    paraphrase: Once issued, an identifier never identifies another object as well, neither alongside the first nor after it (non-coexistence).
    applicability: software
    areas:
      - 3
  - id: EN18219-4.1.2(4)
    section: "4.1"
    clause: 4.1.2(4)
    paraphrase: The identification scheme behind an identifier is made known to registries, so that uniqueness holds across domains (cross-domain identification).
    applicability: software
    areas:
      - 3
      - 7
  - id: EN18219-4.2.2(1)
    section: "4.2"
    clause: 4.2.2(1)
    paraphrase: Once assigned, the identifier stays unchanged and keeps referring, without ambiguity, to the same object for the object's whole life cycle (consistency). Annex ZA maps 4.2.2 to ESPR-Art10(1)(a) and, for the identifier's persistence only, to ESPR-Art11(e).
    applicability: software
    areas:
      - 3
      - 6
  - id: EN18219-4.2.2(2)
    section: "4.2"
    clause: 4.2.2(2)
    paraphrase: The identifier is kept at least for its expected lifetime, or as long as applicable law requires (preservation).
    applicability: software
    areas:
      - 3
      - 6
  - id: EN18219-4.2.2(3)
    section: "4.2"
    clause: 4.2.2(3)
    paraphrase: The identifier stays available even after insolvency, liquidation or cessation of activity (permanence). A note adds that the EU DPP registry gives identifiers of products on the EU market a minimum of preservation and permanence.
    applicability: software
    areas:
      - 3
      - 6
      - 7
  - id: EN18219-4.3.2(1)
    section: "4.3"
    clause: 4.3.2(1)
    paraphrase: The identifier is made only of characters of ISO/IEC 646:1991; used as a URI it follows RFC 3986, leaving unreserved characters as they are and percent-encoding every other ISO/IEC 10646 character (character set). Annex ZA maps 4.3.2 to ESPR-Art10(1)(d).
    applicability: software
    areas:
      - 3
  - id: EN18219-4.3.2(2)
    section: "4.3"
    clause: 4.3.2(2)
    paraphrase: The unique product identifier is a URL, or becomes one through a conversion method the chosen scheme specifies, so that web systems can use it (web use).
    applicability: software
    areas:
      - 3
      - 11
  - id: EN18219-4.3.3(1)
    section: "4.3"
    clause: 4.3.3(1)
    paraphrase: "Guideline: the identifier may follow a structure its scheme defines, which makes it easier for other systems to parse and recognise (structure)."
    applicability: software
    areas:
      - 3
  - id: EN18219-4.3.3(2)
    section: "4.3"
    clause: 4.3.3(2)
    paraphrase: "Guideline: identifiers may vary in length (variable length)."
    applicability: software
    areas:
      - 3
  - id: EN18219-4.4.2(1)
    section: "4.4"
    clause: 4.4.2(1)
    paraphrase: "Each product identifier is unique at least at the finest level it serves: model, batch or item (granularity). Annex ZA maps 4.4.2 to ESPR-Art10(1)(d), 10(1)(f) and 11(d)."
    applicability: software
    areas:
      - 3
  - id: EN18219-4.4.2(2)
    section: "4.4"
    clause: 4.4.2(2)
    paraphrase: Once the product is on the market or in service, its identifier keeps the granularity level it had (granularity consistency).
    applicability: software
    areas:
      - 3
  - id: EN18219-4.4.2(3)
    section: "4.4"
    clause: 4.4.2(3)
    paraphrase: If the level has to change and the existing identifier cannot express it, a new or extended identifier is assigned and linked to the old one, so traceability is kept (change in granularity).
    applicability: software
    areas:
      - 3
      - 9
  - id: EN18219-4.4.3(1)
    section: "4.4"
    clause: 4.4.3(1)
    paraphrase: "Guideline: where the law leaves the level open (model, batch or item), the operator may pick a finer one than required, for traceability or operational needs (granularity level)."
    applicability: software
    areas:
      - 3
  - id: EN18219-4.4.3(2)
    section: "4.4"
    clause: 4.4.3(2)
    paraphrase: "Guideline: a resolver may be used to resolve the identifier (resolver)."
    applicability: software
    areas:
      - 3
      - 11
  - id: EN18219-4.4.3(3)
    section: "4.4"
    clause: 4.4.3(3)
    paraphrase: "Guideline: one hierarchical identifier format may express several levels at once, such as model, batch and item (hierarchy)."
    applicability: software
    areas:
      - 3
  - id: EN18219-4.5.2(1)
    section: "4.5"
    clause: 4.5.2(1)
    paraphrase: The unique product identifier can be read from a data carrier as EN 18220 specifies it, which ties the identifier to the DPP (data carrier). Annex ZA maps 4.5.2 to ESPR-Art10(1)(a), 10(1)(d), 10(3)(a) and 11(a).
    applicability: software
    areas:
      - 3
      - 4
  - id: EN18219-4.5.2(2)
    section: "4.5"
    clause: 4.5.2(2)
    paraphrase: Retailers and online marketplaces are given the unique product identifier so that consumers can reach the product's DPP through them (digital access).
    applicability: mixed
    areas:
      - 3
      - 11
  - id: EN18219-4.5.2(3)
    section: "4.5"
    clause: 4.5.2(3)
    paraphrase: "The unique product identifier is encoded in a syntax that external devices handle: professional scanners, smartphones and similar consumer devices (compatibility)."
    applicability: software
    areas:
      - 3
      - 4
  - id: EN18219-4.5.2(4)
    section: "4.5"
    clause: 4.5.2(4)
    paraphrase: Wherever possible, identifiers of existing schemes can be used inside one of the schemes of this document (existing ID).
    applicability: software
    areas:
      - 3
  - id: EN18219-4.5.3(1)
    section: "4.5"
    clause: 4.5.3(1)
    paraphrase: "Guideline: the unique product identifier works without further steps on today's phones and comparable consumer devices, across the major operating systems and browsers (smartphones and similar devices)."
    applicability: software
    areas:
      - 3
      - 4
      - 11
  - id: EN18219-4.5.3(2)
    section: "4.5"
    clause: 4.5.3(2)
    paraphrase: "Guideline: the identifier scheme serves the intended systems, services, platforms and third parties without the identifier losing its meaning or function (portability)."
    applicability: software
    areas:
      - 3
      - 2
  - id: EN18219-4.6.2(1)
    section: "4.6"
    clause: 4.6.2(1)
    paraphrase: The scheme and the identifier rest on a system whose policies, processes and standards anyone can study, influence and use on fair, reasonable and non-discriminatory terms (transparency). Annex ZA maps 4.6.2 to ESPR-Art10(1)(d), 11(a) and 11(b).
    applicability: software
    areas:
      - 3
  - id: EN18219-4.6.2(2)
    section: "4.6"
    clause: 4.6.2(2)
    paraphrase: For public information, consumers above all, the identifier works without registering, installing DPP-specific software or giving credentials (consumer usage).
    applicability: software
    areas:
      - 3
      - 5
      - 11
  - id: EN18219-4.6.2(3)
    section: "4.6"
    clause: 4.6.2(3)
    paraphrase: The identifier creates no vendor lock-in and limits its use only where global uniqueness and interoperability technically require it (no undue restrictions).
    applicability: software
    areas:
      - 3
      - 2
  - id: EN18219-5.1
    section: "5.1"
    clause: "5.1"
    paraphrase: A product has a unique product identifier that meets clause 4 and follows one of the five product schemes of clause 5. Annex ZA maps 5.1 to ESPR-Art10(1)(a) and 10(1)(c).
    applicability: software
    areas:
      - 3
  - id: EN18219-5.2.2.1(a)
    section: "5.2"
    clause: 5.2.2.1(a)
    paraphrase: "Scheme 1, structured path: the identifier follows ISO/IEC 15459-4:2014 for individual products or ISO/IEC 15459-6:2014 for groupings."
    applicability: software
    areas:
      - 3
  - id: EN18219-5.2.2.1(b)
    section: "5.2"
    clause: 5.2.2.1(b)
    paraphrase: "Scheme 1, structured path: the identifier uses GS1 Application Identifiers or ASC MH10.8.2 Data Identifiers as ISO/IEC 15418:2016 defines them."
    applicability: software
    areas:
      - 3
  - id: EN18219-5.2.2.1(c)
    section: "5.2"
    clause: 5.2.2.1(c)
    paraphrase: "Scheme 1, structured path: the identifier is encoded and resolved over HTTPS by the structured path approach of ISO/IEC 18975:2024."
    applicability: software
    areas:
      - 3
      - 11
  - id: EN18219-5.2.2.1(d)
    section: "5.2"
    clause: 5.2.2.1(d)
    paraphrase: "Scheme 1, structured path, with GS1 Application Identifiers: the identifier conforms to the GS1 Digital Link URI Syntax 1.6.0 (dated 2022 in the text)."
    applicability: software
    areas:
      - 3
  - id: EN18219-5.2.2.1(e)
    section: "5.2"
    clause: 5.2.2.1(e)
    paraphrase: "Scheme 1, structured path, with ASC MH10.8.2 Data Identifiers: the identifier conforms to EN IEC 61406-2:2024 or ISO/IEC 18975:2024."
    applicability: software
    areas:
      - 3
  - id: EN18219-5.2.2.1(f)
    section: "5.2"
    clause: 5.2.2.1(f)
    paraphrase: "Scheme 1, structured path: global uniqueness follows ISO/IEC 15459-3:2014."
    applicability: software
    areas:
      - 3
  - id: EN18219-5.2.2.1(g)
    section: "5.2"
    clause: 5.2.2.1(g)
