      - 3
  - id: EN18219-5.2.2.2(c)
    section: "5.2"
    clause: 5.2.2.2(c)
    paraphrase: "Scheme 1, query string: the identifier is encoded and resolved over HTTPS by the query approach of ISO/IEC 18975:2024."
    applicability: software
    areas:
      - 3
      - 11
  - id: EN18219-5.2.2.2(d)
    section: "5.2"
    clause: 5.2.2.2(d)
    paraphrase: "Scheme 1, query string: global uniqueness follows ISO/IEC 15459-3:2014."
    applicability: software
    areas:
      - 3
  - id: EN18219-5.2.2.2(e)
    section: "5.2"
    clause: 5.2.2.2(e)
    paraphrase: "Scheme 1, query string: the identifier uses an Issuing Agency Code registered under ISO/IEC 15459-2:2015."
    applicability: software
    areas:
      - 3
  - id: EN18219-5.3.2.1(a)
    section: "5.3"
    clause: 5.3.2.1(a)
    paraphrase: "Scheme 2, items only: where a unique character string is enough and nothing about syntax or meaning has to be encoded, the identifier follows EN IEC 61406-1:2022, optionally with EN IEC 61406-2:2024."
    applicability: software
    areas:
      - 3
  - id: EN18219-5.3.2.2(a)
    section: "5.3"
    clause: 5.3.2.2(a)
    paraphrase: "Scheme 2, model, batch and item: where standardised syntax and meaning have to be encoded, the identifier follows EN IEC 61406-1:2022 together with EN IEC 61406-2:2024."
    applicability: software
    areas:
      - 3
  - id: EN18219-5.3.2.2(b)
    section: "5.3"
    clause: 5.3.2.2(b)
    paraphrase: "Scheme 2, model, batch and item: the identifier carries ASC MH10.8.2 Data Identifiers per ISO/IEC 15418:2016 to state model, batch and item."
    applicability: software
    areas:
      - 3
  - id: EN18219-5.3.3(a)
    section: "5.3"
    clause: 5.3.3(a)
    paraphrase: "Guideline: an EN IEC 61406-1:2022 Identification Link is recommended where the string has to stay short (a 96-bit RFID chip, a compact 2D code on a small product), or where model and serial number are to be hidden behind a random alphanumeric string so that serial numbers cannot be enumerated."
