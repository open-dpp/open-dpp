          result: passed
          date: 2026-10-12
      notes: Arrays are emitted from JavaScript arrays (lists of submodels, elements, pages of results); order carries meaning only where the API defines it (pagination, element order).
  - id: ISO21778-8
    section: "4-9"
    clause: "8"
    paraphrase: "A number is decimal digits without a superfluous leading zero, optionally signed with a minus, with an optional fraction and an optional exponent (e or E, optional sign); values such as Infinity and NaN that digits cannot express are not allowed."
    applicability: software
    areas:
      - 2
    assessment:
      date: 2026-10-11
      commit: ea05ef20dbe4eaab478330f40ec32ff52081d83a
      validator: agent:conformance-review
      status: Met
      operational: false
      evidence:
        - type: code
          ref: apps/main/src/permalink/presentation/permalink.controller.ts
          note: returns DTO objects that Express serialises with res.json (JSON.stringify)
        - type: code
          ref: apps/main/src/body-handler.ts
          note: parses request bodies with express.json, which uses JSON.parse
        - type: code
          ref: packages/dto/src/aas/submodel-base/property-json-schema.ts
          note: property values travel as strings
        - type: manual
          ref: "Against an Instance built from ea05ef20 (port 3001), on a published audit passport of the conformance organisation (permalink eb36457f, built through the API before the Check subject got its content) with a content submodel (text, number, boolean, date and link properties, multilingual text, a PNG image, a PDF, a collection, a list, a range): the anonymous permalink bundle, shells, submodels, one submodel and its elements parsed with JSON.parse (the ECMA-404 grammar) without error."
          date: 2026-10-11
        - type: check
          ref: format.public-reads-are-json
          result: passed
          date: 2026-10-12
      notes: Numbers are emitted by JSON.stringify in the decimal grammar, never as NaN or Infinity. Passport values are carried as strings (Property values, Range bounds), so a decimal keeps its digits; numeric types are validated before storage (z.coerce.number, property.spec.ts).
  - id: ISO21778-9
    section: "4-9"
    clause: "9"
    paraphrase: "A string is code points between quotation marks; the quotation mark, the reverse solidus and the control characters U+0000 to U+001F are escaped (two-character escapes or \\u followed by four hex digits, surrogate pairs for code points beyond the Basic Multilingual Plane)."
