# Conformance Matrix: ISO21778 (ISO/IEC 21778:2017, the JSON data interchange syntax). Rules: dpp-standards/README.md.
# Criteria extracted on 2026-10-11 (ticket #761) from the free ECMA-404 2nd edition (December 2017), the text ISO/IEC 21778:2017 adopts with identical clause numbering; assessments are added in place, one per Criterion.
# Normative reference of EN 18216 (clause 5(a): JSON is the format for syntactic interoperability). The text defines syntax only; meaning, name uniqueness and member order are left to the specifications that use JSON.
# How a clause binds open-dpp: clause 2 states the two conformance targets, a JSON text and a processor of JSON texts. Clauses 4 to 9 are the grammar a conforming text follows; each is one Criterion on the JSON open-dpp emits (API responses, the passport export) and, through 2(2), on the JSON it accepts (request bodies, the passport import).
# Not extracted, no requirement of their own: clause 1 (scope: syntax only, no semantics or language mapping), 3 (normative references: ISO/IEC 10646, the Unicode Standard, RFC 8259, whose semantic restrictions are not normative here), the figures (railroad diagrams of clauses 5 to 9) and the Bibliography (ECMA-262, RFC 8259).
standard: ISO21778
edition: ISO/IEC 21778:2017 (ECMA-404 2nd edition, December 2017)
extractedFrom: https://ecma-international.org/wp-content/uploads/ECMA-404_2nd_edition_december_2017.pdf
extractedAt: 2026-10-11
sections:
  - id: "2"
    title: 2 Conformance
  - id: "4-9"
    title: 4 to 9 JSON text, values, objects, arrays, numbers, strings
criteria:
  - id: ISO21778-2(1)
    section: "2"
    clause: 2, first paragraph
    paraphrase: "A JSON text is a sequence of Unicode code points that follows the JSON grammar of this text exactly; every JSON document open-dpp emits is such a text."
    applicability: software
    areas:
      - 1
      - 2
    assessment:
      date: 2026-10-11
      commit: ea05ef20dbe4eaab478330f40ec32ff52081d83a
      validator: agent:conformance-review
      status: Met
      operational: false
      evidence:
        - type: code
          ref: apps/main/src/permalink/presentation/permalink.controller.ts
          note: returns DTO objects that Express serialises with res.json (JSON.stringify)
        - type: test
          ref: apps/main/src/permalink/presentation/permalink.controller.spec.ts
          note: bundle by UUID and slug, shells, submodels, submodel elements and values parsed as JSON
        - type: manual
          ref: "Against an Instance built from ea05ef20 (port 3001), on a published audit passport of the conformance organisation (permalink eb36457f, built through the API before the Check subject got its content) with a content submodel (text, number, boolean, date and link properties, multilingual text, a PNG image, a PDF, a collection, a list, a range): the anonymous permalink bundle, shells, submodels, one submodel and its elements parsed with JSON.parse (the ECMA-404 grammar) without error."
          date: 2026-10-11
        - type: check
          ref: format.public-reads-are-json
          result: passed
          date: 2026-10-12
      notes: Every response labelled application/json is produced by JSON.stringify, whose output follows the grammar by construction (structural tokens, escaped strings, finite numbers; NaN and Infinity become null). Check format.public-reads-are-json parses the public reads strictly. Request bodies, the export and the import use the same serialiser. A value-only route that does not answer JSON is EN18216-5(a)'s finding, not a malformed JSON text.
  - id: ISO21778-2(2)
    section: "2"
    clause: 2, second paragraph
    paraphrase: "Recommendation: a processor of JSON texts refuses input that is not a conforming JSON text; it may narrow the conforming texts it processes by semantic restrictions of its own."
    applicability: software
    areas:
      - 1
      - 2
    assessment:
      date: 2026-10-11
      commit: ea05ef20dbe4eaab478330f40ec32ff52081d83a
      validator: agent:conformance-review
      status: Met
      operational: false
      evidence:
        - type: code
          ref: apps/main/src/body-handler.ts
          note: express.json (JSON.parse) on every route except the unversioned /api/auth routes (the versioned ones are parsed too); malformed input answers 400 Invalid JSON payload; top level object or array except on /$value
        - type: code
          ref: apps/main/src/bulk-import/domain/json-parser.ts
          note: bulk import parses JSON with JSON.parse and requires an array of objects
        - type: test
          ref: apps/main/src/body-handler.spec.ts
          note: rejects malformed JSON with Invalid JSON payload; rejects a bare scalar body outside /$value
        - type: test
          ref: apps/main/src/bulk-import/domain/json-parser.spec.ts
          note: throws for malformed JSON
        - type: check
          ref: format.malformed-json-refused
          result: passed
          date: 2026-10-12
      notes: "Recommendation, met: request bodies go through JSON.parse, which refuses anything outside the grammar (trailing commas, NaN, single quotes, unescaped control characters); the API answers 400 (Check format.malformed-json-refused). The semantic restrictions the clause allows are applied: a top-level object or array except on value routes, size limits (OPEN_DPP_JSON_LIMIT_DEFAULT, 10 MB), and the Zod schema of each route."
  - id: ISO21778-4
    section: "4-9"
    clause: "4"
    paraphrase: "A JSON text is a sequence of tokens (the six structural characters, strings, numbers and the literal names true, false and null) forming one value; whitespace (tab, line feed, carriage return, space) may surround tokens but never splits one, except spaces inside strings."
    applicability: software
    areas:
      - 2
    assessment:
      date: 2026-10-11
      commit: ea05ef20dbe4eaab478330f40ec32ff52081d83a
      validator: agent:conformance-review
      status: Met
      operational: false
      evidence:
        - type: code
          ref: apps/main/src/permalink/presentation/permalink.controller.ts
          note: returns DTO objects that Express serialises with res.json (JSON.stringify)
        - type: code
          ref: apps/main/src/body-handler.ts
          note: parses request bodies with express.json, which uses JSON.parse
        - type: manual
          ref: "Against an Instance built from ea05ef20 (port 3001), on a published audit passport of the conformance organisation (permalink eb36457f, built through the API before the Check subject got its content) with a content submodel (text, number, boolean, date and link properties, multilingual text, a PNG image, a PDF, a collection, a list, a range): the anonymous permalink bundle, shells, submodels, one submodel and its elements parsed with JSON.parse (the ECMA-404 grammar) without error."
          date: 2026-10-11
        - type: check
          ref: format.public-reads-are-json
          result: passed
          date: 2026-10-12
      notes: Emitted texts carry no insignificant whitespace (JSON.stringify without indentation); parsing accepts whitespace around tokens only, as JSON.parse implements the grammar.
  - id: ISO21778-5
    section: "4-9"
    clause: "5"
    paraphrase: "A JSON value is an object, an array, a number, a string, or one of true, false and null; nothing else."
    applicability: software
    areas:
      - 2
    assessment:
      date: 2026-10-11
      commit: ea05ef20dbe4eaab478330f40ec32ff52081d83a
      validator: agent:conformance-review
      status: Met
      operational: false
      evidence:
        - type: code
          ref: apps/main/src/permalink/presentation/permalink.controller.ts
          note: returns DTO objects that Express serialises with res.json (JSON.stringify)
        - type: code
          ref: apps/main/src/body-handler.ts
          note: parses request bodies with express.json, which uses JSON.parse
        - type: manual
          ref: "Against an Instance built from ea05ef20 (port 3001), on a published audit passport of the conformance organisation (permalink eb36457f, built through the API before the Check subject got its content) with a content submodel (text, number, boolean, date and link properties, multilingual text, a PNG image, a PDF, a collection, a list, a range): the anonymous permalink bundle, shells, submodels, one submodel and its elements parsed with JSON.parse (the ECMA-404 grammar) without error."
          date: 2026-10-11
        - type: check
          ref: format.public-reads-are-json
          result: passed
          date: 2026-10-12
      notes: Only objects, arrays, numbers, strings, true, false and null are emitted; undefined members are dropped and non-finite numbers become null by JSON.stringify.
  - id: ISO21778-6
    section: "4-9"
    clause: "6"
    paraphrase: "An object is a pair of curly brackets around zero or more name/value pairs, each name a string followed by a colon and its value, pairs separated by commas; the syntax neither requires unique names nor gives the order of pairs a meaning."
    applicability: software
    areas:
      - 2
    assessment:
      date: 2026-10-11
      commit: ea05ef20dbe4eaab478330f40ec32ff52081d83a
      validator: agent:conformance-review
      status: Met
      operational: false
      evidence:
        - type: code
          ref: apps/main/src/permalink/presentation/permalink.controller.ts
          note: returns DTO objects that Express serialises with res.json (JSON.stringify)
        - type: code
          ref: apps/main/src/body-handler.ts
          note: parses request bodies with express.json, which uses JSON.parse
        - type: manual
          ref: "Against an Instance built from ea05ef20 (port 3001), on a published audit passport of the conformance organisation (permalink eb36457f, built through the API before the Check subject got its content) with a content submodel (text, number, boolean, date and link properties, multilingual text, a PNG image, a PDF, a collection, a list, a range): the anonymous permalink bundle, shells, submodels, one submodel and its elements parsed with JSON.parse (the ECMA-404 grammar) without error."
          date: 2026-10-11
        - type: check
          ref: format.public-reads-are-json
          result: passed
          date: 2026-10-12
      notes: Objects are emitted from JavaScript objects, so member names are strings and unique. On input, duplicate names are accepted (the last wins), which the syntax permits.
  - id: ISO21778-7
    section: "4-9"
    clause: "7"
    paraphrase: "An array is a pair of square brackets around zero or more values separated by commas; the syntax gives the order of values no meaning."
