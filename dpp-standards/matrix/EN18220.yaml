# Conformance Matrix: EN18220 (EN 18220:2026). Rules: dpp-standards/README.md.
# Criteria extracted from the final text (English SIS edition, edition 1, git-ignored standards/EN18220-2026.pdf) on 2026-10-12 (ticket #757); assessments are added in place, one per Criterion.
# Gated text: every paraphrase is ours, never a sentence of the standard.
# Clause numbering: one Criterion per paragraph that carries a requirement (shall, should or may), as EN 18246 was extracted. A clause of one paragraph keeps its bare number ("5.6.1"); in a clause of several paragraphs the paragraphs are numbered as the PDF sets them apart ("5.4.5(2)"), and those without a requirement keep their number and are listed below. A paragraph holding two requirements gets "-sub1" and "-sub2": 5.2.1 (the identifier in the carrier; the scheme's rules), 5.2.3 (character sets of the identifier; of other data), 5.3.4 (access without registration; a decoder built into the device), 5.7.1 (recognisable presence; placement) and 5.7.4 (accessibility of the carrier; of both digital and physical interaction). The capability rows of Table 1 (6.2.4.1) and Table 2 (6.3.6) are one Criterion each. Three statements without a modal verb are Criteria as well: 4.2 and 5.7.2, because Annex ZA cites them, and 5.4.1, which names the only marking methods allowed. Optional and recommended clauses and these statements are graded as enablement and never cap a law row (map rule of 2026-10-12).
# Not extracted, no requirement of their own: the Introduction, clauses 1 (scope: symbology, format, error correction, encoding, print and production quality, durability, recognition marks, placement; architecture, use cases and cryptographic features are outside it), 2 (normative references, forms below), 3 (terms; 3.1 additional software leaves out web browsers, QR scanning by a phone's camera app and the common internet protocols, as in EN 18246), 4.3.3 (who reads carriers and with which devices), 5.2.2 (the syntaxes are those of EN 18219, with examples in Annex A; Annex ZA cites it for ESPR Art. 10(1)(a), graded through 5.2.1-sub2), 5.3.1 to 5.3.3 (reading distances and processes for barcodes, NFC and RAIN RFID; Annex ZA cites 5.3 as a whole, graded through 5.3.4), 5.4.2, 5.4.3 and 5.4.6 (the methods described: direct marking, packaging, embedding; 5.4.3 asks to weigh persistence without a modal verb, which 5.4.1 carries), 5.4.4(1), 5.5.1 (what error correction does; no level is required), 5.5.2(1) (the factors that set a symbol's size), 5.6.2(2), (3) and (5) (the usual print grade 1.5/80 %/660 and industry standards), 5.6.4(2) (product-specific RFID standards, tyres for instance), 6.1(1) and (3), 6.2.1, the descriptive sentences of 6.2.2 and 6.2.3, 6.3.1, 6.3.2.2, 6.3.2.5 and 6.3.3.4 (test methods described, nothing required), 6.3.3.1, 6.3.4.1, 6.3.5 (the RFID privacy impact assessment of EN 16571, described), the informative Annexes A (syntax examples), B (examples and size tables per EN 18219 scheme; B.1 says with "shall" what 5.2.1 and EN18219-4.5.2(1) already require, and an informative annex adds no requirement) and C (implicit and explicit recognition of a DPP carrier, the IEC 61406 frame) and the Bibliography.
# Mirror: 5.3.4-sub1 restates EN18219-4.6.2(2) (public DPP information reachable through the identifier without registering, DPP-specific software or credentials) with no delta and carries no Assessment of its own. 5.3.4-sub2 is no Mirror of EN18219-4.5.3(1): it asks for a decoder of the carrier that comes with the device's operating system, not for an identifier that works on phones.
# References (forms decided in #1021, confirmed by this Extract). Read-through, graded on this file's rows: ISO/IEC 18004:2024 (QR Code), through the text's own restatement (the notes of Annexes A to C ask for a quiet zone of four modules; Annex B lists the error-correction levels L, M, Q and H with their module counts) and the Checks carriers.qr-decodes-to-passport-link and carriers.qr-quiet-zone-four-modules; not bought, because no Met rests on its own text. Gap, unread: ISO/IEC 16022:2024 (Data Matrix, 6.2.2, #489), an alternative open-dpp does not offer, which never caps a law row. Not applicable, unread: the RF air interfaces, tag data and test methods ISO/IEC 14443-1 to -4, ISO/IEC 15693-1 to -3, ISO/IEC 18000-3, ISO/IEC 18000-63, ISO/IEC 18046-1 to -3, ISO/IEC 18047-63, ISO/IEC 18092, ISO/IEC 21481, ISO/IEC 15961-2, ISO/IEC 15962 and the GS1 EPC Tag Data Standard 2.3 (the hardware of an RF alternative: tags, readers and what is written to them are the operator's equipment); ISO/IEC 15693-3:2019, which the text dates, was withdrawn on 2026-05-07 and replaced by the 2026 edition; the print-quality methods ISO/IEC 15415:2024, ISO/IEC 15426-2:2023 and ISO/IEC 29158 (undated); the vocabulary ISO/IEC 19762:2025. EN 18219 (undated) is graded by pointing at its rows. Named in the body but listed only in the Bibliography, so no normative reference: ISO/IEC 8859-1 and ISO/IEC 646 (characters for other data, 5.2.3-sub2: Gap with the feature it constrains, unread), ISO 1073-2 (OCR-B, an example font in 5.7.2), ISO 7000 and IEC 60417 (5.7.3(2): Gap with the optional marking, unread), ISO 19809 and EN 301 549 V3.2.1 (5.7.4, examples to take into account: the physical side is the operator's, the digital side is graded by pointing at the clause 9 rows of the EN301549 file, the same V3.2.1, run 2026-10-11-en18216+en301549+iso21778), EN 16571 and the NFC Forum specifications (RF, Not applicable). ISO/IEC 18975, ISO/IEC 15459-2, -3 and -6 and EN IEC 61406-1 and -2 appear only in the informative annexes and the Bibliography; EN 18219 reads them (#1043).
# Finding: the footnotes of the text still call EN 18239 and EN 18246 under preparation, as in EN 18219.
# Annex ZA (informative) maps clauses to ESPR, with presumption of conformity since the OJ citation by Implementing Decision (EU) 2026/1736: Art. 9(2)(b) through 5.1; 9(2)(d) through 4.2, 6.1 and 6.2.4; 10(1)(a) through 5.2.1 and 5.2.2; 10(1)(b) through 5.4, 5.7.1 and 5.7.2; 10(1)(c) through 5.2 and 5.3; 10(1)(g) through 4.2, for access by way of a data carrier only; 12(6)(a) to (c) through 5.2.1. The mandatory clauses among them, which cap the law rows: 5.1, 5.2.1-sub1, 5.2.1-sub2, 5.2.3-sub1, 5.4.5(2), 6.1(2) and 6.2.4.1, and 5.3.4-sub1 through its EN 18219 target. This Extract added EN18220 to operationalisedBy of ESPR-Art9(2)(d), 10(1)(g) and 12(6)(a) to (c), the last three Commission rows and Not applicable by rule all the same. The other law rows naming EN18220 are rows its clauses address without presumption (map rule of 2026-10-09): ESPR-Art9(2)(c) (5.7.1, placement), 9(2)(e) and 10(3)(a) (5.4.5, the carrier in digital documents such as a shop page), Annex III second paragraph (6.2.4.1, encoding an ISO/IEC 15459 identifier) and BATT-Art13(6), 13(6)(a), 13(6)(b), 77(3)-sub1 and 77(3)-sub2 (6.2.3, the QR Code; Annex ZA covers ESPR only).

