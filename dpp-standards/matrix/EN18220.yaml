  - id: EN18220-5.2.3-sub1
    section: "5.2"
    clause: 5.2.3, first sentence
    paraphrase: "The carrier supports the character sets that the identifier schemes of EN 18219 require."
    applicability: software
    areas:
      - 4
      - 3
    assessment:
      date: 2026-10-12
      commit: dad482466f7c8b760d173b41f2cefab283e9200f
      validator: agent:conformance-review
      operational: false
      status: Met
      evidence:
        - type: code
          ref: apps/client/src/components/QrCode.vue
          note: toCanvas from qrcode 1.5.4 with margin 1; error correction left at the library default M; canvas only
        - type: code
          ref: packages/dto/src/unique-product-identifiers/gs1/gs1-digital-link.ts
          note: "uncompressed canonical Digital Link: GTIN-14, AI 10 and 21 in the path, type-D data attributes in the query, RFC 3986 percent-encoding"
        - type: code
          ref: packages/dto/src/shared/permalink-base-url.schema.ts
          note: "base URLs canonicalised by the URL parser: punycode host, percent-encoded path"
        - type: test
          ref: packages/dto/src/unique-product-identifiers/gs1/gs1-digital-link.spec.ts
        - type: check
          ref: carriers.qr-decodes-to-passport-link
          result: passed
          date: 2026-10-12
      notes: "The schemes of EN 18219 need 7-bit characters (EN18219-4.3.2(1)), and every identifier open-dpp writes into the code is 7-bit: digits for the GTIN, CSET 82 percent-encoded for batch and serial, lower-case letters, digits and hyphens for slugs, UUIDs, ASCII base URLs. The QR Code takes them in byte mode (qrcode writes UTF-8 without an ECI, the same bytes for 7-bit text), and the decoder returns each URL unchanged (Check carriers.qr-decodes-to-passport-link). That a base URL may keep | ^ [ ] raw is a syntax matter of the identifier (EN18219-4.3.2(1), bug #1048), not of the carrier's character set."
