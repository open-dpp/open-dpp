criteria:
  - id: EN18220-4.1
    section: "4"
    clause: "4.1"
    paraphrase: "Option: when the identifier's online lookup is briefly unavailable and the carrier has room for it (space in a barcode, memory in an RFID tag), further information may be held in the carrier itself."
    applicability: software
    areas:
      - 4
  - id: EN18220-4.2
    section: "4"
    clause: "4.2"
    paraphrase: "Statement: the text sets the basic rules for carriers that identify products at model, batch or item level; which level and which carriers a product group uses is for further legislation. Annex ZA maps 4.2 to ESPR-Art9(2)(d) and, for access by way of a carrier only, to ESPR-Art10(1)(g)."
    applicability: software
    areas:
      - 4
      - 3
  - id: EN18220-4.3.1
    section: "4"
    clause: "4.3.1"
    paraphrase: "Recommendation: a carrier stays usable through repeated use, resale, reuse and repair, which depends on how durable the surface it sits on is; where a new passport is needed, a new identifier and carrier follow."
    applicability: operator
    areas:
      - 4
  - id: EN18220-4.3.2
    section: "4"
    clause: "4.3.2"
    paraphrase: "Recommendation: the carrier specification for a product group's DPP takes account of the identifiers and carriers the group already uses, with their industry production specifications (module size, print grade and position, tag frequency or memory), so that a DPP need not bring a new carrier."
    applicability: commission
    areas:
      - 4
  - id: EN18220-5.1
    section: "5.1"
    clause: "5.1"
    paraphrase: "Each product item carries one data carrier or more, physically on the product itself, on its packaging or on the documents that come with it, made as this text specifies. Annex ZA maps 5.1 to ESPR-Art9(2)(b)."
    applicability: mixed
    areas:
      - 4
  - id: EN18220-5.2.1-sub1
    section: "5.2"
    clause: 5.2.1, first sentence
    paraphrase: "The data carrier encodes a unique product identifier through which the DPP can be reached. Annex ZA maps 5.2.1 to ESPR-Art10(1)(a) and 12(6)(a) to (c), and 5.2 to ESPR-Art10(1)(c)."
    applicability: software
    areas:
      - 4
      - 3
  - id: EN18220-5.2.1-sub2
    section: "5.2"
    clause: 5.2.1, second sentence
    paraphrase: "What the carrier holds follows the rules of the unique identifier's scheme, including its syntax where one applies, so that systems interoperate; the syntaxes are those of EN 18219 (5.2.2, which Annex ZA also maps to ESPR-Art10(1)(a))."
    applicability: software
    areas:
      - 4
      - 3
  - id: EN18220-5.2.3-sub1
    section: "5.2"
    clause: 5.2.3, first sentence
    paraphrase: "The carrier supports the character sets that the identifier schemes of EN 18219 require."
    applicability: software
    areas:
      - 4
      - 3
  - id: EN18220-5.2.3-sub2
    section: "5.2"
    clause: 5.2.3, second sentence
    paraphrase: "Option: data other than the identifier may be encoded with the characters of ISO/IEC 8859-1 or ISO/IEC 646."
    applicability: software
    areas:
      - 4
  - id: EN18220-5.3.4-sub1
    section: "5.3"
    clause: 5.3.4, first sentence
    paraphrase: "For consumers, the unique product identifier opens the public DPP information without registering, downloading DPP-specific software or entering credentials. Annex ZA maps 5.3 to ESPR-Art10(1)(c)."
    applicability: software
    areas:
      - 4
      - 11
    mirrors: EN18219-4.6.2(2)
  - id: EN18220-5.3.4-sub2
    section: "5.3"
    clause: 5.3.4, second sentence
    paraphrase: "Recommendation: on smart devices, the software that decodes the carrier comes with the operating system, so nothing has to be installed to read it."
    applicability: software
    areas:
      - 4
  - id: EN18220-5.4.1
    section: "5.4"
    clause: "5.4.1"
    paraphrase: "Statement: the carrier is applied by one of the allowed methods only: marked on the product item, on the packaging, on a label, in an accompanying document, or embedded in the product; the method is chosen with the carrier's persistence in mind, since a lost, damaged or removed mark breaks the link to the identifier. Annex ZA maps 5.4 to ESPR-Art10(1)(b)."
    applicability: operator
    areas:
      - 4
  - id: EN18220-5.4.4(2)
    section: "5.4"
    clause: 5.4.4(2)
    paraphrase: "Recommendation: the economic operator assesses how the carrier is printed, affixed or integrated on packaging or item, for what may affect its durability and persistence."
    applicability: operator
    areas:
      - 4
  - id: EN18220-5.4.5(1)
    section: "5.4"
    clause: 5.4.5(1)
    paraphrase: "Option: the product identifier may be given in a document that comes with the product, on paper or in digital form."
    applicability: mixed
    areas:
      - 4
  - id: EN18220-5.4.5(2)
    section: "5.4"
    clause: 5.4.5(2)
    paraphrase: "Where accompanying documentation is the only place the product identifier appears, the data carrier itself is included in it; on paper (user manual, warranty, printed receipt, conformity documents) or digital (shop web page, digital receipt, customer account, e-mail)."
    applicability: mixed
    areas:
      - 4
  - id: EN18220-5.5.2(2)
    section: "5.5"
    clause: 5.5.2(2)
    paraphrase: "The X-dimension (module size) is chosen so that the barcode scans reliably in the environments it is meant for, such as point of sale or consumers' phones; a smaller module gives a denser symbol that low-resolution scanners and printers handle worse."
    applicability: mixed
    areas:
      - 4
  - id: EN18220-5.6.1
    section: "5.6"
    clause: "5.6.1"
    paraphrase: "The DPP data carrier reaches the minimum quality needed to perform in the environment or environments it targets."
    applicability: mixed
    areas:
      - 4
  - id: EN18220-5.6.2(1)
    section: "5.6"
    clause: 5.6.2(1)
    paraphrase: "Where the print quality of 2D symbols is assessed, the method follows ISO/IEC 15415:2024 (grade, measuring aperture and light wavelength)."
    applicability: operator
    areas:
      - 4
  - id: EN18220-5.6.2(4)
    section: "5.6"
    clause: 5.6.2(4)
    paraphrase: "The symbol quality of marks applied directly to an item's surface and read with a 2D imager is assessed with ISO/IEC 29158."
    applicability: operator
    areas:
      - 4
  - id: EN18220-5.6.3
    section: "5.6"
    clause: "5.6.3"
    paraphrase: "Where the quality of 2D barcode symbols is assessed, the verification follows ISO/IEC 15426-2:2023."
    applicability: operator
    areas:
      - 4
  - id: EN18220-5.6.4(1)
    section: "5.6"
    clause: 5.6.4(1)
    paraphrase: "Where the performance of RFID carriers (UHF or NFC) is assessed, it is tested per ISO/IEC 18046-1:2011, -2:2020 and -3:2020, or with the NFC Forum's tests of tag performance."
    applicability: operator
    areas:
      - 4
  - id: EN18220-5.6.4(3)
    section: "5.6"
    clause: 5.6.4(3)
    paraphrase: "Recommendation: a carrier is write-protected once the EN 18219 identifier has been encoded in it."
    applicability: operator
    areas:
      - 4
  - id: EN18220-5.7.1-sub1
    section: "5.7"
    clause: 5.7.1, first to fourth sentences
    paraphrase: "Recommendation: consumers can tell that a DPP carrier is present, through a visible carrier or, for an RFID or NFC tag they cannot see, a mark showing it is there, without having to read brand name or model number on the label. Annex ZA maps 5.7.1 to ESPR-Art10(1)(b)."
    applicability: operator
    areas:
      - 4
  - id: EN18220-5.7.1-sub2
    section: "5.7"
    clause: 5.7.1, last sentence
    paraphrase: "Recommendation: visible carriers are placed as industry standards say, for efficient scanning and for existing safety requirements."
    applicability: operator
    areas:
      - 4
  - id: EN18220-5.7.2
    section: "5.7"
    clause: "5.7.2"
    paraphrase: "Statement: HRI (human readable interpretation) means printing what the carrier encodes beside it in a typeface that reads well, OCR-B for instance; industries and product-group legislation may set rules for it. Annex ZA maps 5.7.2 to ESPR-Art10(1)(b)."
    applicability: mixed
    areas:
      - 4
  - id: EN18220-5.7.3(1)
    section: "5.7"
    clause: 5.7.3(1)
    paraphrase: "Option: a 2D carrier linking to a DPP may carry a graphical mark that sets it apart from other carriers."
    applicability: mixed
    areas:
      - 4
  - id: EN18220-5.7.3(2)
    section: "5.7"
    clause: 5.7.3(2)
    paraphrase: "Recommendation: where the economic operator uses such a mark, it follows ISO 7000 or IEC 60417 symbol 6452 or 6452-1."
    applicability: mixed
    areas:
      - 4
  - id: EN18220-5.7.4-sub1
    section: "5.7"
    clause: 5.7.4, first sentence
    paraphrase: "DPP carriers do not hinder users of differing abilities; the guidance to weigh includes ISO 19809 for accessible packaging and EN 301 549 V3.2.1 for digital content on the web and on phones."
    applicability: mixed
    areas:
      - 4
      - 11
  - id: EN18220-5.7.4-sub2
    section: "5.7"
    clause: 5.7.4, second sentence
    paraphrase: "Accessibility extends to both the digital and the physical interaction with product, packaging and documentation, so that every consumer can get to the DPP information."
    applicability: mixed
    areas:
      - 4
      - 11
  - id: EN18220-5.8.1
    section: "5.8"
    clause: "5.8.1"
    paraphrase: "The standards a DPP relies on for its carrier and for the carrier's quality are ones ISO and IEC recognise; only where needed are other specifications considered, European standards first, then national standards, then industry-forum specifications; extra software that improves accessibility may be considered too."
    applicability: software
    areas:
      - 4
  - id: EN18220-5.8.2
    section: "5.8"
    clause: "5.8.2"
    paraphrase: "Recommendation: the carriers chosen for DPP use are proven on the market, both in producing the carrier and in capturing and processing what it encodes, to keep disruption low."
    applicability: software
    areas:
      - 4
  - id: EN18220-6.1(2)
    section: "6.1"
    clause: 6.1(2)
    paraphrase: "Each carrier technology of clause 6 holds one or more product identifiers that EN 18219 defines as globally unique. Annex ZA maps 6.1 to ESPR-Art9(2)(d)."
    applicability: software
    areas:
      - 4
      - 3
  - id: EN18220-6.2.2
    section: "6.2"
    clause: "6.2.2"
    paraphrase: "A Data Matrix symbol conforms to ISO/IEC 16022:2024."
    applicability: software
    areas:
      - 4
  - id: EN18220-6.2.3
    section: "6.2"
    clause: "6.2.3"
    paraphrase: "A QR Code symbol conforms to ISO/IEC 18004:2024."
    applicability: software
    areas:
      - 4
  - id: EN18220-6.2.4.1
    section: "6.2"
    clause: 6.2.4.1, Table 1
    paraphrase: "A 2D carrier (Data Matrix or QR Code) can encode a URI, an ISO/IEC 15459 identifier and the granularity level of the product. Annex ZA maps 6.2.4 to ESPR-Art9(2)(d)."
    applicability: software
    areas:
      - 4
      - 3
  - id: EN18220-6.3.2.1
    section: "6.3"
    clause: "6.3.2.1"
    paraphrase: "HF RFID carriers comply with ISO/IEC 14443-1 to -4, ISO/IEC 15693-1 to -3 or ISO/IEC 18000-3 in the editions the text dates."
    applicability: operator
    areas:
      - 4
  - id: EN18220-6.3.2.3
    section: "6.3"
    clause: "6.3.2.3"
    paraphrase: "Data on an HF RFID tag are encoded per ISO/IEC 15961-2:2019 and ISO/IEC 15962:2022."
    applicability: operator
    areas:
      - 4
  - id: EN18220-6.3.2.4
    section: "6.3"
    clause: "6.3.2.4"
    paraphrase: "The HF RFID air interface protocol follows ISO/IEC 14443-1 to -4, ISO/IEC 15693-1 to -3 or ISO/IEC 18000-3."
    applicability: operator
    areas:
      - 4
  - id: EN18220-6.3.3.2
    section: "6.3"
    clause: "6.3.3.2"
    paraphrase: "The NFC air interface protocols follow ISO/IEC 18092:2023 and ISO/IEC 21481:2021."
    applicability: operator
    areas:
      - 4
  - id: EN18220-6.3.3.3
    section: "6.3"
    clause: "6.3.3.3"
    paraphrase: "Data on an NFC tag are encoded per ISO/IEC 15961-2:2019 and ISO/IEC 15962:2022; the NFC Forum specifications say how to encode them for native reading by smart devices."
    applicability: operator
    areas:
      - 4
  - id: EN18220-6.3.4.2
    section: "6.3"
    clause: "6.3.4.2"
    paraphrase: "The RAIN RFID (UHF) air interface protocol follows ISO/IEC 18000-63:2021."
    applicability: operator
    areas:
      - 4
  - id: EN18220-6.3.4.3
    section: "6.3"
    clause: "6.3.4.3"
    paraphrase: "RAIN RFID data are encoded per ISO/IEC 18000-63:2021: with the numbering-system toggle bit at 0 as the GS1 EPC Tag Data Standard 2.3 describes, at 1 as a UII registered under ISO/IEC 15961-2:2019."
    applicability: operator
    areas:
      - 4
  - id: EN18220-6.3.4.4
    section: "6.3"
    clause: "6.3.4.4"
    paraphrase: "RAIN RFID tags and readers are tested for air interface compliance with ISO/IEC 18047-63:2023."
    applicability: operator
    areas:
      - 4
  - id: EN18220-6.3.6
    section: "6.3"
    clause: 6.3.6, Table 2
    paraphrase: "An RF carrier (RAIN RFID, or NFC and HF RFID) can encode a URI (for RAIN RFID: with enough memory), an ISO/IEC 15459 identifier and the granularity level, as its own standards define."
    applicability: operator
    areas:
      - 4
