    areas:
      - 4
    assessment:
      date: 2026-10-12
      commit: dad482466f7c8b760d173b41f2cefab283e9200f
      validator: agent:conformance-review
      operational: false
      status: Not applicable
      evidence: []
      notes: "Operator duty: how durable the surface carrying the code is through use, resale, reuse and repair follows from the economic operator's marking (5.4). The software side, an identifier that stays and keeps resolving through the life cycle, is EN 18219 4.2 (EN18219-4.2.2 rows)."
