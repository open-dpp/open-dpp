  - id: EN18220-4.3.1
    section: "4"
    clause: "4.3.1"
    paraphrase: "Recommendation: a carrier stays usable through repeated use, resale, reuse and repair, which depends on how durable the surface it sits on is; where a new passport is needed, a new identifier and carrier follow."
