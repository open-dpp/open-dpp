  - id: REG1778-Art8(1)
    section: Art8
    clause: Art. 8(1)
    paraphrase: For ESPR delegated-act products a verified economic operator registers the DPP at the granularity (model, batch, item) the delegated act sets.
    applicability: mixed
    areas:
      - 7
      - 3
    operationalisedBy:
      - EN18223
    assessment:
      date: 2026-09-06
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Gap
      operational: true
      evidence:
        - type: code
          ref: packages/dto/src/unique-product-identifiers/unique-product-identifier-type.ts
          note: Gs1Granularity model/batch/item implied by the present GS1 keys
      notes: "Software part: register a passport with the registry at the model, batch or item level the delegated act sets. open-dpp has no client for the EU DPP registry (capability inventory, area 7): nothing registers a passport, captures a registration identifier or talks to the registry API. The API is undocumented and reachable only behind an EU Login session (research/public-sources.md, section 8), so the client cannot be built or checked yet; the Gap is recorded against the requirement, not against the missing documentation. The granularity a GS1 identifier implies exists (Art. 8(3) to (5)) but nothing registers it."
      gapIssue: 579
  - id: REG1778-Art8(2)
