criteria:
  - id: REG1778-Art3(a)
    section: Art3
    clause: Art. 3(a)
    paraphrase: The registry has a website with a secure user interface for operators, value chain actors, national and customs authorities.
    applicability: commission
    assessment:
      date: 2026-09-06
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Not applicable
      operational: false
      evidence: []
      notes: "Commission duty, assessed Not applicable by rule: the Commission builds and runs the registry website and its secure user interface. open-dpp is not the registry."
  - id: REG1778-Art3(b)
    section: Art3
    clause: Art. 3(b)
    paraphrase: The registry has an API for registering DPPs and receiving information from the registry.
    applicability: mixed
    areas:
      - 7
    operationalisedBy:
      - EN18223
    assessment:
      date: 2026-09-06
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Gap
      operational: true
      evidence: []
      notes: "Software part: a client that registers passports through the registry API and receives its responses. open-dpp has no client for the EU DPP registry (capability inventory, area 7): nothing registers a passport, captures a registration identifier or talks to the registry API. The API is undocumented and reachable only behind an EU Login session (research/public-sources.md, section 8), so the client cannot be built or checked yet; the Gap is recorded against the requirement, not against the missing documentation."
      gapIssue: 579
  - id: REG1778-Art3(c)
    section: Art3
    clause: Art. 3(c)
    paraphrase: The registry has a verification platform that confirms the existence and completeness of DPPs.
    applicability: commission
    areas:
      - 7
    assessment:
      date: 2026-09-06
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Not applicable
      operational: false
      evidence: []
      notes: "Commission duty, assessed Not applicable by rule: the verification platform is a registry component. The corresponding software precondition (a passport the platform can read) is assessed under Art. 8(7)."
