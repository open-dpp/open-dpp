    assessment:
      date: 2026-09-06
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Gap
      operational: true
      evidence: []
      notes: "Software part: receive the unique registration identifier from the API response (or let the operator record the one shown in the UI) and keep it with the passport. No field, endpoint or client exists for it. open-dpp has no client for the EU DPP registry (capability inventory, area 7): nothing registers a passport, captures a registration identifier or talks to the registry API. The API is undocumented and reachable only behind an EU Login session (research/public-sources.md, section 8), so the client cannot be built or checked yet; the Gap is recorded against the requirement, not against the missing documentation."
      gapIssue: 579
