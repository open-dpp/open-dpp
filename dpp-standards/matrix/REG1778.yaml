      gapIssue: 824
  - id: REG1778-Art8(10)
    section: Art8
    clause: Art. 8(10)
    paraphrase: The unique registration identifier is returned automatically through the UI or the API response.
    applicability: mixed
    areas:
      - 7
    operationalisedBy:
