  - id: REG1778-Art19(2)
    section: Art19
    clause: Art. 19(2)
    paraphrase: The verified operator keeps the registry information about its DPP accurate, complete and up to date at all times.
    applicability: mixed
    areas:
      - 7
      - 6
    operationalisedBy:
      - EN18223
    assessment:
      date: 2026-09-06
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Gap
      operational: true
      evidence: []
      notes: "Software part: push changes of the registered data (identifiers, commodity code, back-up link, new passport versions) to the registry so it stays accurate and up to date. open-dpp has no client for the EU DPP registry (capability inventory, area 7): nothing registers a passport, captures a registration identifier or talks to the registry API. The API is undocumented and reachable only behind an EU Login session (research/public-sources.md, section 8), so the client cannot be built or checked yet; the Gap is recorded against the requirement, not against the missing documentation."
      gapIssue: 579
  - id: REG1778-Art19(3)
