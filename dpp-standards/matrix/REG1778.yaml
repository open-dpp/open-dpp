      notes: A batch-level GS1 identity (GTIN plus AI 10) carries the model identifier (GTIN); non-GS1 identifiers carry none, and no link from a batch passport to a model passport exists (#597).
      gapIssue: 597
  - id: REG1778-Art8(6)
    section: Art8
    clause: Art. 8(6)
    paraphrase: Registration happens either through the secure user interface or through the API.
