      notes: "Software part: protect the credentials and IT system used to reach the registry. open-dpp's own access is hardened (session and API-key authentication, API keys stored hashed and shown once, rate limiting, per-element access rules), but no registry credential or authentication token (Art. 2(3)) is stored or handled because no registry client exists; the measures for those are part of the client (#579)."
