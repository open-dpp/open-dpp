      operational: true
      evidence: []
      notes: "Software part: either an API registration or a file the operator can upload through the registry UI (the UI accepts XML/JSON registration files, research/public-sources.md section 8). open-dpp produces neither: no client and no export in the registry's upload format (the client Gap is detailed under Art. 3(b))."
      gapIssue: 579
