          note: proprietary open-dpp:json export envelope, versions v1 to v5
        - type: code
          ref: apps/main/src/open-api-docs/index.ts
          note: OpenAPI 3.1 document of the passport API
        - type: check
          ref: export.aas-environment-verifies
          result: failed
          date: 2026-09-07
      notes: "Software part: passport content the registry can read by machine. open-dpp serves structured JSON over a documented OpenAPI, but its export is a proprietary open-dpp:json envelope, not standard AAS JSON (the export.aas-environment-verifies Check fails, see BATT-Art77(5)); the format the registry reads is fixed by the semantic repository data models, which are not yet published."
      gapIssue: 823
