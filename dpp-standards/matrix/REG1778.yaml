  - id: REG1778-Art8(3)
    section: Art8
    clause: Art. 8(3)
    paraphrase: Where different Union rules require different granularities for the same product, register at the most granular level.
    applicability: mixed
    areas:
      - 3
      - 7
    operationalisedBy:
      - EN18219
    assessment:
      date: 2026-09-06
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: packages/dto/src/unique-product-identifiers/unique-product-identifier-type.ts
          note: Gs1Granularity model/batch/item implied by the present GS1 keys
        - type: code
          ref: apps/main/src/unique-product-identifier/domain/unique.product.identifier.ts
          note: GS1 identity = GTIN plus optional batch and serial
        - type: test
          ref: apps/main/src/unique-product-identifier/domain/unique.product.identifier.spec.ts
      notes: "Software part: represent the passport at the most granular level Union law requires. A GS1 identifier implies model (GTIN), batch (+AI 10) or item (+AI 21) granularity, so an operator can create the passport at any level; open-dpp UUID identifiers carry no granularity, no passport-level granularity field exists and no rule enforces the most granular level (#597)."
      gapIssue: 597
  - id: REG1778-Art8(4)
    section: Art8
    clause: Art. 8(4)
    paraphrase: An item-level DPP links both the batch and the model identifier where those exist.
    applicability: software
    areas:
      - 3
    operationalisedBy:
      - EN18219
    assessment:
      date: 2026-09-06
      commit: d5f8219ecf526f8268cc403900855f728ba2ce8d
      validator: agent:conformance-review
      status: Partial
      operational: true
      evidence:
        - type: code
          ref: apps/main/src/unique-product-identifier/domain/unique.product.identifier.ts
          note: GS1 identity = GTIN plus optional batch and serial
        - type: code
          ref: packages/dto/src/unique-product-identifiers/unique-product-identifier-type.ts
          note: Gs1Granularity model/batch/item implied by the present GS1 keys
        - type: test
          ref: apps/main/src/unique-product-identifier/domain/unique.product.identifier.spec.ts
        - type: test
          ref: apps/e2e/tests/passport-identity/upi-crud.spec.ts
          note: UI flow creating a GTIN plus serial identifier; batch is not exercised
      notes: An item-level GS1 identity (GTIN plus serial) carries the model identifier (GTIN) and, when given, the batch (AI 10) in the same identifier, so both are linked to the passport for GS1-identified products; the domain test asserts GTIN, batch and serial together. Non-GS1 identifiers have no model or batch link, and there is no relationship from an item passport to a batch or model passport (#597).
      gapIssue: 597
  - id: REG1778-Art8(5)
    section: Art8
    clause: Art. 8(5)
    paraphrase: A batch-level DPP links the model identifier where a model exists.
    applicability: software
    areas:
      - 3
    operationalisedBy:
