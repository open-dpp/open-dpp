    pr: 1036
    adversarialReview:
      blockingObjections: 2
      comment: https://github.com/open-dpp/open-dpp/pull/1036#issuecomment-6109251645
    notes: "Ticket #761, Extract and first Assess of EN 18216:2026 with its two normative references in one session (four normative pages; the Extract is the PR's first commit, ahead of the run). Extract: EN18216 11 Criteria (the paragraphs of clause 4, the four formats and two paragraphs of clause 5; clauses 1 to 3, 4(3) (the line describing HTTPS), 4(7) and 5-para6 (pointers to EN 18222 and EN 18221) and the informative Annexes A to D carry no requirement of their own); EN301549 51 Criteria, clause 9 only (the 50 WCAG 2.1 A and AA success criteria and the conformance requirements of 9.6), by the map owner's decision of 2026-10-11 in #761, because EN 18216 cites EN 301 549 only for the human-readable rendering of DPP content, which open-dpp does as web pages; ISO21778 8 Criteria from the free ECMA-404 text (identical to ISO/IEC 21778:2017). Annex ZA maps ESPR Art. 10(1)(d) to clauses 4 and 5, Art. 11(a) to 4 and 5 (technical exchange protocol and data formats only) and Art. 11(h) to 4; operationalisedBy reconciled: EN18216 added to ESPR-Art11(h), kept on ESPR-Art10(1)(d), 11(a), BATT-Art77(5) and 78(a). Assess against main ea05ef20: EN18216 1 Met (4(6), RESTful API), 8 Partial, 2 Gap (5(b) XML and 5(c) JSON-LD, both optional); ISO21778 8 Met; EN301549 32 Met, 18 Partial, 1 Gap (9.4.1.3 status messages). Findings: open-dpp serves plain HTTP/1.1 and leaves TLS and HTTP/2 to an operator proxy it neither ships nor documents (#1027); JSON is the format throughout, but nothing negotiates a representation: the Digital Link and the permalink always lead to the single-page app, HTML and JSON live at different URLs, and no XML or JSON-LD exists (#1034); one value-only read route does not answer a JSON text for every element type, recorded in a private finding and not described here until fixed; the presentation view misses WCAG 2.1 AA on text alternatives (operators cannot set them), names and labels, page language and title, contrast, links in chat replies told apart by nothing, reflow of long values, carousel pause, hover tooltips and status messages, and no accessibility statement exists (#1035; language of parts with #838). Law rows: under the Annex ZA rule, ESPR-Art10(1)(d) and 11(a) (still unassessed, waiting for #759 and #762) are at most Partial while EN 18216 clauses 4 and 5 are not Met; ESPR-Art11(h) (Partial), BATT-Art77(5) and 78(a) were assessed before this text and wait for the text trigger of #768. Defect found while building the subject: valueType xs:anyURI (the AAS JSON spelling) and any unknown valueType answer 500, filed as bug #1033. Remarks for #759 (EN 18222): the OpenAPI document is served only with OPEN_DPP_BUILD_API_DOC, which the configuration reference does not list, omits the GS1 resolver routes, and describes export and import with the 1.0 export schema while the export is 6.0. Checks: the conformance subject now carries a content submodel (five property types, multilingual text, an image, a PDF, a collection, a list; subject-content.ts), because on the empty subject the axe Check passed without anything to judge; new Checks a11y.page-language-follows-selection, a11y.page-title-names-passport, format.public-reads-are-json, format.malformed-json-refused, format.digital-link-negotiates-representation, transport.tls-1-2-minimum and transport.http2-offered (the two transport Checks run only against an HTTPS Instance; their handshake logic was tried against public hosts); EN18216-5-para3 and EN301549-9.6 tagged on a11y.public-view-no-serious-violations. Run 2026-10-11 against an Instance built from ea05ef20 in a git worktree (OPEN_DPP_COMMIT; the first run timed out in conformance-setup during the Vite warm-up as before): 10 passed, 3 skipped (HSTS, TLS floor and HTTP/2 on plain http), 5 failed, all on Partial rows: export.aas-environment-verifies (known), a11y.public-view-no-serious-violations (6 violations now that the subject has content; it also tags ESPR-Art11(b)), the two new a11y Checks and the negotiation Check. The fold re-dated the check evidence of the other texts. Manual verifications on the same Instance (2026-10-11): full axe audit at 1280 and 320 pixels, keyboard walk with focus screenshots, reflow at 320 and 640 pixels, text-spacing override, language switch, colour measurements, image preview dialog, chat, character keys, refused audio and video uploads, content-negotiation probes, malformed JSON. Context only: the hosted instance cloud.open-dpp.de (Caddy) refuses TLS 1.0 and 1.1, offers h2 and h3 and still answers HTTP/1.1. Not assessed: the editor and back office (outside EN 18216's reach, see the EN301549 header) and the AI chat with AI enabled (no model key on the Instance). Adversarial review (2026-10-11, fresh agent, PR comment, 2 blocking objections, both applied): (1) EN301549-9.1.4.1 Met -> Partial (#1035): a link inside a chat reply (Markdown rendered into gray text) is not distinguishable from the text around it, verified on the Instance; (2) the EN301549 header paraphrased the EN 18216 accessibility sentence too closely, reworded. Remarks applied: the manual evidence names the audit passport (permalink eb36457f, built through the API) as distinct from the Check subject; the range is reported missing rather than rendered blank (9.1.3.1); 9.6 no longer counts the missing accessibility statement as a conformance requirement; 9.2.4.7 states the weak navigation focus background; 5-para5 says Firefox and WebKit run locally, CI Chromium only; the body-handler note says the versioned auth routes are parsed too; the axe Check now also runs the wcag21a rules (Checks re-run 2026-10-12: same 10 passed, 3 skipped, 5 failed, folded). Map-owner decision on the optional-format remark (2026-10-12): only mandatory clauses of an EN cap a law row under the Annex ZA rule; optional and recommended clauses stay graded as enablement but do not cap (map Notes). Left open: ESPR-Art11(b) credits an accessible public view and its axe Check now fails on the content-bearing subject; a check trigger re-assesses it (listed on #768); format.public-reads-are-json does not cover the value-only reads, to extend once the private finding is fixed."
