    notes: "Ticket #758, Extract and first Assess of EN 18239:2026 in one session (an 18-page text; the Extract lands in the same PR, ahead of the run). Extract: 39 Criteria from the final text (clauses 4.1, 4.2, the 24 points of 5.2, 6.1 to 6.5); clauses 1 to 3, 5.1, 6.4.1, Annex A (informative) and the Bibliography carry no requirement of their own. Annex ZA maps only clause 4.2, to ESPR Art. 11(a) (organisational interoperability); by the map owner's decision of 2026-10-09 operationalisedBy holds Annex ZA plus the links the text supports: EN18239 added to ESPR-Art11(a), removed from ESPR-Art7(2)(b)(iii) and the 34 BATT Annex XIII content-attribute rows, kept on the access-class chapeaus, BATT Art. 77(2), (6), (9) and 78(b), (f), (h), ESPR Art. 9(2)(f), (g), 10(1)(e), (g), 11(b), (f), (h), 11 fourth subparagraph and 15(4), REG1778 Art. 12(2)(d), 19(3) and 20(2). sources.yaml: edition and url moved from the draft to the final text, normative reference EN18219, watch on the OJ citation. Assess against main 272eab96 (273 commits after d5f8219e, the commit of every earlier run): 38 of 39 assessed, 3 Met (5.2(2) public reading without authentication, 5.2(3) no refusal by location, 6.2(1) read-only public scheme), 26 Partial, 4 Gap (5.2(1) and 5.2(8) operator identifier, 5.2(12) issuer authentication, 5.2(18) delegation), 5 Not applicable (the operator recommendations 5.2(21), 6.4.2, 6.4.3, 6.5.2-sub2, 6.5.5). EN18239-6.5.1 is left unassessed: it defers availability levels to implementing acts that do not exist; re-validate when one is adopted. The optional clauses 5.2(14) and 5.2(15) are assessed as enablement. Finding: open-dpp has the mechanics of access control (authentication on every non-public route, element-level Create, Read, Edit and Delete rules per role, draft gating, anonymous public reads) but only for the economic operator's own people and the public: no operator identifiers, credentials or external actor roles, no delegation or emergency revocation, a change history that is neither complete nor tamper-evident, no rate limit on public reads, and little hardening. New clusters: #1023 actor identity and authentication (6 rows), #1024 tamper-evident audit log (2), #1025 access rights life cycle and operator guide (5), #1026 rate limiting (3), #1027 hardening and recovery (3); linked #821 (6), #836 (3), #840 (1), #824 (1). Checks run 2026-10-09 against an Instance built from 272eab96 in a git worktree (OPEN_DPP_COMMIT): 9 passed, 1 skipped (HSTS on http), 1 failed (export.aas-environment-verifies, the known standard-AAS finding, still present at 272eab96, on Partial rows of other texts only). Eight EN18239 tags were added to five existing Checks; the fold refreshed the check dates of the BATT, CPR, DET, ESPR, REG1778 and TOYS rows. Access-control observations went to the private security review (#772); no status rests on them, the rows they touch are Partial for the reasons given. Adversarial review (2026-10-09, fresh agent, PR comment, 4 blocking objections, all applied): (1) EN18239-5.2(10) Met -> Partial (#836): an element inside a table cannot carry a rule of its own, which security.spec.ts itself asserts; 5.2(23) notes say so too. (2) EN18239-5.2(2) and 6.2(1) cited the public-view E2E tests of presentation-bignumber.spec.ts, which are fixme at 272eab96: replaced by the domain test of subject-readable values, the permalink spec's anonymous-PATCH refusal and a dated manual verification on the 272eab96 Instance (an anonymous caller reads an element value through the public submodel and $value routes; anonymous element writes answer 404 and 403); the Met claims now rest on the API, not the rendered view. (3) The derived entry CPR-Art78(f) did not hold (CPR adds the right to access, like BATT-Art78(f)): converted to an own Criterion by an Extract correction of CPR.yaml in this PR, its derived entry dropped from run 2026-10-09-manual (the recorded scope again equals matrix:affected) and assessed in run 2026-10-09-manual-2. (4) ESPR-Art10(1)(e) Partial -> Met on its software part, read as DET-Art22(h) and TOYS-Art20(10) read the same limb; #1025 no longer tracks it. Remarks applied: ESPR-Art11(f) notes say what the Checks and the manual verification evidence; #821 comment now covers access by life-cycle stage (EN18239-4.1) and CPR-Art78(f); #836 comment gained EN18239-5.2(10); sources.yaml url points at the final DIN edition. Remarks answered, left for the reviewer of record: a text trigger on EN18239 would also re-read 21 law rows earlier runs assessed without this text (ESPR-Art9(2)(f), 9(2)(g), 15(4), 14 BATT access rows, REG1778-Art12(2)(d), 19(3), 20(2); ESPR-Art11(a) waits for #762), proposed for the end-to-end run #768; the fold re-dates check evidence on rows outside both scopes (results of 272eab96 on Assessments of d5f8219e), as in every earlier run; EN18239-6.1-sub2 stays Partial (an API key authenticates a component only as the person who made it); permissive 5.2(14) and 5.2(15) graded as enablement by choice; 6.5.1 unassessed (no content of its own) while 5.2(13) is graded against Annex A and 5.2(12) as a conditional the software cannot meet at all; the EN18239 link on ESPR-Art10(1)(e) kept as the map owner approved it (EN 18239's scope names data protection); stale 'unassessed' mentions in CPR-Art77(1)(g), DET-Art22(h) and the #836 body belong to those rows' next re-validation."
