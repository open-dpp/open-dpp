    notes: "Ticket #831, first CPR assessment (Assess procedure, code trigger over CPR, gated-text-free): 41 own Criteria, 0 Met, 31 Partial, 2 Gap, 8 Not applicable; the 15 Mirrors inherit their ESPR targets (3 Partial, 4 Not applicable, 8 Not assessed until the ESPR Art. 10 to 12 rows are assessed by #756-#763). Finding: open-dpp enables the generic passport mechanics the CPR reuses from ESPR (create, hold, update, publish and serve a passport; permalink and GS1 Digital Link carriers with a conformant resolver; per-element access rules) but nothing construction-specific: no declaration of performance and conformity, REACH, technical-documentation or Annex IV structure (new cluster #834), no passport-to-passport link for key parts (new #835), no product-type granularity or manufacturer product-type code (#597), no operator or facility identifiers and no registry client (#579), no back-up or continuity for the 25-year system and 10-year operator availability (#596, #825), no access levels for external actors (#821), export not standard AAS (#823), the QR carrier only on screen with no download (#489), and operator docs silent on permalinks, carriers and public access (#828). New finding beyond the ESPR runs: the media download and info routes are anonymous and check neither passport status nor element read policy, so a hidden or draft attachment stays downloadable by anyone holding its id (new #836, on CPR-Art78(g); noted on 77(1)(g) and 75(2)(c)). The Art. 75(1) delegated act does not exist: CPR-Art75(1) names the rows it may change (identifiers and carriers, registry, access levels, storage, back-up) and each such row says so. Checks run 2026-09-07 against a local dev instance built from the branch head 2152c281, whose merge-base with main is 9c560822; the 45 main commits since touch none of the read, resolve, export, OpenAPI or public-view paths the eleven Checks exercise (adversarial review, remark 1), so the results transfer and no status rests on a Check. Nine