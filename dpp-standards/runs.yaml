    notes: "Ticket #766, gated-text-free (Assess procedure, manual trigger over 43 ids because matrix:run has no per-article scope): ESPR Art. 7(2)(b), 7(5), 9, 14, 15 and the Annex III rows no EN operationalises (chapeau, (a), (d), (e), (f), (j), third paragraph); Annex III (b), (c), (g)-(i), (k), (l) and the standards paragraph stay with the EN 18219, 18221 and 18220 assessments (#756, #760, #757). Result: 0 Met, 28 Partial, 1 Gap, 14 Not applicable. Finding: every ESPR content element (Art. 7 information, substances of concern, Annex III (a), (e), (f), (j), para 3) is modellable with the generic AAS template but nothing ESPR-specific ships (new cluster #827); Art. 9(2)(e) is done in software (permalink, GS1 Digital Link, QR code, anonymous access, resolver Check passes) but docs/ never mentions any of it (new cluster #828, Met once documented); the Art. 9(2) access, update and availability rows fall to the existing clusters #821, #825, #597, #489; Art. 15(1) and Annex III (d) to the registry client #579; Art. 9(1) completeness to #826. #516 (DIN norm, empty) closed as the ticket asked. Checks re-run on 2026-09-06 against a branch build (2152c281, apps unchanged versus the assessed main d5f8219e for the checked behaviours) with new tags: resolver.redirect-published -> Art9(2)(e), access.anonymous-reads-published -> Art9(2)(f), access.anonymous-denied-management and access.foreign-user-denied-management -> Art9(2)(g); 9 passed, 1 skipped (HSTS on http), 1 failed (export.aas-environment-verifies, the known standard-AAS finding, on Partial rows only). The fold refreshed the check dates on the BATT and REG1778 rows too. Adversarial review (2026-09-06, fresh agent, 1 blocking objection, applied): AnnexIII(e) test evidence pointed at media.controller.spec.ts, which only instantiates the controller; replaced by media.service.spec.ts (upload and download cases) and virus-scan.file-validator.spec.ts. Non-blocking remarks applied: operational harmonised to true on Art7(5)(a)(i)-(iv), (b), (c) like their siblings; Art9(2)(h) notes say no arrangements exist yet to assess against; Art15(1) notes say why Gap and not Partial (capture from the registry, not storage). Remarks left for the reviewer of record: the Check build is the branch head 2152c281, not d5f8219e (differences outside the checked paths); NA rationales point forward to rows still unassessed (Art. 10(1)(d), 10(3)(a), 11(b)); Art9(2)(c) applicability (operator) may become mixed once a print-ready carrier exists, an Extract-level change."
