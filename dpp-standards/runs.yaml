    notes: "Ticket #760, the ESPR Art. 10(4) and Art. 11 rows EN 18221 addresses or the ticket names (manual trigger), against main 3e00ddab: 0 Met, 3 Partial (Art. 11(c), 11(e), Annex III(l)), 1 Gap (Art. 10(4)), 2 Not applicable (Art. 11 second subparagraph, a provider's conduct; third subparagraph, a Commission power). Art. 11(c): its software part is met (open-dpp can be run by the operator or by a provider hosting for it, EN18221-4.1(1)), but under the Annex ZA rule the map owner adopted on 2026-10-10 (#749 Notes) a law row whose Annex ZA clauses open-dpp misses is at most Partial; EN 18221 Annex ZA routes it through 4.5 alone (replication to the back-up provider, #596). Its Assessment is dated 2026-10-10 (re-graded from Met within this run, same commit and evidence). The 11 derived Mirror entries (CPR-Art75(2)(g); DET-Art21(12)(c), 22(e), 22(g), 23(5), Annex VI A(c); TOYS-Art19(13), 20(5), 20(7), 21(5), Annex VI I(n)) restate their targets with no delta, as verified against the texts in #830; the texts are unchanged. Law rows EN 18221 operationalises that earlier runs assessed without the text (ESPR-Art9(1), 9(2)(i), 11(h); BATT-Art77(5), 77(7)-sub1, 77(8), 78(c), 78(e), 78(g), 78(h); REG1778-Art8(7)(e)) wait for the text trigger of #768. ESPR-Art10(1)(d), 11(d) and 11(g) stay with the data-exchange, identifier and integrity assessments (#761, #756, #763); ESPR-Art11(a) stays with the interoperability assessment (#762). Gap clusters: #596 (Art. 10(4), 11(c), Annex III(l)), #825 (11(e)). Covered by the adversarial review of run 2026-10-09-en18221 (objection 2 concerns this run: Art. 11(c) went Partial -> Met for want of a rule, then back to Partial under the rule the map owner adopted)."
