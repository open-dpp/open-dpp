      comment: https://github.com/open-dpp/open-dpp/pull/1031#issuecomment-6086052861
    notes: "Ticket #760, Extract and first Assess of EN 18221:2026 in one session (a five-page text; the Extract is the PR's first commit, ahead of the run). Extract: 26 Criteria, the paragraphs of clauses 4.1 to 4.5 (the subclauses have no numbered points, so 4.2(5) is the fifth paragraph of 4.2); clauses 1 to 3, 4.1(6) (no storage technology imposed), 4.1(8) (pointer to EN 18223, informative), 4.2(1) (describes the archive function) and the Bibliography carry no requirement of their own. Annex ZA maps ESPR Art. 10(4) to 4.3 and 4.5 (technical aspects of the back-up only, not its existence) and Art. 11(c) to 4.5. operationalisedBy reconciled to Annex ZA plus the links the text supports: EN18221 added to ESPR-Art9(1) (4.1(2)), 10(1)(d) (4.1(5)), 11(d) (4.1(4)), 11(g) and 11(h) (4.1(7), 4.2(8)) and BATT-Art77(5), 77(7)-sub1, 78(g), 78(h); removed from BATT-Art78(d), ESPR-Art11-sub2, 11-sub3 and REG1778-Art3(f), 8(9)(c), 10(2), 10(3) (provider conduct, Commission powers and the registry's own versioning, which the text does not touch); kept on ESPR-Art9(2)(i), 10(4), 11(c), 11(e), Annex III(l), BATT-Art77(8), 78(c), 78(e) and REG1778-Art8(7)(e). Assess against main 3e00ddab: 25 of 26 assessed, 2 Met (4.1(1) storage by the operator or a provider acting for it, 4.4(1) documentation included by reference and reachable), 12 Partial, 11 Gap, 0 Not applicable. EN18221-4.1(9) is left unassessed: it has no content of its own beyond what EN 18220 and EN 18222 need from storage, which their assessments (#757, #759, blocked by #1021) determine, so it is assessed there with a manual trigger; 4.1(5) and 4.5(3) were graded although they name EN 18216 and EN 18222, because their own clauses carry content (generation from storage, replication). 4.1(1) is Met where BATT-Art78(c), the same obligation assessed without this text, is Partial on a stricter reading; it waits for the text trigger of #768. Finding: open-dpp stores only the current state of a passport: no archived versions (the members-only activity history is a list of changes without a baseline or point-in-time retrieval), no back-up copy, replication or back-up-provider role, no DPP lifetime and no continuity once the operator ends. Defect found: publish, archive and restore write no activity at 3e00ddab (PassportService.modifyPassportStatus never starts the change tracker; TemplateService likewise), verified on the Instance and filed as bug #1032; ESPR-Art9(1) (run 2026-09-06-manual-2) credits the history with recording every change and #1024 listed status changes as recorded (corrected by comment); ESPR-Art9(1) is corrected at its next re-validation. New clusters: #1029 version archive (7 rows), #1030 shared concept descriptions (1); linked #596 back-up and replication (9), #825 lifetime and continuity (3), #826 completeness against a data model (1), #823 standard formats (1), #1027 backup and restore (1). Checks run 2026-10-09 against an Instance built from 3e00ddab in a git worktree (OPEN_DPP_COMMIT; the first run timed out in conformance-setup during the Vite warm-up, the second ran): 9 passed, 1 skipped (HSTS on http), 1 failed (export.aas-environment-verifies, the known standard-AAS finding, on Partial rows only). Four EN18221 tags added to three existing Checks (4.1(3) on access.anonymous-reads-published, 4.1(5) on export.aas-environment-verifies, 4.1(7) on the two management-denial Checks); the fold re-dated the check evidence of the other texts with the same results. Manual verifications on the same Instance (2026-10-09): archive gating, history access, value-change recording, missing status-change records, an attachment by reference with anonymous download, and the deletion of an attachment a published passport still uses (the Instance's ClamAV URL must carry the port; OPEN_DPP_CLAMAV_PORT is gone since #714). Adversarial review (2026-10-09, fresh agent, PR comment, 3 blocking objections, all applied): (1) EN18221-4.1(2) Met -> Partial (#826): completeness is the same limb ESPR-Art9(1) holds Partial, the passport does not carry when it last changed, and a stored attachment reference can go stale; (2) ESPR-Art11(c): the reviewer objected to a status capped by Annex ZA without a map rule; graded on the article (Met) in 2a1d6c4f, then capped back to Partial on 2026-10-10 when the map owner adopted the Annex ZA rule (#749 Notes), see run 2026-10-09-manual-3; (3) the 4.3(4) paraphrase and the #825 comment copied an eleven-word span of the text: both reworded, and a nine-word span in the 4.5(3) paraphrase found by a mechanical scan was reworded too (Extract corrections in this PR; the section titles stay verbatim as in EN18239). Remarks applied: 4.1(1) paraphrase says responsible for creating it, its notes no longer call CPR-Art78(c) the same obligation; the unsupported sentence on the instance admin's access dropped from 4.1(1) and ESPR-Art11-sub2 (raised privately); 4.4(1) cites the File element instead of a media-service test; 4.1(4) and #1030 name the draft-template deletion path; 4.1(5) notes separate storage (the shell id is stored) from generation; 4.5(3) paraphrase keeps the obligation, and its notes explain why the channel rows 4.5(3), (4) are Partial while the provider-copy rows 4.3(1)-(3), 4.4(3) are Gap; ESPR-AnnexIII(l) operational; the status-change defect filed as #1032; EN18221 linked to ESPR-Art10(1)(d) and BATT-Art77(5). Remarks answered, left for the reviewer of record: 4.1(9) unassessed by choice (see above); the 4.1(2) test asserts the PATCH response only, the manual read-back carries the claim."
