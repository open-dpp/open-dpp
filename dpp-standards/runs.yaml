    validator: agent:conformance-review
    reviewer: Florian Bieck
    notes: "Ticket #763, Extract and first Assess of EN 18246:2026 in one session (about ten normative pages; the Extract is the PR's first commit, ahead of the run). Extract: 62 Criteria, one per paragraph of clauses 4.1 to 5.4 that carries a requirement (paragraphs as the PDF sets them apart; a paragraph with two requirements gets -sub1 and -sub2) plus the two lists of the normative Annex A.3; 59 own and 3 Mirrors of EN 18239 (4.3(a) of 5.2(2); 4.3(b) and 5.1.5(2) of the two sentences of 5.2(24)); 5.2.2(2) is no Mirror of EN18239-5.2(3) (another subject and a legal proviso). Annex ZA maps only 4.2, to ESPR Art. 11(a), organisational interoperability; operationalisedBy reconciled: EN18246 added to ESPR-Art11(a), 11(b), 11(f), BATT-Art78(b) and 78(f), kept on ESPR-Art11(g), 11(h), 13(2)(a), BATT-Art78(g), 78(h), REG1778-Art8(9)(d) and 9(2)(e). The normative references are the five JTC 24 ENs already in scope, so nothing is to be bought (#1021 unaffected). sources.yaml moves from the draft to the final text. Assess against main ea05ef20: 58 of 59 own Criteria assessed, 9 Met (4.3(d) and 5.4.2(2) public data in a stock browser, 4.3(e) no added measure blocks public access, 5.1.3(3) no third-party component, 5.1.6(1) no request for personal data, 5.1.6(2) no device function, 5.2.2(2) no restriction by location, 5.4.3(4)-sub1 accessibility does not weaken security, 5.4.3(4)-sub2 no access route alters the data), 28 Partial, 18 Gap, 3 Not applicable (4.4(3) the ETSI EN 319 401 policy, 5.3.1(1) the counterfeiting risk assessment, 5.4.1-sub2 training); 5.2.1(4) is left unassessed: it defers to EN 18219 and EN 18220 and gets a manual trigger once #756 and #757 have assessed them, as EN18221-4.1(9) does. The Mirrors show EN 18239's statuses (1 Met, 2 Partial). Finding: open-dpp has no authenticity or integrity mechanism of the data's own: nothing signs, seals or hashes passport data, exports or the activity history, actors have no globally unique identifier and no certificate-based authentication, and no ESDC exists, so the core of the standard (4.1(3), 4.7(1), 4.7(2), 4.7(4), Annex A) is Gap (#824, #1023). The activity history attributes content changes to users but misses creation, status changes (bug #1032, still present at ea05ef20) and deletion and is not tamper-evident (#1024). Privacy of the public view largely holds (no cookie, no form, no third-party request, no device function, each evidenced by a new Check), but the request log records the IP address and user agent of every anonymous visitor, which breaks the unconditional prohibition of 5.1.2 (Gap, #840). The QR code opens the public view with a camera app, but nothing protects the identifier or the carrier and no verifiable entry point exists (new cluster #1037; the operator guide for placing the carrier is #828). Accessibility as in the EN 301 549 run, plus the sign-in page in front of controlled data (a critical ARIA error and a low-contrast button) (#1035). Gap issues: new #1037 (9 rows); linked #824 (8), #1027 (9), #1035 (5), #1023 (4), #1026 (3), #840 (2), #1024 (2), #479, #828, #1029, #1034 (1 each), each with a comment listing its rows; #479 now carries the conformance label. Conditional clauses (map owner's rule of 2026-10-12, recorded in the map Notes): a clause that only constrains a feature open-dpp lacks is Gap in that feature's cluster (4.5(2), 4.6(2), 4.6(4) in #1037, as EN18239-5.2(12)); a clause that protects an outcome open-dpp delivers is graded on the outcome (4.3(e), 5.4.3(4)-sub2 Met). Optional and recommended clauses are graded as enablement and cap no law row; Annex A is read as what an ESDC provides where one is used and caps nothing. Law rows: under the Annex ZA rule ESPR-Art11(a), still unassessed (#762), is at most Partial while EN18246-4.2(3) and 4.2(4) are not Met; ESPR-Art11(g) is assessed in run 2026-10-12-manual; rows that earlier runs assessed without this text and that it operationalises wait for the text trigger of #768: ESPR-Art11(b), 11(f), 11(h), BATT-Art78(b), 78(f), 78(g), 78(h), REG1778-Art8(9)(d) and 9(2)(e). The two REG1778 links are kept on purpose: 4.7(1) makes a DPP verifiable in integrity, which the registry's integrity evidence and the version hash presuppose, though the text names neither. ESPR-Art10(1)(a) to (c) and BATT-Art77(3) are not linked: EN 18246 defers to EN 18219 and EN 18220 for identifiers and carriers (5.2.1(4)) and only adds authenticity on top (4.5, 4.6); those ENs operationalise the rows. Checks: new privacy.public-view-first-party-only, privacy.public-view-no-device-functions (its probe was shown to catch a planted geolocation call), privacy.public-view-asks-no-personal-data, access.public-view-renders-in-plain-browser and access.public-view-renders-on-phone; EN18246 tags added to access.anonymous-denied-management, access.foreign-user-denied-management, a11y.public-view-no-serious-violations and transport.tls-1-2-minimum. Run 2026-10-12 against an Instance built from ea05ef20 in a git worktree (OPEN_DPP_COMMIT; the first run timed out in conformance-setup during the Vite warm-up, as before): 15 passed, 3 skipped (HSTS, TLS floor and HTTP/2 on plain http), 5 failed, all on Partial rows and known from run 2026-10-11 (export, axe, page language, page title, content negotiation). Manual verifications on the same Instance (2026-10-12): the activity list of the published subject, the request log of anonymous reads, axe-core on /signin, and source searches for device interfaces, signing code and location rules. Tooling: matrix:run now honours --commit for every trigger (it read the local main for manual triggers, which was stale here); PLAYBOOK step 2 says so; no spec covers it, since run.ts is a CLI module with top-level effects. Adversarial review (2026-10-12, fresh agent, PR comment, 3 blocking objections, all applied): (1) EN18246-5.1.4(4) followed its clause's sentence once British and American spellings are aligned: reworded, and the n-gram scan now normalises spellings and runs at six words, finding no run left in the paraphrases; (2) paragraph numbers did not match the PDF: 4.7(5) to (7) became 4.7(6) to (8) (4.7(5), users need not verify, carries no requirement), 5.1.7(5) and (6) became (4) and (5), 5.4.3(4) and (5) became 5.4.3(4)-sub1 and -sub2 and 5.4.3(6) became 5.4.3(5), in the matrix, this run's scope, the ESPR-Art11(g) notes and the issue comments; (3) the conditional clauses were graded inconsistently: the map owner chose the rule above. Remarks applied: ten paraphrases reworded and 4.7(4) no longer reads as a duty to check; the header justifies the one-limb Mirrors; 5.1.2 Partial -> Gap; 5.4.3(4)-sub2 Partial -> Met on the outcome, so #824 no longer counts it twice; the A.3 notes state the reading; the 5.1.3(2) notes credit the mounted admin API; 4.6(2) applicability software -> mixed; the #1037 severity says carrier and identifier cryptography lie outside the standard's scope; 5.4.2(2) gained a dated manual check in Chromium and WebKit. One observation of the reviewer went to the private security review; no status rests on it."
