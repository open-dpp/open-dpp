    notes: "Ticket #756, Extract and first Assess of EN 18219:2026 in one session (the Extract is the PR's first commit, ahead of the run). Extract: 77 Criteria, one per numbered item of 4.1.2 to 4.6.2 and of the guidelines 4.3.3 to 4.5.3, and one per lettered item of the scheme requirements of clauses 5 and 6 (5.4.3 and 6.2.3 offer a choice and are one Criterion each); Annex ZA in the file header; EN18219 added to operationalisedBy of ESPR-Art10(1)(d), 10(3)(a), 11(a), 11(b) and 11(e) and dropped from the Commission rows of Art. 12(4) and (5). References: ISO/IEC 646 (through ECMA-6), ISO/IEC 10646, RFC 3986 and ISO/IEC 15418 (through the GS1 General Specifications 25.0) registered as read-throughs, ISO/IEC 15459-2 read through the AIM register; ISO 3166-1 and ISO 639-1 moved down to Not applicable (informative annexes only). Against main dad48246: 12 Met, 16 Partial, 36 Gap, 3 Not applicable, 10 unassessed: 5.1, 5.2.2.1(a), (c), (d), (f), 5.3.2.1(a), 5.3.3(a) and 5.5.2.1(a), (c) rest on GS1 Digital Link 1.6.0, ISO/IEC 18975, ISO/IEC 15459-3, -4, -6 and EN IEC 61406-1 (#1042, #1043), 4.5.2(1) on the rows of EN 18220 (#757). Finding: open-dpp's identifiers are URLs, locked once the passport is published and usable without an account, but (1) the uniqueness check misses two GS1 rules: restricted circulation numbers pass as GTINs, and a GTIN and serial reused under a batch go to a second passport and resolve to it (bug #1046, manual checks, two failing Checks); (2) a base URL may keep |, ^, [ or ] unencoded, so identifiers under it leave RFC 3986 (bug #1048); (3) the registry export sends the oldest permalink's URL and names no scheme; (4) identifiers survive neither export and import nor the operator's cessation; (5) no scheme is offered beyond GS1 Digital Link and open-dpp's own links (no ASC Data Identifiers, Identification Link with EN IEC 61406-2, DID, DOI or 2D data syntax) and no operator or facility identifier exists (clause 6 Gap throughout). Gap clusters, all existing: #518 (21 rows), #1023 (16), #489 (5), #597 (3), #823 (2), #825 (2), #828 (2), #1037 (1). Checks: six new (identifiers.gs1-identity-unique, item-key-single-passport, restricted-gtin-refused, published-identity-locked, published-permalink-locked, uris-ascii-rfc3986) and EN 18219 tags on four existing ones; run against an Instance built from dad48246 in a worktree: 19 passed, 3 skipped (transport, plain http), 7 failed (the two identifier findings of #1046 plus the known export, content-negotiation and three accessibility findings). Granularity (#597) surfaced here for the third time after ESPR and REG1778: it stays the Gap cluster of every granularity row and gets no decision ticket of its own, because designing the model is closing a Gap, which the map rules out of scope. Adversarial review: 4 blocking objections, all applied: 4.1.2(1) and 4.2.2(1) Met to Partial (the item key of #1046; the failing Check now tags both); 5.5.2.1(a), (c), (d) are allocation rules, not tag hardware: applicability corrected to software in the Extract, (a) and (c) unassessed like their twins, (d) Met like 5.2.2.1(g); 4.3.2(1) Met to Partial (base URLs, bug #1048, verified on the built schema); 4.5.3(1) kept Met on a dated WebKit check (desktop and iPhone profile) beside the Chromium Checks, Firefox untested (it would not start headless here). Remarks applied: 5.2.2.1(g) re-graded Met (every GTIN uses GS1's agency codes 0 to 9; restricted circulation numbers are a uniqueness point, 4.1.2(2)); resolver.redirect-published now tags 4.6.2(2); the new Checks clean up in finally and assert that unreserved characters stay raw. Left for the reviewer of record: 4.4.2(2) Partial is conservative (each identity's own level is locked; the passport's is not)."
    pr: 1047
    adversarialReview:
      blockingObjections: 4
      comment: https://github.com/open-dpp/open-dpp/pull/1047#issuecomment-6123777497
