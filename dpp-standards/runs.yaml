      blockingObjections: 4
    notes: "First registry assessment (Assess procedure), gated-text-free: 0 Met, 17 Partial, 13 Gap, 54 Not applicable. The Regulation binds mostly the Commission (54 rows NA by rule); the 30 software/mixed rows show that nothing in open-dpp talks to the EU registry: no client, no registration-identifier field, no commodity code, no back-up URL, no hashable passport version; GS1 identity gives implicit model/batch/item granularity only. No Check tags a registry Criterion (registry left manual in #755); the report of 2026-09-05 was folded for the record without effect. Gap clusters: #579 registry client (14 rows incl. the ESPR run), #597 granularity, #596 back-up URL, #824 integrity/versions, #823 standard export, #821 roles, new #826 semantic repository data models. Adversarial review (2026-09-06, 4 blocking objections, all resolved): Art8(4) test note and notes reworded to what the UI spec exercises; Art12(2)(e) language count corrected 31 -> 29 (capability-inventory.md fixed too); Art12(2)(b) notes now credit what earns Partial; Art12(6) notes state why Gap unlike Art3(g)/11(3); Art8(7)(b) over-claim dropped; Art11(4) shell mention; Art11(3) operational; Art8(7)(e) stray evidence dropped. Flagged for the next Extract (applicability changes only there): Art8(9)(d), Art10(2) and Art12(6) read as Commission duties and may move mixed -> commission; ESPR-Art13(4) paraphrase omits 'or putting it into service'. Text quirk: the OJ text of Art. 8(8) cross-references paragraph 6 and Art. 8(10) paragraph 9 where 7 and 8 are meant; the paraphrases follow the evident meaning, watch for a corrigendum. The export.aas-environment-verifies Check is now tagged REG1778-Art8(7) so the next Check run folds onto it."
