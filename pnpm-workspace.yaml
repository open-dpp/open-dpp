packages:
  - apps/*
  - packages/*
  - docs

injectWorkspacePackages: true

# Supply-chain policy: only install versions published at least 24 h ago.
# This is pnpm 11's default, spelled out so every tool that runs pnpm here
# (CI, Docker build, Renovate) applies the same gate at resolution time.
minimumReleaseAge: 1440

allowBuilds:
  "@nestjs/core": true
  "@scarf/scarf": true
  "@swc/core": true
  "@tailwindcss/oxide": true
  better-sqlite3: true
  core-js: true
  esbuild: true
  fsevents: true
  highlight.js: true
  mongodb-memory-server: true
  msw: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
