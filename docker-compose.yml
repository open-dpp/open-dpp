# ⚠️  EXAMPLE DEPLOYMENT - NOT FOR PRODUCTION USE
#
# This Docker Compose configuration is designed for local development and
# testing purposes only. For a production setup use authorization for your
# database.

services:
  open-dpp:
    restart: unless-stopped
    image: ghcr.io/open-dpp/open-dpp:${VERSION:-latest}
    depends_on:
      mongodb:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    ports:
      - "3000:${OPEN_DPP_PORT}"
    env_file:
      - .env

  mongodb:
    image: mongo:7.0
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}) }" | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 30s
      start_period: 0s
      start_interval: 1s
      retries: 30
    volumes:
      - mongo_db:/data/db
      - mongo_config:/data/configdb

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

  # S3-compatible object storage. RustFS replaces MinIO (community edition
  # archived, images pulled from Docker Hub in 2025): Apache-2.0, one
  # multi-arch container, object versioning, a /health endpoint.
  rustfs:
    image: rustfs/rustfs:1.0.0-rc.6
    environment:
      - RUSTFS_ACCESS_KEY=${OPEN_DPP_S3_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${OPEN_DPP_S3_SECRET_KEY}
    volumes:
      - rustfs_data:/data
    ports:
      - "9001:9001" # RustFS console (web UI)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

  # Creates both buckets with object versioning enabled; idempotent, so it is
  # safe to re-run against an existing volume. Nothing reads the buckets
  # anonymously (the backend proxies downloads), so no public-read policy.
  rustfs-init:
    image: rustfs/rc:v0.1.35
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -ec "
      rc alias set local http://rustfs:9000 ${OPEN_DPP_S3_ACCESS_KEY} ${OPEN_DPP_S3_SECRET_KEY};
      rc bucket create local/${OPEN_DPP_S3_DEFAULT_BUCKET} --ignore-existing --with-versioning;
      rc bucket create local/${OPEN_DPP_S3_PROFILE_PICTURE_BUCKET} --ignore-existing --with-versioning;
      "

volumes:
  rustfs_data:
  mongo_db:
  mongo_config:
  api_db:
